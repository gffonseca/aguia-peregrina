# Motor de oportunidades — para cada ato da tabela (tabela_fb1798.yaml), os eventos do processo
# que o tornam cabível e o papel da IA:
#   redige  = a IA prepara o ato; o advogado revisa e assina
#   detecta = ato do juízo/oficial que a IA encontra nos autos e lança na prestação com a prova
#   prepara = exige presença do advogado; a IA prepara roteiro, preposto, diária
# `eventos` são classes de movimento/publicação (mapeáveis aos códigos TPU de movimento).
# `prazo_dias` = prazo útil de referência para abrir a oportunidade (null = sem prazo legal).
