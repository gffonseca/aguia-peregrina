<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triagem BASA</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mut:#5c6670;--ln:#e2e6ea;--ac:#0b6e4f;--alta:#b42318;--media:#b54708;--baixa:#5c6670;--chip:#eef1f4}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1f25;--tx:#e8ecf0;--mut:#9aa5b1;--ln:#2a313a;--ac:#3fb68b;--alta:#f97066;--media:#fdb022;--baixa:#9aa5b1;--chip:#232a32}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header,main{max-width:1100px;margin:auto;padding:16px}header{padding-bottom:0}h1{font-size:20px;margin:0 0 4px}header p{margin:0;color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:4px 0 16px}
.kpi{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:12px 14px}.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}.kpi span{color:var(--mut);font-size:12px}
.barra{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
select,input,button{font:inherit;color:inherit}select,input{background:var(--card);border:1px solid var(--ln);border-radius:6px;padding:5px 8px}
button{border:1px solid var(--ln);background:var(--chip);border-radius:6px;padding:4px 10px;cursor:pointer}button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
h2{font-size:15px;margin:20px 0 6px}h2 small{color:var(--mut);font-weight:400}
.it{background:var(--card);border:1px solid var(--ln);border-left:4px solid var(--baixa);border-radius:8px;padding:10px 12px;margin:8px 0}
.it.alta{border-left-color:var(--alta)}.it.media{border-left-color:var(--media)}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}.as{font-weight:600}.mut{color:var(--mut);font-size:12px}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--chip);font-size:12px}
.acao{margin:6px 0}.tr{color:var(--mut);font-size:13px;margin:4px 0;overflow-wrap:anywhere}.bt{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
a{color:var(--ac)}
#login{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:16px;max-width:420px;display:grid;gap:8px}#login[hidden],#app[hidden],#pap[hidden]{display:none}
textarea{width:100%;min-height:60px;font:13px ui-monospace,monospace;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:6px}
.pp{background:var(--card);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;margin:8px 0}
</style>
</head>
<body>
<header>
  <nav style="font-size:13px;margin-bottom:6px"><a href="/painel/oportunidades">Atos a praticar</a> · <a href="/painel/correcoes">Correções no Benner</a> · <a href="/painel/triagem">Triagem de e-mails</a> · <a href="/painel/recebiveis">Recebíveis</a></nav>
  <h1>Triagem da caixa BASA</h1>
  <p>Cada pessoa vê só o que é dela. Nada é enviado, movido ou apagado no Outlook; o link abre o e-mail original.</p>
</header>
<main>
  <form id="login" hidden>
    <label>Chave de operação<input id="k" type="password" autocomplete="off" required></label>
    <label>Seu e-mail no escritório<input id="u" type="email" required></label>
    <button class="pri">Entrar</button><span class="mut" id="erro"></span>
  </form>
  <section id="app" hidden>
    <div class="kpis" id="kpis"></div>
    <div class="barra">
      <label>Ver <select id="ver"><option value="eu">só o meu</option><option value="tudo">tudo (coordenação)</option></select></label>
      <label>Situação <select id="st"><option value="pendente">pendentes</option><option value="visto">vistos</option><option value="resolvido">resolvidos</option></select></label>
      <button id="btpap" type="button">Pessoas por papel</button>
      <button id="sair" type="button">Sair</button>
    </div>
    <div id="pap" hidden></div>
    <div id="lista"></div>
  </section>
</main>
<script>
const API="";
const ss={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}},del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let cred={k:ss.get("k"),t:ss.get("t"),u:ls.get("u")||""};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CAT={INTIMACAO:"intimação",PRESTACAO_CONTAS:"prestação/pagamento",PROCESSO:"processo",SISTEMA_BENNER:"Benner/acesso",REUNIAO:"reunião",OUTROS:"outros",IGNORAR:"ignorado"};
const fmtCnj=d=>d.length===20?`${d.slice(0,7)}-${d.slice(7,9)}.${d.slice(9,13)}.${d[13]}.${d.slice(14,16)}.${d.slice(16)}`:d;
async function api(p,o={}){const r=await fetch(API+p,{...o,headers:{"X-Ops-Key":cred.k,"X-Tenant-ID":cred.t||"","X-Usuario":cred.u,"Content-Type":"application/json",...(o.headers||{})}});if(!r.ok)throw new Error(r.status+" "+await r.text());return r.json()}
async function carregar(){
  const ver=document.getElementById("ver").value,st=document.getElementById("st").value;
  const q=new URLSearchParams({status:st});if(ver==="eu")q.set("pessoa",cred.u);
  const d=await api("/triagem?"+q);const m=d.metricas;
  document.getElementById("kpis").innerHTML=[["Pendentes",m.pendentes],["Urgentes pendentes",m.urgentes_pendentes],["Cópias internas nos e-mails",m.copias_internas],["Cópias que eram necessárias",m.copias_necessarias]].map(([a,b])=>`<div class="kpi"><span>${a}</span><b>${b}</b></div>`).join("");
  const L=document.getElementById("lista");
  if(!d.papeis.length){L.innerHTML=`<p class="mut">${ver==="eu"?"Nada para você. Se esperava itens, confira se seu e-mail está em algum papel (botão Pessoas por papel).":"Nada nesta situação."}</p>`;return}
  L.innerHTML=d.papeis.map(p=>`<h2>${esc(p.descricao||p.papel)} <small>· ${p.pessoas.map(x=>esc(x.nome||x.email)).join(", ")||"sem pessoa definida"} · ${p.itens.length}</small></h2>`+p.itens.map(i=>`
   <div class="it ${i.urgencia}"><div class="top"><span class="chip">${CAT[i.categoria]||i.categoria}</span><span class="as">${esc(i.assunto)}</span></div>
   <div class="mut">${esc(i.remetente)} · ${i.recebido_em?new Date(i.recebido_em).toLocaleString("pt-BR"):""}${i.processos.length?" · "+i.processos.map(fmtCnj).join(", "):""}${i.fichas.length?" · "+esc(i.fichas.join(", ")):""}${i.copiados>i.necessarios?` · <b>${i.copiados} do escritório copiados</b>`:""}</div>
   <div class="acao"><b>Fazer:</b> ${esc(i.acao)}</div><div class="tr">${esc((i.trecho||"").slice(0,280))}</div>
   <div class="bt">${i.link?`<a href="${esc(i.link)}" target="_blank" rel="noopener">Abrir no Outlook</a>`:""}
   ${i.status!=="visto"?`<button data-id="${i.id}" data-s="visto">Visto</button>`:""}${i.status!=="resolvido"?`<button data-id="${i.id}" data-s="resolvido" class="pri">Resolvido</button>`:`<button data-id="${i.id}" data-s="pendente">Reabrir</button>`}</div></div>`).join("")).join("");
}
document.getElementById("lista").addEventListener("click",async e=>{const b=e.target;if(!b.dataset.id)return;b.disabled=true;
  try{await api("/triagem/"+b.dataset.id,{method:"PATCH",body:JSON.stringify({status:b.dataset.s})});await carregar()}catch(err){alert("Não salvou: "+err.message);b.disabled=false}});
document.getElementById("ver").onchange=carregar;document.getElementById("st").onchange=carregar;
document.getElementById("btpap").onclick=async()=>{const P=document.getElementById("pap");if(!P.hidden){P.hidden=true;return}
  const ps=await api("/triagem/papeis");P.hidden=false;
  P.innerHTML=`<p class="mut">Uma pessoa por linha: <code>Nome; email</code>.</p>`+ps.map(p=>`<div class="pp"><b>${esc(p.papel)}</b> <span class="mut">${esc(p.descricao)}</span><textarea data-p="${esc(p.papel)}">${p.pessoas.map(x=>`${x.nome}; ${x.email}`).join("\n")}</textarea><button data-salvar="${esc(p.papel)}">Salvar</button></div>`).join("")};
document.getElementById("pap").addEventListener("click",async e=>{const p=e.target.dataset.salvar;if(!p)return;
  const t=document.querySelector(`textarea[data-p="${p}"]`).value.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const[a,b]=l.split(";").map(x=>(x||"").trim());return b?{nome:a,email:b}:{nome:"",email:a}});
  try{await api("/triagem/papeis/"+encodeURIComponent(p),{method:"PUT",body:JSON.stringify(t)});e.target.textContent="Salvo";setTimeout(()=>e.target.textContent="Salvar",1200);carregar()}catch(err){alert(err.message)}});
document.getElementById("login").addEventListener("submit",async e=>{e.preventDefault();cred.k=document.getElementById("k").value.trim();cred.u=document.getElementById("u").value.trim().toLowerCase();
  try{const r=await fetch("/faturamento/basa/setup",{method:"POST",headers:{"X-Ops-Key":cred.k}});if(!r.ok)throw new Error("chave inválida");cred.t=(await r.json()).tenant_id;ss.set("k",cred.k);ss.set("t",cred.t);ls.set("u",cred.u);iniciar()}catch(err){document.getElementById("erro").textContent=err.message}});
document.getElementById("sair").onclick=()=>{ss.del("k");ss.del("t");location.reload()};
async function iniciar(){document.getElementById("login").hidden=true;document.getElementById("app").hidden=false;try{await carregar()}catch(e){ss.del("k");document.getElementById("app").hidden=true;document.getElementById("login").hidden=false;document.getElementById("erro").textContent="Sessão expirada: entre de novo."}}
if(cred.k&&cred.t&&cred.u)iniciar();else{document.getElementById("u").value=cred.u;document.getElementById("login").hidden=false}
</script>
</body>
</html>
