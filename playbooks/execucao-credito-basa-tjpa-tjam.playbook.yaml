    categoria: merito
    ordem: 18
    pai: T06
    resumo: >-
      Executado alega direito à renegociação/liquidação com desconto (programas do FNO/crédito
      rural). O direito existe se o contrato se enquadra (fonte, data, valor, região) e o pedido
      foi feito no prazo; fora disso, não suspende a execução. Quando se enquadra, é sinal de
      acordo (T09), não de litígio.
    condicoes_aplicacao:
      - { campo: embargos_materia, operador: contem, valor: renegociacao_rural }
    provas_necessarias:
      - { tipo_documento: cedula, descricao: "Fonte do recurso (FNO/PRONAF), data e valor originais", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: parecer_renegociacao_basa, descricao: "Análise do BASA sobre enquadramento do contrato nos programas vigentes", origem: subsidio, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: parecer_renegociacao_basa, descricao: "Contrato enquadrável e pedido tempestivo do devedor não processado pelo banco", origem: subsidio, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "Lei 13.340/2016 (liquidação e renegociação de dívidas rurais — FNO/FNE/FCO) e prorrogações", tipo: dispositivo, para_que_serve: "enquadramento e prazos", conferido: false, nota: "[A CONFERIR pelo advogado-dono — vigência e prorrogações]" }
        - { ref: "Lei 14.995/2024 (renegociação de operações de crédito rural na Amazônia Legal) [A CONFERIR existência/alcance]", tipo: dispositivo, para_que_serve: "programa recente", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "Lei 11.775/2008; Lei 12.844/2013; Res. CMN / MCR (Manual de Crédito Rural) cap. sobre renegociação; Lei 14.690/2023 (Desenrola) [A CONFERIR quais vigentes]", tipo: norma_regulatoria, para_que_serve: "demais programas", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "Lei 13.606/2018 e Lei 13.729/2018 (securitização / renegociação) [A CONFERIR]", tipo: dispositivo, para_que_serve: "securitização de dívidas rurais", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ — renegociação por lei de crédito rural: direito subjetivo do mutuário quando preenchidos os requisitos; suspensão da execução (Tema repetitivo [A CONFERIR])", tipo: tema, para_que_serve: "risco principal desta subtese", conferido: false, nota: "[A CONFERIR pelo advogado-dono — número do tema e requisitos]" }
      argumentos_chave:
        - "Ônus do devedor: demonstrar enquadramento e pedido administrativo tempestivo."
        - "Se enquadrado, a FBS recomenda ao BASA formalizar a renegociação (T09) — não litigar."
    pedidos:
      - "Improcedência por falta de enquadramento ou de requerimento tempestivo."
    pedidos_subsidiarios:
      - "Suspensão para formalização da renegociação administrativa, com homologação."
    risco_se_mal_aplicada: "Negar renegociação a quem tem direito legal gera suspensão, sucumbência e passivo de dano moral."
    pendencia: "lista dos programas vigentes e política do BASA a obter do cliente"
    ativa: true

  # ---------------------------------------------------------------- (3) EXCEÇÃO DE PRÉ-EXECUTIVIDADE
  - id: T07
    nome: "Resposta à exceção de pré-executividade — cabimento restrito a matéria de ordem pública sem dilação probatória"
    categoria: merito
    ordem: 19
    pai: null
    resumo: >-
      A exceção só cabe para matéria cognoscível de ofício provada de plano (Súmula 393 STJ, por
      analogia); excesso de execução, encargos e fatos que exigem prova são matéria de embargos
      (com garantia). Responder no mérito só o que for de ordem pública; no mais, não conhecimento.
    condicoes_aplicacao:
      - { campo: excecao_pre_executividade_oposta, operador: "==", valor: true }
    provas_necessarias:
      - { tipo_documento: peticao_excecao, descricao: "Petição da exceção e documentos", origem: extracao, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: cedula, descricao: "Título e planilha para demonstrar higidez de plano", origem: subsidio, obrigatoria: true, peso: 0.9 }
    provas_que_afastam:
      - { tipo_documento: certidao_obito, descricao: "Matéria de ordem pública evidente (ex.: óbito anterior ao ajuizamento; pagamento integral comprovado)", origem: extracao, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, arts. 803, parágrafo único, 525 § 11 e 518 (construção doutrinária/jurisprudencial da exceção)", tipo: dispositivo, para_que_serve: "base da exceção e seus limites", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ, Súmula 393 (exceção de pré-executividade: matérias de ofício sem dilação probatória — exec. fiscal, aplicada por analogia)", tipo: sumula, para_que_serve: "limitar o cabimento", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "STJ — excesso de execução não cabe em exceção de pré-executividade (salvo erro aritmético evidente) [A CONFERIR]", tipo: precedente, para_que_serve: "remeter aos embargos", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "STJ — honorários na exceção acolhida/rejeitada [A CONFERIR]", tipo: precedente, para_que_serve: "sucumbência", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Matérias de T06 (excesso, encargos, renegociação) → não conhecimento por via inadequada."
        - "Matérias de ordem pública (prescrição, título inexistente, ilegitimidade): responder com T06.2/T06.5."
    pedidos:
      - "Não conhecimento da exceção (via inadequada) e, no que for de ordem pública, rejeição; prosseguimento."
    pedidos_subsidiarios: []
    risco_se_mal_aplicada: "Responder tudo no mérito legitima a via e abre discussão sem garantia do juízo."
    ativa: true

  # ---------------------------------------------------------------- (4) SUSPENSÃO / PRESCRIÇÃO INTERCORRENTE
  - id: T08
    nome: "Suspensão do art. 921, III e prescrição intercorrente — como evitar, quando aceitar"
    categoria: processual
    ordem: 20
    pai: null
    resumo: >-
      Sem bens, a execução é suspensa por 1 ano (921 III, §1º) e depois começa a correr a
      prescrição intercorrente (§4º), que só se interrompe por efetiva localização de bens
      (§4º-A). A esteira CALCULA POR PROCESSO a data-limite da intercorrente
      (prescricao_intercorrente_data_limite) e os meses restantes (decisão 10); vencimentos
      < 12 meses sobem para T08.1 com diligência útil obrigatória. Para carteira viva/observação:
      diligência útil periódica antes de vencer o prazo. Para carteira morta: a decisão de
      aceitar suspensão/arquivamento é do sócio, caso a caso (T01.1). Processo parado há mais de
      90 dias sem movimentação útil recebe alerta + minuta de impulso para revisão (decisão 9 —
      provisório, alinhar ao SLA do contrato BASA). Alimenta M03/M11/M13.
    condicoes_aplicacao:
      - { campo: fase_execucao, operador: in, valor: [suspensa_921, arquivada_921, penhora_frustrada] }
      - { campo: dias_sem_andamento, operador: ">", valor: 90, nota: "provisorio: true — gatilho de alerta + impulso automático para revisão; alinhar ao SLA do contrato BASA" }
    provas_necessarias:
      - { tipo_documento: andamentos, descricao: "Decisão de suspensão/arquivamento e data; última diligência útil", origem: publicacao, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: andamentos, descricao: "Prazo prescricional intercorrente já consumado sem causa interruptiva (não há o que salvar)", origem: publicacao, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, art. 921, III, §§ 1º a 7º (redação da Lei 14.195/2021: §4º-A, §5º, §6º, §7º)", tipo: dispositivo, para_que_serve: "regime da suspensão e da prescrição intercorrente", conferido: false, nota: "[A CONFERIR pelo advogado-dono — redação vigente e termo inicial]" }
        - { ref: "CPC, art. 1.056 (regra de transição: termo inicial da intercorrente para execuções anteriores a 2016)", tipo: dispositivo, para_que_serve: "ondas antigas (até 2016)", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ, IAC 1 (REsp 1.604.412) — prescrição intercorrente na execução civil: termo inicial e necessidade de intimação", tipo: precedente, para_que_serve: "termo inicial e contraditório prévio", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "STF, Súmula 150 (prescreve a execução no mesmo prazo da ação)", tipo: sumula, para_que_serve: "prazo da intercorrente = prazo do título", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "STJ, Tema 1.064? / tema repetitivo sobre diligências infrutíferas não interromperem a intercorrente [A CONFERIR]", tipo: tema, para_que_serve: "o que conta como diligência útil", conferido: false, nota: "[A CONFERIR pelo advogado-dono — número e tese]" }
      argumentos_chave:
        - "Pedidos genéricos de 'vista' ou 'prazo' não interrompem; só efetiva localização de bens/penhora (921 §4º-A) — logo o calendário de diligências deve ter conteúdo (Sisbajud/Renajud/Infojud com fato novo)."
        - "Cálculo por processo: termo inicial da intercorrente (fim do ano de suspensão ou ciência da primeira diligência infrutífera — regime [A CONFERIR], transição do art. 1.056 para a onda 2015–16) + prazo prescricional do título (3 × 5 anos [A CONFERIR]) = prescricao_intercorrente_data_limite; a fila ordena por meses restantes."
        - "Processo em observação: 1 diligência útil a cada 10–11 meses [ILUSTRATIVO] enquanto houver prazo; se morto, a decisão de não gastar é do sócio (T01.1)."
        - "Gatilho de 90 dias sem movimentação útil (decisão 9): alerta ao advogado da carteira + minuta de impulso da fase gerada automaticamente para a fila de revisão (lote diário). Valor PROVISÓRIO — alinhar ao SLA do contrato BASA."
    pedidos:
      - "Carteira viva: diligência útil (T02.2/T02.3) antes do termo; carteira morta: ciência da suspensão/arquivamento sem recurso somente após decisão do sócio (socio_decisao_carteira_morta)."
    pedidos_subsidiarios:
      - "Antes de reconhecimento de intercorrente: manifestação prévia (921 §5º) apontando causa interruptiva ou suspensiva, se houver."
    risco_se_mal_aplicada: "Gastar diligência em processo morto ou, pior, deixar prescrever processo com garantia."
    ativa: true

  - id: T08.1
    nome: "Prescrição intercorrente a vencer em < 12 meses — prioridade da fila e diligência útil OBRIGATÓRIA antes do vencimento"
    categoria: processual
    ordem: 21
    pai: T08
    resumo: >-
      Decisão 10: todo processo viva/viva_prioritaria/observacao cuja data-limite de prescrição
      intercorrente (CPC 921 §4º) esteja a menos de 12 meses sobe ao topo da fila e recebe,
      obrigatoriamente, uma diligência ÚTIL (com potencial de localizar bens — Sisbajud/Renajud/
      Infojud cumulados com fato novo, CNIB/SREI, penhora de bem conhecido) protocolada antes do
      vencimento. Pedido genérico não cumpre. A proximidade da intercorrente NÃO rebaixa o
      processo a carteira morta (decisão 1): é gatilho de prioridade. A métrica M13 conta os
      processos nessa janela ainda sem diligência útil.
    condicoes_aplicacao:
      - { campo: prescricao_intercorrente_meses_restantes, operador: "<", valor: 12 }
      - { campo: recomendacao_triagem, operador: in, valor: [viva_prioritaria, viva, observacao] }
      - { campo: diligencia_util_antes_intercorrente, operador: "!=", valor: true }
    provas_necessarias:
      - { tipo_documento: andamentos, descricao: "Data da suspensão/arquivamento, última diligência útil e cálculo da data-limite (por processo)", origem: publicacao, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: extrato_saldo_devedor, descricao: "Saldo atualizado para a ordem a sistema", origem: subsidio, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: andamentos, descricao: "Diligência útil já protocolada após o alerta (diligencia_util_antes_intercorrente = true) ou causa interruptiva reconhecida", origem: publicacao, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, art. 921, §§ 4º, 4º-A e 5º", tipo: dispositivo, para_que_serve: "o que interrompe a intercorrente (efetiva localização de bens) e o contraditório prévio", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ, IAC 1 (REsp 1.604.412) e tema repetitivo sobre diligências infrutíferas [A CONFERIR]", tipo: precedente, para_que_serve: "termo inicial e o que conta como diligência útil", conferido: false, nota: "[A CONFERIR pelo advogado-dono — número e tese]" }
      argumentos_chave:
        - "Prioridade: a fila de impulso ordena primeiro por prescricao_intercorrente_meses_restantes (crescente) e só depois por valor; < 12 meses é obrigatória, não sugerida."
        - "Diligência útil = pedido com potencial concreto de localizar/constringir bens; escolher a que ainda não foi feita (ou com fato novo) na ordem da decisão 6."
        - "Checklist do revisor (R11): confirmar que a peça é diligência útil e que será protocolada antes de prescricao_intercorrente_data_limite."
    pedidos:
      - "Diligência útil da fase (peça cumulada T02.2 com fato novo, CNIB/SREI T02.3 ou penhora de bem conhecido) protocolada antes da data-limite; registro de diligencia_util_antes_intercorrente = true."
    pedidos_subsidiarios:
      - "Se houver causa interruptiva/suspensiva não reconhecida: manifestação prévia (921 §5º) demonstrando-a."
    risco_se_mal_aplicada: "Deixar prescrever processo com indício de bens — é o pior desfecho desta tipologia (M11 = 0 em carteira viva)."
    ativa: true

  # ---------------------------------------------------------------- (2/3) ACORDO
  - id: T09
    nome: "Acordo / renegociação — sinal por faixa de dívida, garantia e programa; FBS recomenda → BASA aprova → registro"
    categoria: sinal
    ordem: 22
    pai: null
    resumo: >-
      Não é peça: é a recomendação da FBS ao BASA de aceitar ou PROPOR acordo (valor, desconto,
      parcelamento), respeitando as alçadas internas do banco e os programas legais vigentes.
      Dispara tanto quando há proposta do executado quanto quando a FBS toma a iniciativa
      (T09.1 — score médio com bens parciais, decisão 8). Fluxo fixo: FBS recomenda valor →
      BASA aprova (alçada do banco) → plataforma registra → só então a petição de homologação.
      Dívida com garantia real excutível não se acorda com desconto alto.
    condicoes_aplicacao:
      - { campo: acordo_iniciativa, operador: "!=", valor: nenhuma }
    provas_necessarias:
      - { tipo_documento: extrato_saldo_devedor, descricao: "Saldo atualizado", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: relatorio_triagem, descricao: "Score e fatores", origem: calculado, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: politica_alcadas_basa, descricao: "Política de descontos e alçadas do BASA por faixa/programa", origem: subsidio, obrigatoria: true, peso: 1.0 }
    provas_que_afastam: []
    fundamentacao:
      dispositivos:
        - { ref: "CPC, arts. 3º § 3º, 139, V, 190, 487, III, b, 515, II e 922 (suspensão por convenção)", tipo: dispositivo, para_que_serve: "homologação e suspensão por acordo", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "Política de renegociação do BASA; leis de renegociação rural (ver T06.6)", tipo: norma_regulatoria, para_que_serve: "limites de desconto por programa", conferido: false, nota: "[A CONFERIR pelo advogado-dono — obter do cliente]" }
      precedentes: []
      argumentos_chave:
        - "Homologar e suspender (922) em vez de extinguir: se descumprido, retoma pelo saldo com a cláusula penal."
        - "Pedir inclusão de honorários e custas no acordo (T11)."
        - "A FBS recomenda o VALOR (e desconto, parcelas, racional); quem aprova é o BASA, dentro da alçada do banco; a plataforma registra os dois atos antes de qualquer peça (sinais_acordo.fluxo_aprovacao)."
    pedidos:
      - "Recomendação FBS (valor) → aprovação BASA (alçada do banco) → registro na plataforma → petição de homologação com suspensão até o cumprimento."
    pedidos_subsidiarios: []
    risco_se_mal_aplicada: "Desconto fora da alçada/programa expõe o gestor do banco; acordo sem cláusula de retomada perde a execução."
    pendencia: "política de alçadas e descontos do BASA por faixa e programa a obter"
    ativa: true

  - id: T09.1
    nome: "Proposta ATIVA da FBS — score médio com bens parciais, dentro da política/programa do BASA"
    categoria: sinal
    ordem: 23
    pai: T09
    resumo: >-
      Decisão 8: nos casos de score médio (recomendação viva ou observacao) em que há bens
      localizados mas insuficientes para cobrir a dívida (bens parciais — bens_cobertura_pct entre
      1 e 99 %), a FBS não espera proposta do executado: propõe ativamente, com valor recomendado
      calculado sobre o que os bens cobrem + parcelamento do restante, sempre dentro da política
      de descontos e dos programas do BASA. O fluxo é o mesmo de T09: FBS recomenda valor → BASA
      aprova (alçada) → registro → petição/proposta ao executado.
    condicoes_aplicacao:
      - { campo: recomendacao_triagem, operador: in, valor: [viva, observacao] }
      - { campo: bens_cobertura_pct, operador: ">", valor: 0 }
      - { campo: bens_cobertura_pct, operador: "<", valor: 100 }
      - { campo: renegociacao_em_curso, operador: "==", valor: false }
      - { campo: indicio_fraude_cedula, operador: "==", valor: false }
    provas_necessarias:
      - { tipo_documento: extrato_saldo_devedor, descricao: "Saldo atualizado e memória de cálculo (portal BASA)", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: relatorio_triagem, descricao: "Score, bens localizados e cobertura estimada", origem: calculado, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: politica_alcadas_basa, descricao: "Política de descontos/alçadas e programas vigentes do BASA — define o teto da proposta", origem: subsidio, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: relatorio_garantias, descricao: "Garantia real registrada que cobre a dívida (então expropriar, não propor desconto — quando_nao_acordar)", origem: subsidio, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, arts. 3º § 3º, 139, V e 922; política de renegociação do BASA e programas legais (T06.6)", tipo: dispositivo, para_que_serve: "base da proposta e limites de desconto", conferido: false, nota: "[A CONFERIR pelo advogado-dono — obter política do cliente]" }
      precedentes: []
      argumentos_chave:
        - "Valor recomendado (ILUSTRATIVO — calibrar com a política do BASA): à vista ≥ valor estimado dos bens localizados + custas; ou entrada ≥ bens localizados e saldo parcelado dentro do programa aplicável; desconto só sobre encargos, nunca sobre principal garantido."
        - "A proposta sai em nome do BASA somente após aprovação registrada (acordo_aprovacao_basa_registrada = true); antes disso é recomendação interna (acordo_iniciativa = fbs_proativa)."
        - "Carteira em observacao com bens parciais: proposta ativa evita gastar com leilão de bem de baixa liquidez no interior."
    pedidos:
      - "Recomendação FBS de proposta ativa (valor, desconto, parcelas, racional) → aprovação BASA → registro → proposta ao executado / petição de homologação com suspensão (922)."
    pedidos_subsidiarios:
      - "Se o executado recusar: prosseguir com a expropriação dos bens localizados (T02.4) sem nova proposta por 180 dias [ILUSTRATIVO]."
    risco_se_mal_aplicada: "Propor desconto em processo com garantia real integral destrói valor; propor fora da política do BASA expõe o gestor do banco."
    pendencia: "política de descontos/alçadas e programas vigentes do BASA a obter (pendência externa — Gustavo)"
    ativa: true

  # ---------------------------------------------------------------- (2) INTERIOR / PRECATÓRIAS
  - id: T10
    nome: "Carta precatória, interior e correspondentes (TJPA interior + TJAM Itacoatiara/Manaus)"
    categoria: processual
    ordem: 24
    pai: null
    resumo: >-
      86 % do TJPA é interior e 31 % do TJAM é Itacoatiara: citação, penhora e avaliação dependem
      de precatórias (3,8 % das classes; 6,1 % no TJAM) e de correspondentes. O módulo escolhe
      entre precatória, ato por meio eletrônico, oficial de justiça ad hoc ou correspondente,
      pelo custo e prazo da comarca.
    condicoes_aplicacao:
      - { campo: carta_precatoria_necessaria, operador: "==", valor: true }
    provas_necessarias:
      - { tipo_documento: despacho, descricao: "Despacho determinando o ato a ser cumprido fora da comarca", origem: publicacao, obrigatoria: true, peso: 1.0 }
    provas_que_afastam: []
    fundamentacao:
      dispositivos:
        - { ref: "CPC, arts. 237, III, 260-268 (cartas), 255 (citação em comarca contígua/mesma região metropolitana), 845 § 2º e 848 (penhora por termo/carta)", tipo: dispositivo, para_que_serve: "quando a precatória é dispensável", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "Res. CNJ 354/2020 (atos processuais eletrônicos) e normas TJPA/TJAM sobre precatória eletrônica e custas [A CONFERIR]", tipo: norma_regulatoria, para_que_serve: "custos e forma", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes: []
      argumentos_chave:
        - "Penhora de imóvel pode ser por termo nos autos com averbação, sem precatória (845 §1º) [A CONFERIR]."
        - "Custo da precatória + correspondente entra em custo_diligencias_estimado (T01)."
    pedidos:
      - "Expedição de carta precatória (ou ato por meio eletrônico/termo nos autos quando cabível) com recolhimento das custas devidas."
    pedidos_subsidiarios: []
    risco_se_mal_aplicada: "Precatória para comarca onde o correspondente não existe fica anos parada; o processo entra no KPI de 'sem andamento'."
    ativa: true

  # ---------------------------------------------------------------- SUBSIDIÁRIA
  - id: T11
    nome: "Honorários de sucumbência, custas e despesas — recuperar e quem adianta"
    categoria: subsidiaria
    ordem: 25
    pai: null
    resumo: >-
      Em toda peça com valor: incluir honorários de 10 % fixados no despacho inicial (827), os
      dos embargos e do cumprimento (85 §§ 1º/13), custas e despesas adiantadas (82 §2º). Definir
      com o BASA quem adianta custas de diligência/edital/leiloeiro/precatória (contrato de
      honorários) e registrar no dossiê.
    condicoes_aplicacao:
      - { campo: valor_divida_atualizado, operador: ">", valor: 0 }
    provas_necessarias:
      - { tipo_documento: despacho, descricao: "Despacho inicial com fixação de honorários", origem: publicacao, obrigatoria: false, peso: 0.8 }
      - { tipo_documento: comprovante_custas, descricao: "Guias recolhidas", origem: subsidio, obrigatoria: false, peso: 0.6 }
    provas_que_afastam: []
    fundamentacao:
      dispositivos:
        - { ref: "CPC, arts. 82 § 2º, 85 §§ 1º, 2º e 13, 827 e § 1º (redução pela metade se pago em 3 dias)", tipo: dispositivo, para_que_serve: "sucumbência e custas na execução", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "Leis estaduais de custas TJPA e TJAM; regimentos de custas [A CONFERIR]", tipo: norma_regulatoria, para_que_serve: "valores de diligência/edital/precatória", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes: []
      argumentos_chave:
        - "Honorários são crédito da FBS (ou do BASA conforme contrato) — sempre atualizados na planilha."
    pedidos:
      - "Inclusão de honorários, custas e despesas no valor da execução."
    pedidos_subsidiarios: []
    risco_se_mal_aplicada: "Planilha sem honorários perde crédito; cobrar honorários não fixados é excesso."
    ativa: true

  # ---------------------------------------------------------------- (2) MONITÓRIA
  - id: T12
    nome: "Ação monitória e conversão em execução (título judicial)"
    categoria: processual
    ordem: 26
    pai: null
    resumo: >-
      Para contratos sem força executiva (abertura de crédito em conta, extratos, propostas
      assinadas só pelo devedor): monitória. Sem pagamento nem embargos em 15 dias, constitui-se
      o título executivo judicial de pleno direito (701 §2º) e segue cumprimento (T05). Com
      embargos monitórios, resposta em 15 dias com T06.x adaptadas.
    condicoes_aplicacao:
      - { campo: classe_cnj, operador: "==", valor: monitoria }
    provas_necessarias:
      - { tipo_documento: contrato, descricao: "Prova escrita sem eficácia de título (contrato + extratos)", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: andamentos, descricao: "Citação e decurso do prazo monitório", origem: publicacao, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: cedula, descricao: "Há título executivo extrajudicial (então a via é a execução, não a monitória)", origem: subsidio, obrigatoria: false, peso: 0.8 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, arts. 700 a 702 (701 § 2º conversão; 702 embargos; 702 § 8º)", tipo: dispositivo, para_que_serve: "rito monitório", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ, Súmula 247 (abertura de crédito + extrato = prova hábil à monitória) e Súmula 384 (instrumento de confissão de dívida, ainda que originário de abertura de crédito) [A CONFERIR]", tipo: sumula, para_que_serve: "cabimento", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "STJ, Súmula 339 (monitória contra Fazenda) — irrelevante; Súmula 503/504 (monitória com cheque/nota prescritos: 5 anos) [A CONFERIR]", tipo: sumula, para_que_serve: "monitória de títulos prescritos", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Decorrido o prazo sem embargos: pedir certidão e conversão automática em cumprimento (T05) com multa e honorários."
    pedidos:
      - "Constituição do título executivo judicial e conversão em cumprimento de sentença; ou impugnação aos embargos monitórios."
    pedidos_subsidiarios: []
    risco_se_mal_aplicada: "Ajuizar monitória quando há título executivo (ou vice-versa) custa anos; a tese T06.2 e esta são espelho."
    ativa: true

# -----------------------------------------------------------------------------
# EXCEÇÕES — a esteira para e devolve ao humano
# -----------------------------------------------------------------------------
excecoes:
  - id: X01
    descricao: "Executado falecido sem inventário localizado"
    condicoes:
      - { campo: executado_obito, operador: "==", valor: true }
      - { campo: executado_inventario_aberto, operador: "==", valor: false }
    acao: escalar_advogado_carteira
    acoes_paralelas: [alertar_revisor]
    nota: "Suspensão obrigatória (313 I); habilitar herdeiros exige qualificação segura. Sem herdeiros/inventário localizável → critério (b) de carteira morta (T01.1); decisão de parar é do sócio, caso a caso (X03)."
  - id: X02
    descricao: "Executado em recuperação judicial ou falência"
    condicoes:
      - { campo: executado_recuperacao_judicial, operador: "==", valor: true }
    acao: escalar_socio
    nota: "Execução suspensa/atraída (Lei 11.101, arts. 6º e 49; credor fiduciário e crédito rural com regras próprias [A CONFERIR]); habilitação no juízo universal é peça de sócio."
  - id: X03
    descricao: "Carteira morta (T01.1: sem bens + 3 anos parado | falecido sem herdeiros | valor abaixo do custo) — decisão de baixa/suspensão art. 921 é de SÓCIO, caso a caso"
    condicoes:
      - { campo: recomendacao_triagem, operador: "==", valor: morta }
      - { campo: socio_decisao_carteira_morta, operador: "==", valor: pendente }
    acao: escalar_socio
    acoes_paralelas: [nao_gerar_minuta]
    nota: "Nenhuma peça enquanto o sócio não decidir (socio_decisao_carteira_morta). A decisão é por processo — não em lote, não pelo advogado da carteira (decisão 3). Relatório de carteira morta (T01.1) vai ao sócio; a régua de baixa é do BASA."
  - id: X04
    descricao: "Indício de fraude na cédula (assinatura, emitente nega, inquérito)"
    condicoes:
      - { campo: indicio_fraude_cedula, operador: "==", valor: true }
    acao: nao_gerar_minuta
    acoes_paralelas: [escalar_socio]
    nota: "Não impulsionar título suspeito; comunicar o BASA (compliance). Flag com evidência, nunca rótulo."
  - id: X05
    descricao: "Garantidor terceiro vulnerável (idoso, analfabeto, cônjuge sem outorga, pequeno produtor familiar)"
    condicoes:
      - { campo: garantidor_terceiro_vulneravel, operador: "==", valor: true }
    acao: alertar_revisor
    acoes_paralelas: [escalar_advogado_carteira]
    nota: "Diligência contra o garantidor exige análise humana (risco de nulidade do aval/fiança e de dano reputacional ao banco)."
  - id: X06
    descricao: "Decisão desfavorável ao exequente transitada em julgado"
    condicoes:
      - { campo: decisao_desfavoravel_transitada, operador: "==", valor: true }
    acao: nao_gerar_minuta
    acoes_paralelas: [escalar_advogado_carteira]
    nota: "Não há o que impulsionar; avaliar ação autônoma/novo título ou baixa."
  - id: X07
    descricao: "Cliente orientou suspender (negociação, política, auditoria)"
    condicoes:
      - { campo: cliente_orientou_suspender, operador: "==", valor: true }
    acao: nao_gerar_minuta
    nota: "Registrar a orientação e a data; o processo sai do SLA de impulso enquanto durar."
  - id: X08
    descricao: "Renegociação administrativa em curso ou programa legal aplicável"
    condicoes:
      - { campo: renegociacao_em_curso, operador: "==", valor: true }
    acao: sinalizar_acordo
    nota: "Não impulsionar penhora durante negociação; T09."
  - id: X09
    descricao: "Dados inconsistentes: CNJ duplicado, sem CPF/CNPJ válido, valor em moeda antiga ou saldo sem memória de cálculo"
    condicoes:
      - { campo: cnj_duplicado, operador: "==", valor: true }
    acao: pedir_subsidio
    acoes_paralelas: [alertar_revisor]
    nota: "Consolidar pastas (771 CNJs em 1.638 pastas), obter CPF/CNPJ e recalcular saldo antes de qualquer peça."
  - id: X10
    descricao: "Exceção de pré-executividade ou embargos com prazo fatal em menos de 5 dias"
    condicoes:
      - { campo: prazo_fatal, operador: existe }
      - { campo: embargos_opostos, operador: "==", valor: true }
    acao: alertar_revisor
    acoes_paralelas: [escalar_advogado_carteira]
    nota: "Prioridade máxima na fila de revisão (prazo de 15 dias — CPC 920 [A CONFERIR])."
  - id: X11
    descricao: "Prescrição intercorrente a vencer em menos de 12 meses sem diligência útil protocolada (T08.1)"
    condicoes:
      - { campo: prescricao_intercorrente_meses_restantes, operador: "<", valor: 12 }
      - { campo: diligencia_util_antes_intercorrente, operador: "!=", valor: true }
    acao: alertar_revisor
    acoes_paralelas: [escalar_advogado_carteira]
    nota: "Não para a esteira: sobe o processo ao topo da fila de impulso e exige diligência ÚTIL antes do vencimento (decisão 10). Não é critério de carteira morta."
  - id: X12
    descricao: "Processo viva/observacao parado há mais de 90 dias sem movimentação útil (gatilho de impulso automático)"
    condicoes:
      - { campo: dias_sem_andamento, operador: ">", valor: 90, nota: "provisorio: true — alinhar ao SLA do contrato BASA" }
      - { campo: recomendacao_triagem, operador: in, valor: [viva_prioritaria, viva, observacao] }
      - { campo: impulso_automatico_90d_gerado, operador: "!=", valor: true }
    acao: alertar_revisor
    acoes_paralelas: [escalar_advogado_carteira]
    nota: "Decisão 9: alerta + a esteira gera a minuta de impulso da fase (T02.x/T08) para a fila de revisão do lote diário, sem esperar despacho; marca impulso_automatico_90d_gerado."

# -----------------------------------------------------------------------------
# SINAIS DE ACORDO / RENEGOCIAÇÃO
# -----------------------------------------------------------------------------
sinais_acordo:
  politica: >-
    Polo ativo: acordo é instrumento de recuperação, não de mitigação de condenação. Regra geral
    (ILUSTRATIVA — a política real é do BASA, por faixa de dívida e programa): sem garantia real e
    sem bens localizados, aceitar propostas que recuperem mais que o valor presente esperado da
    execução (score × saldo − custos); com garantia real excutível ou Sisbajud positivo, só
    descontos pequenos de encargos e parcelamento curto. Programas legais (Lei 13.340/2016 e
    sucessoras, PRONAF, securitização, Desenrola) prevalecem sobre a política geral quando o
    contrato se enquadra. Decisão 8 (20/10/2026): em score médio com bens PARCIAIS a FBS propõe
    ATIVAMENTE (T09.1), dentro da política/programa do BASA. Em todos os casos o fluxo é único:
    a FBS recomenda o valor (desconto, parcelas, racional); o BASA aprova dentro da alçada do
    gestor/comitê; a plataforma registra; só então sai peça.
  quando_acordar:
    - condicoes:
        - { campo: recomendacao_triagem, operador: in, valor: [observacao, morta] }
        - { campo: acordo_proposta_valor, operador: existe }
      racional: "Qualquer recuperação em carteira de baixo score supera a alternativa (prescrição intercorrente / parar de diligenciar)."
    - condicoes:
        - { campo: recomendacao_triagem, operador: in, valor: [viva, observacao] }
        - { campo: bens_cobertura_pct, operador: ">", valor: 0 }
        - { campo: bens_cobertura_pct, operador: "<", valor: 100 }
      racional: "Score médio com bens parciais: a FBS propõe ativamente (T09.1) — recupera o que os bens cobrem sem o custo/prazo de leilão e parcela o restante dentro do programa do BASA."
    - condicoes:
        - { campo: programa_renegociacao_elegivel, operador: "!=", valor: nenhum }
      racional: "Programa legal aplicável: o devedor tem direito; litigar só adia e gera sucumbência (T06.6)."
    - condicoes:
        - { campo: bens_localizados, operador: "==", valor: false }
        - { campo: avalistas_n, operador: "==", valor: 0 }
        - { campo: garantia_tipo, operador: contem, valor: nenhuma }
      racional: "Sem garantia, sem aval e sem bens: a proposta é o único fluxo de caixa visível."
  quando_nao_acordar:
    - condicoes:
        - { campo: garantia_tipo, operador: contem, valor: hipoteca }
        - { campo: garantia_registrada, operador: "==", valor: true }
        - { campo: acordo_desconto_pct, operador: ">", valor: 30, nota: "ILUSTRATIVO — limite de desconto com garantia real; calibrar com a política do BASA" }
      racional: "Garantia real registrada excutível: desconto alto destrói valor; preferir expropriação ou acordo sem desconto de principal."
    - condicoes:
        - { campo: indicio_fraude_cedula, operador: "==", valor: true }
      racional: "Título sob suspeita não se renegocia antes da apuração (X04)."
  faixas_valor:
    - grupo_comarcas: "Belém e Região Metropolitana (TJPA)"
      comarcas: ["Belém", "Ananindeua", "Marituba", "Benevides", "Santa Izabel do Pará", "Castanhal"]
      valor_min: 0
      valor_max: 60000.0
      moeda: BRL
      base: "ILUSTRATIVO — faixa de dívida atualizada (até ≈ mediana da carteira, R$ 57,5 mil) em que a plataforma sinaliza acordo por padrão quando não há garantia real; calibrar com valor recuperado × custo por diligência da comarca (M01/M05)"
      calibrar: true
      provisorio: true
      recalibrar_em_dias: 90
    - grupo_comarcas: "Interior do Pará — polos da carteira (TJPA)"
      comarcas: ["Tucuruí", "Marabá", "Rurópolis", "Novo Progresso", "Parauapebas", "Altamira", "Alenquer", "Novo Repartimento", "Itaituba", "Paragominas", "São Félix do Xingu", "Santarém", "Redenção", "Conceição do Araguaia", "Bragança", "Uruará"]
      valor_min: 0
      valor_max: 100000.0
      moeda: BRL
      base: "ILUSTRATIVO — no interior o custo de diligência (precatória, correspondente, oficial) é maior e a sinalização de acordo sobe de faixa; calibrar por comarca"
      calibrar: true
      provisorio: true
      recalibrar_em_dias: 90
    - grupo_comarcas: "TJAM — Itacoatiara e Manaus"
      comarcas: ["Itacoatiara", "Manaus"]
      valor_min: 0
      valor_max: 60000.0
      moeda: BRL
      base: "ILUSTRATIVO — TJAM é quase monotemático (CCB 59,5 %, dívidas pequenas; mediana R$ 55,6 mil); Itacoatiara concentra 31 % do TJAM"
      calibrar: true
      provisorio: true
      recalibrar_em_dias: 90
    - grupo_comarcas: "TJAM — interior (Boca do Acre, Humaitá, Manacapuru, Pauini, Urucará, Coari e demais)"
      comarcas: ["*"]
      valor_min: 0
      valor_max: 100000.0
      moeda: BRL
      base: "ILUSTRATIVO — comarcas de difícil acesso; custo de diligência alto"
      calibrar: true
      provisorio: true
      recalibrar_em_dias: 90
  nota_calibracao: >-
    Aqui `faixas_valor` significa faixa de DÍVIDA ATUALIZADA (valor_divida_atualizado) por grupo
    de comarcas dentro da qual a plataforma sinaliza acordo por padrão quando não há garantia real
    nem bens; acima da faixa a sinalização depende do score e da política do BASA. Faixas são
    provisórias; recalibrar em 90 dias com M01 (valor recuperado) e M05 (custo por diligência).
  alcadas: []
  fluxo_aprovacao:
    recomendacao: "A FBS recomenda o VALOR (desconto %, parcelas, racional com score, bens localizados e custo de diligência; OAB do advogado da carteira) — tanto para proposta recebida do executado quanto para proposta ativa da FBS (T09.1)."
    aprovacao: "O BASA aprova dentro da alçada interna (gestor de recuperação / comitê, por faixa e programa — [A CONFERIR] política do banco); a FBS não aprova desconto nem envia proposta em nome do banco antes da aprovação."
    registro: "A plataforma registra recomendação e decisão (quem, quando, valor, desconto, programa, iniciativa) vinculadas ao caso (acordo_aprovacao_basa_registrada); a proposta ao executado e a petição de homologação só são geradas após o registro da aprovação."
  decisao_final: "A decisão de acordar é do BASA, por recomendação da FBS; a plataforma só sinaliza e registra."

# -----------------------------------------------------------------------------
# ANTIFRAUDE / QUALIDADE DE DADOS ESPECÍFICOS (M4)
# -----------------------------------------------------------------------------
antifraude:
  regra_inviolavel: "Nenhuma checagem produz rótulo de 'fraudador' (nem do executado, nem do garantidor); só flags com evidência. Apenas decisão humana registrada com OAB (human_decide) confirma um flag."
  checagens:
    - codigo: cnj_invalido_ou_duplicado
      descricao: "Número fora do padrão CNJ, ausente, ou repetido em mais de uma pasta do Legal One"
      parametros: { regex_cnj: "^\\d{7}-\\d{2}\\.\\d{4}\\.\\d\\.\\d{2}\\.\\d{4}$", nota: "base: 3.765 fora do padrão/vazios na base toda; 235 sem número e 928 fora do padrão na BASA ativa; 771 CNJs repetidos em 1.638 pastas" }
      severidade: high
      evidencia_esperada: "número bruto, forma detectada (notação científica, 20 dígitos sem máscara, máscara errada, nº antigo) e pastas com o mesmo CNJ"
      implementada_em_m4: false
      calibrar: false
    - codigo: cliente_duplicado_cadastro
      descricao: "BASA cadastrado em 4 contatos distintos (3863, 14574, 15082, 36641) — filtros por contato perdem processos"
      parametros: { contatos_basa: [3863, 14574, 15082, 36641] }
      severidade: medium
      evidencia_esperada: "contato_id usado e lista dos demais"
      implementada_em_m4: false
      calibrar: false
    - codigo: valor_moeda_antiga_outlier
      descricao: "Valor incompatível com a época/classe — execuções de 1992–94 em Belém com > R$ 100 mi (moeda antiga/centavos); qualquer valor > R$ 5 mi exige confirmação"
      parametros: { limite_confirmacao_brl: 5000000, anos_suspeitos: [1990, 1991, 1992, 1993, 1994, 1995], nota: "128 processos > R$ 5 mi; 12 > R$ 100 mi somam ≈ R$ 13 bi" }
      severidade: high
      evidencia_esperada: "valor, ano do CNJ, título e saldo recalculado pelo BASA"
      implementada_em_m4: false
      calibrar: true
    - codigo: distribution_date_placeholder
      descricao: "distributionDate = 01/01/1900 (placeholder de importação) — usar o ano do CNJ"
      parametros: { placeholder: "1900-01-01", nota: "966 processos" }
      severidade: low
      evidencia_esperada: "data cadastrada × ano do CNJ"
      implementada_em_m4: false
      calibrar: false
