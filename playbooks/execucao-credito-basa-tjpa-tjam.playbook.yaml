# =============================================================================
# Águia Peregrina — M0 Playbook — Execução / recuperação de crédito bancário em
# massa — POLO ATIVO (credor = Banco da Amazônia) — TJPA + TJAM
# =============================================================================
# EM REVISÃO (sessão 1 de revisão em 2026-10-20 — Gustavo Fonseca, OAB/PA 12.724).
# Primeira tipologia de polo ativo da esteira: o cliente é o exequente, não o réu.
# Nenhuma citação legal, código CNJ, número de tema ou súmula foi conferido ainda —
# tudo segue "[A CONFERIR pelo advogado-dono]" e `conferido: false`. A sessão 1 fixou
# DECISÕES DE PROCESSO (triagem, impulso, embargos, acordo, monitoramento, amostra);
# os números marcados `provisorio`/ILUSTRATIVO continuam a calibrar com a carteira e
# com o BASA. O validador recusa `status: aprovado` enquanto houver pendência.
#
# Decisões da sessão 1 (20/10/2026) — ver metadata.revisoes e a seção homônima do .md:
#   1. carteira morta (T01.1) = 3 critérios: (a) sem bens após Sisbajud+Renajud+Infojud
#      negativos E > 3 anos sem movimentação útil; (b) executado falecido sem
#      herdeiros/inventário localizável; (c) valor atualizado < custo esperado de
#      diligências + custas. Prescrição intercorrente NÃO é critério de carteira morta
#      (é gatilho de prioridade — T08.1).
#   2. piso de valor para não diligenciar: R$ 10.000 (valor atualizado), provisório,
#      a definir com o BASA (política do banco).
#   3. baixa/suspensão (art. 921) de processo de carteira morta: decisão de SÓCIO, caso a
#      caso (não em lote, não pelo advogado da carteira).
#   4. cessão de crédito não é objeto deste playbook.
#   5. peças de impulso padrão: 300 s, revisor = advogado da carteira, lote diário;
#      intermediárias 600 s; impugnação a embargos 1.200 s.
#   6. após citação sem pagamento: pedido CUMULADO Sisbajud+Renajud+Infojud em uma peça;
#      fallback sequencial se o juízo indeferir (preferência registrada por juízo);
#      depois CNIB/SREI → avaliação/leilão.
#   7. excesso de execução: SEMPRE exigir planilha (CPC 917 §§3º/4º) e pedir rejeição
#      liminar sem ela; recalcular com saldo/memória do portal BASA.
#   8. acordo: a FBS propõe ATIVAMENTE em score médio (bens parciais), dentro da
#      política/programa do BASA; FBS recomenda → BASA aprova → registro.
#   9. processo parado: alerta + impulso automático para revisão aos 90 dias sem
#      movimentação útil (provisório — alinhar ao SLA do contrato BASA).
#  10. prescrição intercorrente (CPC 921 §4º): calcular por processo; priorizar
#      vencimentos < 12 meses; diligência útil OBRIGATÓRIA antes do vencimento.
#  11. amostra do piloto: 200 processos de MAIOR valor atualizado COM bens localizados,
#      excluindo outliers de moeda antiga e processos sem CNJ válido.
#  12. portal BASA: pedir documentação/API ao banco (pendência externa — Gustavo).
#
# Base empírica: radiografia da carteira BASA no Legal One/DataJud (19–20/10/2026,
# /reports "Legal One base FBS"): 16.656 processos ativos; 71% Execução de Título
# Extrajudicial; TJPA 63% (Belém só 14%), TJAM 35% (Itacoatiara 31% do TJAM); 80%
# executados PF; mediana R$ 57,5 mil, p90 R$ 276 mil; 85% com movimento em 2026.
#
# Ordem de prioridade decidida para a esteira (decisão 2026-10-20):
#   (1) triagem de recuperabilidade (carteira viva × morta)        → T01
#   (2) peças repetitivas em massa (impulsos, Sisbajud/Renajud/Infojud,
#       cumprimento de sentença, habilitação, suspensão art. 921)   → T02, T03, T04, T05, T08, T12
#   (3) resposta a embargos / exceção de pré-executividade          → T06, T07
#   (4) monitoramento de prazos/andamentos e priorização do parado  → T08/T08.1 + métricas M03/M04/M11/M13
#
# Fonte da verdade: este YAML. A versão em prosa
# (execucao-credito-basa-tjpa-tjam.playbook.md) é derivada.
# =============================================================================

schema_version: "1.0"

metadata:
  id: execucao-credito-basa-tjpa-tjam
  nome: "Execução / recuperação de crédito bancário em massa — polo ativo (credor = Banco da Amazônia) — TJPA + TJAM"
  tipologia: execucao_credito_bancario_basa
  tribunal: TJPA                      # tribunal principal (63%); TJAM (35%) coberto pelo mesmo playbook — ver observacoes
  reu_tipo: devedor_pf_pj_credito_bancario
  lado: autor
  polo: ativo
  tipo_peca_padrao: peticao_impulso_execucao
  versao: 1
  supera_versao: null
  autor_nome: "Gustavo Fonseca"
  autor_oab: "PA 12724"
  criado_em: 2026-10-20T09:00:00-03:00
  status: em_revisao
  aprovado_por_nome: null
  aprovado_por_oab: null
  aprovado_em: null
  descricao: >-
    Carteira de recuperação de crédito do Banco da Amazônia (BASA) patrocinada pela FBS:
    execuções de título extrajudicial (CCB, cédulas e notas de crédito rural, contratos
    bancários), cumprimentos de sentença, monitórias e os incidentes defensivos do executado
    (embargos à execução, exceção de pré-executividade). O cliente é o exequente. O objetivo da
    esteira não é "vencer a ação", é recuperar valor no menor prazo e com o menor custo de
    diligência, separando carteira viva de carteira morta.
  observacoes: >-
    Em revisão (sessão 1 em 20/10/2026). O campo `tribunal` do schema aceita um único tribunal;
    TJPA é o principal (63,5% da carteira) e o TJAM (34,8%) é coberto por este mesmo playbook —
    as diferenças (Itacoatiara, cartas precatórias, correspondentes) estão em T10 e nas faixas
    por grupo de comarcas. Os códigos CNJ de classe/assunto vieram da tabela TPU de memória e
    estão todos `conferido: false`. O portal do BASA (contratos/cédulas, garantias, extratos,
    saldo devedor e cálculo atualizado) é o subsídio central; a documentação/API foi solicitada
    ao banco (pendência externa em `piloto.pendencias_externas`). Os pesos do score de
    recuperabilidade (T01) são ilustrativos e devem ser calibrados por replay sobre processos
    encerrados (Brier — métrica M10). Cessão de crédito não é objeto deste playbook.
  revisoes:
    - data: 2026-10-20
      por: "Gustavo Fonseca OAB/PA 12.724"
      resumo: "Sessão 1 (execução): triagem, impulso, embargos, acordo, monitoramento, amostra"
  piloto:
    cliente_piloto: "Banco da Amazônia S.A. (BASA) — carteira já patrocinada pela FBS (16.656 processos ativos)"
    plano: >-
      Amostra de 200 processos selecionada por valor e bens (ver `amostra`). Fase 1: rodar T01
      (triagem) em replay sobre a amostra + 200 processos encerrados para calibrar o score.
      Fase 2: peças de impulso (T02/T08) em lote diário com revisão do advogado da carteira.
      Fase 3: impugnações a embargos (T06). Pré-requisito: documentação/API do portal do BASA
      (pendência externa abaixo). KPIs do cliente: valor recuperado, prazo, SLA de impulso /
      processos sem andamento.
    amostra: >-
      Os 200 processos de MAIOR valor atualizado COM bens localizados. "Bens localizados" =
      indício de bens nos andamentos (legalone_andamentos / DataJud): penhora ou arresto
      formalizados, Sisbajud positivo, Renajud com veículo, ou garantia real registrada no
      título (hipoteca / alienação fiduciária / penhor registrado). EXCLUIR: outliers de moeda
      antiga (valor > R$ 5 mi em execuções de 1992–94 — checagem valor_moeda_antiga_outlier) e
      processos sem CNJ válido (checagem cnj_invalido_ou_duplicado). Se, na data da seleção, os
      andamentos forem insuficientes para detectar bens (backfill parcial do Legal One / DataJud
      51,9 % consultado), usar como fallback a garantia real registrada no título (portal BASA).
      A distribuição por tribunal/comarca deixa de ser critério (era 100 TJPA interior / 60 TJAM
      / 40 Belém no rascunho) e passa a ser reportada, não imposta.
    prospeccao: []
    pendencias_externas:
      - descricao: "Pedir ao BASA a documentação/API do portal: contratos/cédulas, garantias, extratos, saldo devedor e cálculo atualizado (memória de cálculo); campos estruturados, quem acessa, frequência de atualização"
        dono: "Gustavo"
        status: aberta
        aberta_em: 2026-10-20
      - descricao: "Obter do BASA a política de acordo/renegociação (alçadas, descontos por faixa e programa) e a régua de baixa; definir o piso de valor para não diligenciar (hipótese R$ 10.000) e o SLA contratual de impulso (hipótese 90 dias)"
        dono: "Gustavo"
        status: aberta
        aberta_em: 2026-10-20

