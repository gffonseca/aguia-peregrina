# -----------------------------------------------------------------------------
# MODELO DE PEÇA (M6) — BIBLIOTECA DE PEÇAS PADRÃO DO POLO ATIVO
# -----------------------------------------------------------------------------
# Uma única estrutura de seções serve a toda a biblioteca; `tipo_peca_prevista` escolhe
# o corpo. Biblioteca (drafts.draft_type): peticao_impulso (T02),
# requerimento_cumulado_sisbajud_renajud_infojud (T02.2 — peça padrão após citação),
# requerimento_sisbajud / requerimento_renajud_infojud (T02.2 — fallback sequencial),
# requerimento_cnib_srei (T02.3), citacao_edital (T02.1), manifestacao_penhora_negativa
# (T02.3/T08), impugnacao_embargos (T06.x), resposta_excecao_pre_executividade (T07),
# cumprimento_sentenca (T05/T12), pedido_suspensao_921 (T08/T01.1 — só após decisão do
# sócio quando carteira morta), habilitacao_herdeiros (T04.1), idpj (T04),
# homologacao_acordo (T09/T09.1). Valores e datas SEMPRE com página (planilha/andamento).
modelo_peca:
  tipo: peticao_execucao_polo_ativo
  formato_saida: markdown
  regra_citacao: "Toda afirmação de fato, valor ou data cita document_page_id (draft_citations): saldo e data-base → página da planilha do BASA; fase/andamento → página do andamento/decisão; título → página da cédula. Sem página, sem afirmação."
  secoes:
    - { ordem: 1, id: enderecamento, titulo: "Endereçamento e identificação", obrigatoria: true, teses_vinculadas: [], instrucoes: "Juízo, vara, comarca, número CNJ, exequente (Banco da Amazônia S.A.), executado(s) com CPF/CNPJ, classe. Em precatória: juízo deprecante e deprecado.", exige_citacao_de_pagina: false }
    - { ordem: 2, id: situacao_processual, titulo: "Situação processual", obrigatoria: true, teses_vinculadas: [T01, T08, T08.1], instrucoes: "Fase atual, data e conteúdo do último andamento útil, diligências já realizadas (com resultado) e despacho pendente. Cada evento com página. Máximo 10 linhas em peças de impulso.", exige_citacao_de_pagina: true }
    - { ordem: 3, id: credito, titulo: "Do crédito exequendo", obrigatoria: true, teses_vinculadas: [T11], instrucoes: "Título (tipo, número, data, vencimento), saldo devedor atualizado com data-base e página da planilha do portal BASA; honorários e custas incluídos. Em impugnação a embargos, incluir os critérios do cálculo e o recálculo na data-base da impugnação.", exige_citacao_de_pagina: true }
    - { ordem: 4, id: fundamento, titulo: "Fundamento do requerimento / da impugnação", obrigatoria: true, teses_vinculadas: [T02, T02.1, T02.2, T02.3, T02.4, T03, T04, T04.1, T05, T06, T06.1, T06.2, T06.3, T06.4, T06.5, T06.6, T07, T10, T12], instrucoes: "Peças de impulso: parágrafo único com a base legal da diligência (só referências conferidas); na peça cumulada (T02.2), um parágrafo para o conjunto Sisbajud+Renajud+Infojud. Impugnação a embargos/exceção: uma subseção por matéria alegada, na ordem do playbook; não enfrentar matéria não alegada; em excesso de execução, a primeira subseção é SEMPRE a exigência da planilha (917 §§3º/4º) com pedido de rejeição liminar quando ela falta.", exige_citacao_de_pagina: true }
    - { ordem: 5, id: requerimentos, titulo: "Dos requerimentos", obrigatoria: true, teses_vinculadas: [], instrucoes: "Pedidos específicos, numerados, com valor e CPF/CNPJ quando for ordem a sistema (Sisbajud/Renajud/Infojud — na peça cumulada, os três pedidos numerados em sequência e o pedido subsidiário de deferimento ao menos do Sisbajud); prazo; intimações necessárias (cônjuge, credores, art. 889).", exige_citacao_de_pagina: false }
    - { ordem: 6, id: acordo_registro, titulo: "Registro de acordo (quando houver)", obrigatoria: false, teses_vinculadas: [T09, T09.1], instrucoes: "Só após registro da aprovação do BASA na plataforma (acordo_aprovacao_basa_registrada): termos, parcelas, cláusula de retomada, pedido de homologação e suspensão (CPC 922). Vale também para proposta ativa da FBS (T09.1).", exige_citacao_de_pagina: true }
    - { ordem: 7, id: anexos, titulo: "Rol de documentos", obrigatoria: true, teses_vinculadas: [], instrucoes: "Planilha atualizada do BASA (sempre), título (quando ainda não nos autos), certidões, guias de custas; cada um com o tipo do playbook.", exige_citacao_de_pagina: false }
  estilo:
    - "Peças de impulso: no máximo 1 página; sem retórica; o juiz do interior lê centenas por semana."
    - "Nunca repetir pedido já deferido/indeferido sem fato novo; dizer expressamente qual é o fato novo."
    - "Valores sempre com data-base e página da planilha; CPF/CNPJ sempre que houver ordem a sistema."
    - "Executado e garantidor são tratados com respeito; produtor rural/pequeno devedor sem adjetivos; impenhorabilidades reconhecidas de plano quando evidentes."
    - "Referências legais só as conferidas no playbook; nunca inventar número de tema, súmula ou acórdão."

# -----------------------------------------------------------------------------
# CRITÉRIOS DE REVISÃO (M7)
# -----------------------------------------------------------------------------
# tempo_minimo_segundos é o piso da peça padrão (impulso, 5 min). Pisos por draft_type
# (REVIEW_MIN_SECONDS_<TIPO>) — decisão 5 de 20/10/2026:
#   300 s  (revisor = advogado da carteira; processamento em LOTE DIÁRIO):
#          peticao_impulso / requerimento_cumulado_sisbajud_renajud_infojud /
#          requerimento_sisbajud / requerimento_renajud_infojud / requerimento_cnib_srei /
#          citacao_edital / manifestacao_penhora_negativa / pedido_suspensao_921;
#   600 s  (peças intermediárias): cumprimento_sentenca / habilitacao_herdeiros /
#          homologacao_acordo;
#   1200 s (mérito): impugnacao_embargos / resposta_excecao_pre_executividade / idpj.
criterios_revisao:
  tempo_minimo_segundos: 300
  papel_minimo_revisor: lawyer
  revisor_final: "advogado com OAB responsável pela carteira BASA (12 pessoas hoje com 1.500–1.950 processos cada — a revisão precisa caber nessa carga); peças de impulso padrão revisadas em lote diário"
  exige_segunda_revisao_se:
    - { campo: tipo_peca_prevista, operador: in, valor: [idpj, habilitacao_herdeiros], nota: "desconsideração e sucessão: sócio" }
    - { campo: acordo_proposta_valor, operador: ">", valor: 100000.0, nota: "ILUSTRATIVO — acordo acima de R$ 100 mil (≈ p75 da carteira) vai a sócio antes de ir ao BASA; calibrar com alçadas do banco" }
    - { campo: acordo_desconto_pct, operador: ">", valor: 30, nota: "ILUSTRATIVO" }
    - { campo: recomendacao_triagem, operador: "==", valor: morta, nota: "decisão 3: baixa/suspensão art. 921 de carteira morta é decisão de SÓCIO, caso a caso — nunca em lote, nunca do advogado da carteira; vale para o relatório de T01.1 e para qualquer pedido_suspensao_921 derivado dele" }
    - { campo: valor_divida_atualizado, operador: ">", valor: 276000.0, nota: "≈ p90 da carteira — ILUSTRATIVO" }
    - { campo: garantidor_terceiro_vulneravel, operador: "==", valor: true, nota: "X05" }
    - { campo: indicio_fraude_cedula, operador: "==", valor: true, nota: "X04" }
  exige_segunda_revisao_tambem:
    - "Medidas atípicas do art. 139, IV (T02.3)."
    - "Toda decisão de parar de diligenciar / aceitar suspensão ou arquivamento (art. 921) / requerer baixa em processo de carteira morta (T01.1): sócio, processo a processo — a plataforma não aceita decisão em lote nem do advogado da carteira."
    - "Primeira impugnação a embargos de cada subtese T06.x gerada pela esteira (amostra de calibração)."
    - "Primeira peça cumulada Sisbajud+Renajud+Infojud (T02.2) em cada órgão julgador (calibra preferencia_juizo_cumulado)."
  autorizacao_dupla: null
  checklist:
    - { id: R01, item: "Saldo devedor, data-base e honorários batem com a planilha do BASA citada (página)", bloqueante: true }
    - { id: R02, item: "Fase processual e último andamento útil conferidos nos autos (página); o pedido não repete diligência recente sem fato novo", bloqueante: true }
    - { id: R03, item: "CPF/CNPJ do(s) executado(s) presente e válido em toda ordem a sistema (Sisbajud/Renajud/Infojud); sem homônimo", bloqueante: true }
    - { id: R04, item: "Todas as referências legais citadas estão conferidas no playbook (nenhum placeholder sobrou)", bloqueante: true }
    - { id: R05, item: "Nenhuma exceção aberta (óbito sem inventário, RJ/falência, fraude na cédula, cliente orientou suspender, carteira morta) sem decisão humana registrada", bloqueante: true }
    - { id: R06, item: "Impugnação a embargos: cada matéria alegada enfrentada com cláusula/página; nenhuma matéria não alegada enfrentada; em excesso de execução, a planilha do embargante foi SEMPRE exigida e, se falta, há pedido de rejeição liminar (917 §§3º/4º); o débito foi recalculado com saldo/memória do portal BASA", bloqueante: true }
    - { id: R07, item: "Impenhorabilidades evidentes (salário, poupança ≤ 40 SM, pequena propriedade rural, bem de família sem hipoteca) não estão sendo atacadas", bloqueante: true }
    - { id: R08, item: "Acordo: recomendação FBS e aprovação do BASA registradas antes da petição de homologação; cláusula de retomada presente", bloqueante: true }
    - { id: R09, item: "Peça de impulso cabe em 1 página e tem pedido específico com prazo", bloqueante: false }
    - { id: R10, item: "Score de recuperabilidade e recomendação de triagem visíveis ao revisor e coerentes com a peça (não impulsionar carteira morta sem decisão do sócio)", bloqueante: false }
    - { id: R11, item: "Processo com prescrição intercorrente a menos de 12 meses (prescricao_intercorrente_meses_restantes < 12): a peça é diligência ÚTIL (com potencial de localizar/constringir bens, não pedido genérico) e será protocolada antes de prescricao_intercorrente_data_limite", bloqueante: true }
    - { id: R12, item: "Peça cumulada Sisbajud+Renajud+Infojud: o órgão julgador não tem preferencia_juizo_cumulado = sequencial; se tem, a peça é só a próxima diligência da sequência", bloqueante: true }
    - { id: R13, item: "Carteira morta: nenhuma manifestação de ciência de suspensão/arquivamento ou pedido de baixa sem socio_decisao_carteira_morta registrada por sócio para ESTE processo", bloqueante: true }
  motivos_recusa_padrao:
    - "Saldo/data-base divergentes da planilha do BASA"
    - "Diligência repetida sem fato novo"
    - "CPF/CNPJ ausente ou homônimo não afastado"
    - "Referência legal não conferida ou inexistente"
    - "Exceção aberta sem decisão humana (óbito, RJ, fraude, cliente suspendeu, carteira morta sem decisão do sócio)"
    - "Impugnação enfrenta matéria não alegada ou deixa matéria alegada sem resposta"
    - "Excesso de execução impugnado sem exigir planilha do embargante / sem pedido de rejeição liminar / sem recálculo pelo portal BASA"
    - "Ataque a verba/bem evidentemente impenhorável"
    - "Acordo sem aprovação do BASA registrada"
    - "Processo com intercorrente < 12 meses recebendo pedido genérico em vez de diligência útil"
    - "Pedido cumulado em juízo que já o indeferiu (preferência sequencial registrada)"
  observacoes: >-
    Decisão 5 (20/10/2026). Piso de 300 s para peças de impulso padrão (Sisbajud/Renajud/Infojud
    — cumulado ou sequencial —, citação por edital, manifestação sobre penhora negativa, art.
    921): são peças de 1 página cujo risco está nos dados (saldo, CPF, fase), conferíveis em
    minutos contra a planilha e o andamento; revisor = advogado da carteira; processamento em
    LOTE DIÁRIO (a esteira agrupa as minutas do dia por advogado/comarca). Um piso maior
    inviabiliza a carga (12 advogados × 1.500–1.950 processos). 600 s para peças intermediárias
    (cumprimento de sentença, habilitação de herdeiros, homologação de acordo). 1.200 s para
    impugnação a embargos, resposta a exceção e IDPJ: peça de mérito, com várias matérias,
    cálculo e risco de sucumbência — é a peça desta tipologia em que o erro custa dinheiro. Medir
    nas primeiras 100 peças de cada tipo; ajustar só para cima, com justificativa registrada.

# -----------------------------------------------------------------------------
# MÉTRICAS (M10/M11) — alinhadas aos KPIs do BASA (valor recuperado, prazo, SLA de impulso)
# -----------------------------------------------------------------------------
metricas:
  - { id: M01, nome: "Valor recuperado por mês", definicao: "soma de outcomes.recovered_value (bloqueios transferidos, pagamentos, acordos cumpridos, arrematações) por mês, por tribunal/comarca e por tese que gerou a diligência", meta: "baseline nos 3 primeiros meses; depois +15 % vs. baseline [A CONFERIR com o BASA]", fonte: outcomes }
  - { id: M02, nome: "Prazo médio até penhora efetiva", definicao: "dias entre citação válida e primeiro bloqueio/penhora com valor > 0", meta: "redução de 30 % vs. baseline da carteira [ILUSTRATIVO]", fonte: "outcomes + andamentos" }
  - { id: M03, nome: "Processos sem andamento útil > 90 dias", definicao: "% de processos viva/viva_prioritaria/observacao com dias_sem_andamento > 90 (gatilho de alerta + impulso automático — X12; provisório, alinhar ao SLA do contrato BASA) e % desses que receberam minuta de impulso no lote diário seguinte", meta: "< 5 % da carteira viva; 100 % com minuta gerada em até 1 dia útil após o gatilho [A CONFERIR SLA contratual]", fonte: "dossiers + drafts" }
  - { id: M04, nome: "SLA de impulso após despacho", definicao: "dias entre publicação de despacho que exige manifestação e protocolo da peça", meta: "mediana ≤ 5 dias úteis; 95 % dentro do prazo legal", fonte: "publicacoes + drafts" }
  - { id: M05, nome: "Custo por diligência e por R$ recuperado", definicao: "custas + correspondente + tokens (llm_calls.cost_usd) por diligência, dividido pelo valor recuperado atribuível", meta: "< 10 % do valor recuperado [ILUSTRATIVO]", fonte: "custas + llm_calls + outcomes" }
  - { id: M06, nome: "Taxa de êxito em embargos e exceções", definicao: "% de embargos/exceções julgados improcedentes ou não conhecidos por subtese T06.x/T07 e por comarca", meta: "≥ baseline FBS + 10 p.p. [A CONFERIR]", fonte: outcomes }
  - { id: M07, nome: "Carteira morta identificada", definicao: "nº de processos e R$ (valor atualizado) com recomendacao_triagem = morta, por critério (a/b/c), e decisão do sócio registrada por processo (manter / aceitar suspensão 921 / requerer baixa); nº efetivamente suspensos/baixados", meta: "100 % da carteira triada em 6 meses; relatório mensal ao BASA", fonte: "dossiers + reviews" }
  - { id: M08, nome: "Tempo médio de revisão por tipo de peça", definicao: "média de reviews.review_seconds por draft_type", meta: "impulso < 10 min; impugnação < 40 min [ILUSTRATIVO]", fonte: reviews }
  - { id: M09, nome: "Aprovação sem alteração substancial", definicao: "% de reviews com substantial_change = false, por draft_type", meta: "> 80 % em impulsos; > 50 % em impugnações após 100 peças [ILUSTRATIVO]", fonte: reviews }
