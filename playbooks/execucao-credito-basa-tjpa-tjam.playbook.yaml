  # ---------------------------------------------------------------- (2) INTERIOR / PRECATÓRIAS
  - id: T10
    nome: "Carta precatória, interior e correspondentes (TJPA interior + TJAM Itacoatiara/Manaus)"
    categoria: processual
    ordem: 22
    pai: null
    resumo: >-
      86 % do TJPA é interior e 31 % do TJAM é Itacoatiara: citação, penhora e avaliação dependem
      de precatórias (3,8 % das classes; 6,1 % no TJAM) e de correspondentes. O módulo escolhe
