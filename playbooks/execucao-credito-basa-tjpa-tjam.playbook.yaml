      evidencia_esperada: "nome no campo e marcação de artefato"
      implementada_em_m4: false
      calibrar: false
    - codigo: executado_homonimo
      descricao: "Executado sem CPF/CNPJ confirmado e nome frequente — risco de Sisbajud/Renajud contra homônimo"
      parametros: { exige_cpf_para_sisbajud: true, nota: "só 1.357 contatos têm CPF/CNPJ no Legal One" }
