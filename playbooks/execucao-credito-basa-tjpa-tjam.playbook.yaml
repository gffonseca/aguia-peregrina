# -----------------------------------------------------------------------------
# CAMPOS OBRIGATÓRIOS DO DOSSIÊ (M5)
# -----------------------------------------------------------------------------
# origem: extracao (autos) | subsidio (portal BASA / Legal One) | publicacao (DataJud/andamentos)
#         | antifraude (M4) | calculado (esteira)
campos_dossie_obrigatorios:
  # --- identificação e situação processual ---
  - { campo: numero_cnj, tipo: texto, origem: extracao, descricao: "Número CNJ válido (20 dígitos no padrão)", obrigatorio: true, bloqueia_minuta_se_ausente: true }
  - { campo: tribunal, tipo: texto, origem: calculado, descricao: "TJPA | TJAM | outro — derivado das posições J.TR do CNJ (mais confiável que courtId do Legal One)", obrigatorio: true }
  - { campo: comarca, tipo: texto, origem: calculado, descricao: "Comarca/foro derivado do CNJ (código do foro) e confirmado pelo DataJud", obrigatorio: true }
  - { campo: classe_cnj, tipo: texto, origem: publicacao, descricao: "Classe DataJud: execucao_titulo_extrajudicial | cumprimento_sentenca | embargos_execucao | monitoria | carta_precatoria | outra", obrigatorio: true, bloqueia_minuta_se_ausente: true }
  - { campo: fase_execucao, tipo: texto, origem: calculado, descricao: "distribuida | citacao_pendente | citado_sem_pagamento | penhora_frustrada | bens_penhorados | avaliacao_leilao | embargos_pendentes | suspensa_921 | arquivada_921 | cumprimento_sentenca | extinta — derivada dos andamentos (DataJud/Legal One)", obrigatorio: true, bloqueia_minuta_se_ausente: true }
  - { campo: data_ajuizamento, tipo: data, origem: calculado, descricao: "Ano/data de distribuição — usar o ano do CNJ; distributionDate do Legal One tem 966 placeholders 01/01/1900", obrigatorio: true }
  - { campo: data_ultima_movimentacao_util, tipo: data, origem: publicacao, descricao: "Última movimentação que impulsionou a execução (não conta juntada de procuração, vista, carga)", obrigatorio: true }
  - { campo: dias_sem_andamento, tipo: numero, origem: calculado, descricao: "Hoje − data_ultima_movimentacao_util", obrigatorio: true }
  - { campo: prazo_fatal, tipo: data, origem: publicacao, descricao: "Prazo em curso (intimação para manifestação, resposta a embargos, art. 921 §1º etc.)", obrigatorio: false }
  - { campo: tipo_peca_prevista, tipo: texto, origem: calculado, descricao: "Peça que a esteira pretende gerar: peticao_impulso | requerimento_cumulado_sisbajud_renajud_infojud | requerimento_sisbajud | requerimento_renajud_infojud | requerimento_cnib_srei | citacao_edital | manifestacao_penhora_negativa | impugnacao_embargos | resposta_excecao_pre_executividade | cumprimento_sentenca | pedido_suspensao_921 | habilitacao_herdeiros | idpj | acordo", obrigatorio: true }
  - { campo: impulso_automatico_90d_gerado, tipo: booleano, origem: calculado, descricao: "A esteira já gerou alerta + minuta de impulso para a fila de revisão por 90 dias sem movimentação útil (decisão 9 — provisório, alinhar ao SLA do contrato BASA)", obrigatorio: false }
  # --- título e valores (portal BASA) ---
  - { campo: titulo_tipo, tipo: texto, origem: subsidio, descricao: "ccb | cedula_rural_pignoraticia | cedula_rural_hipotecaria | nota_credito_rural | cpr | cedula_industrial | contrato_bancario | confissao_divida | cheque | sentenca | outro", obrigatorio: true, bloqueia_minuta_se_ausente: true, disponibilidade: "a confirmar — portal BASA (documentação solicitada)" }
  - { campo: titulo_localizado, tipo: booleano, origem: subsidio, descricao: "Via original/assinada do título está nos autos ou no portal do BASA", obrigatorio: true, bloqueia_minuta_se_ausente: true, disponibilidade: "a confirmar — portal BASA (documentação solicitada)" }
  - { campo: titulo_requisitos_ok, tipo: booleano, origem: calculado, descricao: "Liquidez, certeza e exigibilidade verificadas (valor determinável pela cédula + planilha; vencimento ocorrido; assinaturas do emitente/avalistas; testemunhas quando exigidas)", obrigatorio: true, bloqueia_minuta_se_ausente: true }
  - { campo: titulo_assinaturas_ok, tipo: booleano, origem: extracao, descricao: "Assinaturas do devedor e dos garantidores legíveis/compatíveis com os documentos de identificação", obrigatorio: true }
  - { campo: valor_causa, tipo: valor_monetario, origem: extracao, descricao: "Valor da causa na inicial (histórico)", obrigatorio: true }
  - { campo: valor_divida_atualizado, tipo: valor_monetario, origem: subsidio, descricao: "Saldo devedor atualizado pelo BASA (encargos contratuais até a data do cálculo)", obrigatorio: true, bloqueia_minuta_se_ausente: true, disponibilidade: "a confirmar — portal BASA (documentação solicitada)" }
  - { campo: data_calculo_saldo, tipo: data, origem: subsidio, descricao: "Data-base do saldo devedor", obrigatorio: true, disponibilidade: "a confirmar — portal BASA (documentação solicitada)" }
  - { campo: memoria_calculo_disponivel, tipo: booleano, origem: subsidio, descricao: "Planilha de evolução da dívida (CPC 798, I, b) [A CONFERIR] disponível e juntável", obrigatorio: true, bloqueia_minuta_se_ausente: true, disponibilidade: "a confirmar — portal BASA (documentação solicitada)" }
  - { campo: valor_moeda_antiga_suspeito, tipo: booleano, origem: antifraude, descricao: "Valor cadastrado incompatível (ex.: > R$ 5 mi em execução de 1992–94 — moeda antiga/centavos não convertidos)", obrigatorio: true }
  # --- encargos (para antecipar/impugnar embargos) ---
  - { campo: taxa_juros_remuneratorios, tipo: numero, origem: subsidio, descricao: "Taxa pactuada (% a.a.)", obrigatorio: false, disponibilidade: "a confirmar — portal BASA (documentação solicitada)" }
  - { campo: encargos_capitalizacao_pactuada, tipo: booleano, origem: subsidio, descricao: "Capitalização com periodicidade inferior à anual expressamente pactuada (cláusula localizável)", obrigatorio: false }
  - { campo: encargos_comissao_permanencia, tipo: booleano, origem: subsidio, descricao: "Cálculo cobra comissão de permanência (cumulada ou não com outros encargos)", obrigatorio: false }
  - { campo: encargos_fno_programa, tipo: texto, origem: subsidio, descricao: "Fonte do recurso: fno | pronaf | recursos_proprios | outro — define encargos e programas de renegociação aplicáveis", obrigatorio: false, disponibilidade: "a confirmar — portal BASA (documentação solicitada)" }
  # --- garantias ---
  - { campo: garantia_tipo, tipo: lista, origem: subsidio, descricao: "hipoteca | penhor_rural | penhor_mercantil | alienacao_fiduciaria_imovel | alienacao_fiduciaria_movel | aval | fianca | cessao_fiduciaria_recebiveis | nenhuma", obrigatorio: true, bloqueia_minuta_se_ausente: false, disponibilidade: "a confirmar — portal BASA (documentação solicitada)" }
  - { campo: garantia_valor_estimado, tipo: valor_monetario, origem: subsidio, descricao: "Valor de avaliação da garantia real (contratual ou laudo)", obrigatorio: false }
  - { campo: garantia_registrada, tipo: booleano, origem: subsidio, descricao: "Hipoteca/alienação registrada na matrícula; penhor rural registrado no RI/RTD", obrigatorio: false }
  - { campo: garantia_matricula, tipo: texto, origem: subsidio, descricao: "Matrícula(s) e cartório do imóvel dado em garantia", obrigatorio: false }
  - { campo: avalistas_n, tipo: numero, origem: subsidio, descricao: "Número de avalistas/fiadores no título", obrigatorio: true }
  - { campo: garantidor_terceiro_vulneravel, tipo: booleano, origem: calculado, descricao: "Garantidor é terceiro com indício de vulnerabilidade (idoso, analfabeto, cônjuge sem outorga, pequeno produtor) — sinal, não rótulo", obrigatorio: true }
  # --- datas do crédito ---
  - { campo: data_vencimento, tipo: data, origem: subsidio, descricao: "Vencimento (final ou antecipado) do título", obrigatorio: true }
  - { campo: data_inadimplemento, tipo: data, origem: subsidio, descricao: "Primeira parcela vencida e não paga", obrigatorio: true }
  - { campo: data_citacao, tipo: data, origem: publicacao, descricao: "Data da citação válida (ou null)", obrigatorio: false }
  - { campo: citacao_realizada, tipo: booleano, origem: publicacao, descricao: "Executado citado validamente (todos os executados)", obrigatorio: true, bloqueia_minuta_se_ausente: false }
  - { campo: citacao_tentativas_n, tipo: numero, origem: publicacao, descricao: "Tentativas de citação pessoal/postal/oficial frustradas", obrigatorio: false }
  # --- executado ---
  - { campo: executado_tipo, tipo: texto, origem: extracao, descricao: "pf | pj | pf_e_pj (80% da carteira é só PF)", obrigatorio: true }
  - { campo: executado_cpf_cnpj_valido, tipo: booleano, origem: antifraude, descricao: "CPF/CNPJ presente e com dígito verificador válido (só 1.357 contatos têm documento no Legal One)", obrigatorio: true }
  - { campo: executado_obito, tipo: booleano, origem: antifraude, descricao: "Indício de óbito do executado (certidão nos autos, base pública, informação do oficial)", obrigatorio: true }
  - { campo: executado_inventario_aberto, tipo: booleano, origem: antifraude, descricao: "Há inventário/arrolamento localizável (DataJud) do executado falecido", obrigatorio: false }
  - { campo: executado_recuperacao_judicial, tipo: booleano, origem: antifraude, descricao: "Executado (PJ ou produtor rural) em recuperação judicial", obrigatorio: true }
  - { campo: executado_falencia, tipo: booleano, origem: antifraude, descricao: "Executado com falência decretada", obrigatorio: true }
  - { campo: executado_homonimo_risco, tipo: booleano, origem: antifraude, descricao: "Nome comum sem CPF confirmado — risco de diligência contra homônimo", obrigatorio: true }
  # --- bens e diligências ---
  - { campo: bens_localizados, tipo: booleano, origem: calculado, descricao: "Há bem penhorável identificado (Sisbajud positivo, veículo, imóvel, safra, recebíveis)", obrigatorio: true }
  - { campo: bens_tipos, tipo: lista, origem: calculado, descricao: "dinheiro | veiculo | imovel_rural | imovel_urbano | safra | semoventes | recebiveis | quotas | nenhum", obrigatorio: false }
  - { campo: indicio_bens_fonte, tipo: lista, origem: publicacao, descricao: "De onde veio o indício de bens (andamentos legalone_andamentos/DataJud ou título): penhora | arresto | sisbajud_positivo | renajud_veiculo | garantia_real_registrada | nenhum — é o critério de 'bens localizados' da amostra do piloto", obrigatorio: true }
  - { campo: bens_cobertura_pct, tipo: numero, origem: calculado, descricao: "Valor estimado dos bens localizados / valor_divida_atualizado (%). 0 = nada; 1–99 = bens PARCIAIS (faixa em que a FBS propõe acordo ativamente — T09.1); ≥ 100 = cobertura integral", obrigatorio: true }
  - { campo: diligencias_cumuladas_negativas, tipo: booleano, origem: publicacao, descricao: "Sisbajud + Renajud + Infojud já cumpridos (em pedido cumulado ou sequencial) com resultado negativo/irrisório", obrigatorio: true }
  - { campo: preferencia_juizo_cumulado, tipo: texto, origem: calculado, descricao: "cumulado | sequencial | desconhecida — preferência do órgão julgador quanto ao pedido cumulado Sisbajud+Renajud+Infojud; a esteira aprende por vara/juízo a partir das decisões (indeferimento do cumulado → sequencial) e registra em M10", obrigatorio: true }
  - { campo: sisbajud_tentativas_n, tipo: numero, origem: publicacao, descricao: "Nº de ordens Sisbajud já cumpridas no processo", obrigatorio: true }
  - { campo: sisbajud_ultimo_resultado, tipo: valor_monetario, origem: publicacao, descricao: "Valor bloqueado na última ordem (0 se negativa)", obrigatorio: false }
  - { campo: sisbajud_ultima_data, tipo: data, origem: publicacao, descricao: "Data da última ordem Sisbajud", obrigatorio: false }
  - { campo: renajud_consultado, tipo: booleano, origem: publicacao, descricao: "Renajud já requerido/cumprido", obrigatorio: true }
  - { campo: infojud_consultado, tipo: booleano, origem: publicacao, descricao: "Infojud (DIRPF/DOI) já requerido/cumprido", obrigatorio: true }
  - { campo: cnib_consultado, tipo: booleano, origem: publicacao, descricao: "Indisponibilidade CNIB já requerida", obrigatorio: false }
  - { campo: matriculas_localizadas, tipo: lista, origem: subsidio, descricao: "Matrículas em nome do executado (SREI/ONR, DOI, garantia)", obrigatorio: false }
  - { campo: penhora_conta_titularidade, tipo: texto, origem: antifraude, descricao: "executado | conjunta | terceiro | desconhecida — titularidade da conta bloqueada", obrigatorio: false }
  - { campo: penhora_verba_impenhoravel_indicio, tipo: booleano, origem: antifraude, descricao: "Bloqueio recaiu sobre salário/aposentadoria/poupança ≤ 40 SM/benefício (CPC 833) [A CONFERIR]", obrigatorio: false }
  # --- prescrição e suspensões ---
  - { campo: prescricao_titulo_data_limite, tipo: data, origem: calculado, descricao: "Data-limite da prescrição da pretensão executiva (prazo do título a partir do vencimento) [A CONFERIR — 3 anos títulos de crédito × 5 anos dívida líquida]", obrigatorio: true }
  - { campo: prescricao_intercorrente_risco, tipo: booleano, origem: calculado, descricao: "Suspensão art. 921 III há ≥ 1 ano sem diligência útil e prazo prescricional do título em curso", obrigatorio: true }
  - { campo: prescricao_intercorrente_data_limite, tipo: data, origem: calculado, descricao: "Data estimada de consumação da prescrição intercorrente (CPC 921 §4º): termo inicial (fim do 1 ano de suspensão / ciência da 1ª diligência infrutífera — [A CONFERIR] regime e transição do art. 1.056) + prazo do título; calculada POR PROCESSO", obrigatorio: true }
  - { campo: prescricao_intercorrente_meses_restantes, tipo: numero, origem: calculado, descricao: "Meses até prescricao_intercorrente_data_limite; < 12 dispara prioridade (T08.1) e diligência útil obrigatória", obrigatorio: true }
  - { campo: diligencia_util_antes_intercorrente, tipo: booleano, origem: publicacao, descricao: "Há diligência útil (localização efetiva de bens/penhora — não pedido genérico) protocolada após o alerta de < 12 meses e antes do vencimento (M13)", obrigatorio: false }
  - { campo: suspensao_921_data, tipo: data, origem: publicacao, descricao: "Data da decisão de suspensão por ausência de bens (art. 921, III)", obrigatorio: false }
  - { campo: arquivamento_data, tipo: data, origem: publicacao, descricao: "Data do arquivamento provisório (art. 921 §2º)", obrigatorio: false }
  - { campo: suspensao_outra_causa, tipo: texto, origem: publicacao, descricao: "nenhuma | recuperacao_judicial | calamidade | covid | convencao_partes | decisao_judicial", obrigatorio: true }
  - { campo: programa_renegociacao_elegivel, tipo: texto, origem: subsidio, descricao: "nenhum | lei_13340_2016 | lei_14995_2024 | pronaf | securitizacao | desenrola | politica_interna_basa — [A CONFERIR quais programas estão vigentes]", obrigatorio: true, disponibilidade: "política do BASA — a mapear" }
  - { campo: renegociacao_em_curso, tipo: booleano, origem: subsidio, descricao: "Há proposta/renegociação administrativa em andamento no banco", obrigatorio: true }
  - { campo: cliente_orientou_suspender, tipo: booleano, origem: subsidio, descricao: "BASA orientou expressamente não impulsionar (negociação, política, auditoria)", obrigatorio: true, bloqueia_minuta_se_ausente: false }
  # --- custos ---
  - { campo: custas_pendentes_valor, tipo: valor_monetario, origem: publicacao, descricao: "Custas/diligências pendentes de recolhimento (oficial, edital, leiloeiro, precatória)", obrigatorio: true }
  - { campo: custo_diligencias_estimado, tipo: valor_monetario, origem: calculado, descricao: "Custo esperado das próximas diligências úteis (tabela por tribunal/comarca + correspondente) [ILUSTRATIVO — calibrar]", obrigatorio: true }
  - { campo: honorarios_sucumbencia_fixados, tipo: valor_monetario, origem: publicacao, descricao: "Honorários já fixados em favor do exequente (execução + embargos)", obrigatorio: false }
  # --- triagem (T01, calculado) ---
  - { campo: score_recuperabilidade, tipo: numero, origem: calculado, descricao: "0–1: probabilidade estimada de recuperar ≥ custo de diligências em 24 meses (T01)", obrigatorio: true }
  - { campo: recomendacao_triagem, tipo: texto, origem: calculado, descricao: "viva_prioritaria | viva | observacao | morta (T01). 'morta' = parar de diligenciar; baixa/suspensão art. 921 só por decisão de sócio caso a caso (T01.1/X03)", obrigatorio: true }
  - { campo: carteira_morta_criterios, tipo: lista, origem: calculado, descricao: "Critérios de carteira morta atendidos (decisão 1; qualquer um basta): sem_bens_e_3_anos_parado (Sisbajud + Renajud + Infojud negativos E > 3 anos sem movimentação útil) | falecido_sem_herdeiros (executado falecido sem herdeiros/inventário localizável) | valor_abaixo_custo (valor atualizado < custo esperado de diligências + custas) | nenhum. Prescrição intercorrente NÃO entra aqui (é gatilho de prioridade — T08.1)", obrigatorio: true }
  - { campo: valor_abaixo_piso_diligencia, tipo: booleano, origem: calculado, descricao: "valor_divida_atualizado < piso de valor para não diligenciar — R$ 10.000 (PROVISÓRIO; definir com o BASA — política do banco; parâmetro em antifraude.valor_abaixo_piso_diligencia)", obrigatorio: true }
  - { campo: socio_decisao_carteira_morta, tipo: texto, origem: calculado, descricao: "Decisão do SÓCIO registrada na plataforma (human_decide, OAB) para processo morta: pendente | manter_diligenciando | aceitar_suspensao_921 | requerer_baixa — caso a caso, nunca em lote; sem ela nenhuma peça de suspensão/baixa sai", obrigatorio: true }
  # --- incidentes defensivos ---
  - { campo: embargos_opostos, tipo: booleano, origem: publicacao, descricao: "Há embargos à execução pendentes de resposta", obrigatorio: true }
  - { campo: embargos_materia, tipo: lista, origem: extracao, descricao: "excesso_execucao | iliquidez | capitalizacao | comissao_permanencia | nulidade_citacao | prescricao | renegociacao_rural | ilegitimidade | pagamento | outra", obrigatorio: false }
  - { campo: embargos_planilha_apresentada, tipo: booleano, origem: extracao, descricao: "Embargante alegou excesso e juntou planilha com o valor que entende correto (CPC 917 §3º) [A CONFERIR]", obrigatorio: false }
  - { campo: embargos_efeito_suspensivo, tipo: booleano, origem: publicacao, descricao: "Juízo atribuiu efeito suspensivo aos embargos", obrigatorio: false }
  - { campo: embargos_julgados_resultado, tipo: texto, origem: publicacao, descricao: "pendente | improcedentes | parcialmente_procedentes | procedentes", obrigatorio: false }
  - { campo: sentenca_embargos_transitada, tipo: booleano, origem: publicacao, descricao: "Sentença dos embargos transitou em julgado", obrigatorio: false }
  - { campo: excecao_pre_executividade_oposta, tipo: booleano, origem: publicacao, descricao: "Há exceção de pré-executividade pendente", obrigatorio: true }
  - { campo: excecao_materia_cognoscivel_oficio, tipo: booleano, origem: extracao, descricao: "A matéria da exceção é cognoscível de ofício e não exige dilação probatória (Súmula 393 STJ por analogia) [A CONFERIR]", obrigatorio: false }
  - { campo: decisao_desfavoravel_transitada, tipo: booleano, origem: publicacao, descricao: "Há decisão desfavorável ao exequente transitada (extinção, nulidade do título, prescrição)", obrigatorio: true }
  - { campo: indicio_fraude_cedula, tipo: booleano, origem: antifraude, descricao: "Indício de fraude na cédula (assinatura divergente, emitente nega, laudo, inquérito) — sinal, não rótulo", obrigatorio: true }
  # --- monitória ---
  - { campo: monitoria_embargos_opostos, tipo: booleano, origem: publicacao, descricao: "Na monitória, houve embargos monitórios", obrigatorio: false }
  - { campo: monitoria_prazo_pagamento_decorrido, tipo: booleano, origem: publicacao, descricao: "Prazo de 15 dias do mandado monitório decorreu sem pagamento nem embargos (CPC 701 §2º) [A CONFERIR]", obrigatorio: false }
  # --- interior / precatórias ---
  - { campo: carta_precatoria_necessaria, tipo: booleano, origem: calculado, descricao: "Ato (citação, penhora, avaliação) depende de comarca diversa", obrigatorio: true }
  - { campo: comarca_deprecada, tipo: texto, origem: calculado, descricao: "Comarca onde o ato será cumprido", obrigatorio: false }
  - { campo: correspondente_disponivel, tipo: booleano, origem: subsidio, descricao: "FBS tem correspondente cadastrado na comarca deprecada/do interior", obrigatorio: false }
  # --- acordo ---
  - { campo: acordo_proposta_valor, tipo: valor_monetario, origem: subsidio, descricao: "Valor da proposta de acordo em análise (do executado ou recomendada pela FBS)", obrigatorio: false }
  - { campo: acordo_desconto_pct, tipo: numero, origem: calculado, descricao: "Desconto sobre valor_divida_atualizado implícito na proposta (%)", obrigatorio: false }
  - { campo: acordo_iniciativa, tipo: texto, origem: calculado, descricao: "nenhuma | executado | fbs_proativa | basa — quem originou a proposta; fbs_proativa = T09.1 (score médio, bens parciais)", obrigatorio: true }
  - { campo: acordo_aprovacao_basa_registrada, tipo: booleano, origem: subsidio, descricao: "Aprovação do BASA (alçada do banco) registrada na plataforma para a proposta recomendada pela FBS", obrigatorio: false }
  # --- qualidade de dados (M4) ---
  - { campo: cnj_duplicado, tipo: booleano, origem: antifraude, descricao: "Mesmo CNJ em mais de uma pasta do Legal One (771 CNJs em 1.638 pastas) — consolidar antes de impulsionar", obrigatorio: true }
  - { campo: cadastro_cliente_id, tipo: texto, origem: subsidio, descricao: "contato_id do BASA no Legal One (3863 | 14574 | 15082 | 36641) — unificar", obrigatorio: false }

# -----------------------------------------------------------------------------
# ÁRVORE DE "TESES" = MÓDULOS DE DECISÃO DO POLO ATIVO
# -----------------------------------------------------------------------------
# Em polo ativo a "tese" raramente é um argumento de mérito: é a decisão do que fazer
# com o processo nesta fase. categoria: sinal (triagem/acordo — não vira peça sozinha),
# processual (impulsos e incidentes), merito (resposta a embargos/exceção),
# subsidiaria (sucumbência/custas).
teses:
  # ---------------------------------------------------------------- (1) TRIAGEM
  - id: T01
    nome: "Triagem de recuperabilidade — score e separação de carteira viva × carteira morta"
    categoria: sinal
    ordem: 1
    pai: null
    resumo: >-
      Antes de qualquer peça, cada processo recebe um score 0–1 de recuperabilidade e uma
      recomendação (viva_prioritaria | viva | observacao | morta). O score pondera: existência e
      valor de garantia real; bens localizados; idade do processo; tempo desde a última
      diligência útil; óbito/insolvência do executado; valor líquido da dívida; custas e
      diligências futuras. A recomendação "morta" só sai se ao menos um dos três critérios
      objetivos de T01.1 estiver presente (decisão 1) — o score sozinho não mata processo.
      Pesos abaixo são ILUSTRATIVOS; calibrar por replay (M10).
    condicoes_aplicacao:
      - { campo: valor_divida_atualizado, operador: existe }
      - { campo: fase_execucao, operador: existe }
    provas_necessarias:
      - { tipo_documento: extrato_saldo_devedor, descricao: "Saldo devedor atualizado e memória de cálculo (portal BASA)", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: andamentos, descricao: "Linha do tempo dos andamentos (DataJud/Legal One) com a última diligência útil", origem: publicacao, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: relatorio_garantias, descricao: "Garantias do título (tipo, valor, registro, matrícula)", origem: subsidio, obrigatoria: false, peso: 0.9 }
      - { tipo_documento: relatorio_antifraude, descricao: "Óbito, RJ/falência, CPF válido, homônimo, CNJ duplicado", origem: antifraude, obrigatoria: true, peso: 0.8 }
    provas_que_afastam:
      - { tipo_documento: extrato_saldo_devedor, descricao: "Saldo em moeda antiga/centavos não convertidos (outlier) — recalcular antes de pontuar", origem: antifraude, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, art. 797 (execução no interesse do exequente) e art. 805 (menor onerosidade)", tipo: dispositivo, para_que_serve: "enquadrar a escolha de diligências úteis × custo", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CPC, art. 921, III, §§ 1º a 5º", tipo: dispositivo, para_que_serve: "efeito da carteira parada: suspensão → prescrição intercorrente", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "Res. CMN 2.682/1999 (classificação de risco/provisão) e normas de baixa para prejuízo do BASA", tipo: norma_regulatoria, para_que_serve: "alinhar a recomendação de baixa à régua contábil do banco", conferido: false, nota: "[A CONFERIR pelo advogado-dono — norma vigente e política interna do BASA]" }
      precedentes: []
      argumentos_chave:
        - "Fatores com peso ILUSTRATIVO (soma 1,0): garantia real registrada com valor ≥ 50 % da dívida 0,25; bens localizados (Sisbajud positivo, veículo, imóvel, safra) 0,20; última diligência útil há < 180 dias 0,10; idade do processo < 5 anos 0,10; executado vivo e sem RJ/falência 0,15; valor líquido (dívida − custas futuras) ≥ R$ 30 mil 0,10; CPF/CNPJ válido e sem homonímia 0,10. [A CONFERIR/CALIBRAR]"
        - "Faixas ILUSTRATIVAS: ≥ 0,70 viva_prioritaria; 0,45–0,69 viva; 0,25–0,44 observacao (só diligência barata periódica — T08); < 0,25 E ao menos um critério objetivo de T01.1 → morta (parar de diligenciar; decisão de baixa/suspensão é do sócio, caso a caso)."
        - "Score médio (viva/observacao) com bens PARCIAIS (bens_cobertura_pct entre 1 e 99 %) é a faixa em que a FBS propõe acordo ativamente (T09.1 — decisão 8)."
        - "Dados da carteira que balizam a régua: mediana R$ 57,5 mil, p90 R$ 276 mil; 85 % com movimento em 2026 (carteira viva, não acervo morto); três ondas de distribuição (2015–16, 2019–21, 2024–25) — a onda de 2015–16 é a primeira a passar pelo crivo de prescrição intercorrente (T08.1)."
        - "Prescrição intercorrente próxima NÃO rebaixa o processo a morta: é gatilho de PRIORIDADE (T08.1) — processo com intercorrente < 12 meses e qualquer indício de bens sobe na fila."
        - "O score nunca extingue nada sozinho: morta vai ao advogado da carteira e ao sócio (X03), que decide caso a caso."
    pedidos:
      - "Classificar o processo e registrar o score, a recomendação e os critérios de carteira morta atendidos no dossiê (sem peça)."
    pedidos_subsidiarios:
      - "Se recomendacao_triagem == morta: gerar relatório de carteira morta por processo para o advogado da carteira e o sócio (não é peça processual)."
    risco_se_mal_aplicada: "Score mal calibrado enterra crédito recuperável (falso 'morto') ou gasta diligência em crédito perdido; por isso o Brier (M10) é métrica de primeira linha."
    pendencia: "pesos e faixas do score aguardam replay sobre 200 processos encerrados; régua de baixa do BASA a obter"
    ativa: true

  - id: T01.1
    nome: "Carteira morta — três critérios objetivos; parar de diligenciar; baixa/suspensão só por decisão de sócio caso a caso"
    categoria: sinal
    ordem: 2
    pai: T01
    resumo: >-
      Um processo é carteira morta quando atende a QUALQUER UM de três critérios (decisão 1 da
      sessão de 20/10/2026): (a) sem bens localizados após Sisbajud + Renajud + Infojud negativos
      E mais de 3 anos sem movimentação útil; (b) executado falecido sem herdeiros/inventário
      localizável; (c) valor atualizado abaixo do custo esperado de diligências + custas (piso
      provisório de R$ 10.000 — decisão 2). Prescrição intercorrente próxima NÃO é critério (é
      gatilho de prioridade — T08.1). A recomendação é parar de gastar; a decisão de aceitar a
      suspensão/baixa do art. 921 é do SÓCIO, caso a caso — nunca em lote, nunca do advogado da
      carteira (decisão 3).
    condicoes_aplicacao:
      - { campo: recomendacao_triagem, operador: "==", valor: morta }
      - { campo: carteira_morta_criterios, operador: nao_contem, valor: nenhum, nota: "ao menos um de: sem_bens_e_3_anos_parado | falecido_sem_herdeiros | valor_abaixo_custo" }
    provas_necessarias:
      - { tipo_documento: relatorio_triagem, descricao: "Score, fatores, critério(s) de carteira morta atendido(s) e custo de diligências estimado", origem: calculado, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: andamentos, descricao: "Critério (a): resultados negativos de Sisbajud, Renajud e Infojud (com datas) e data da última movimentação útil (> 3 anos)", origem: publicacao, obrigatoria: false, peso: 1.0 }
      - { tipo_documento: relatorio_antifraude, descricao: "Critério (b): indício de óbito + busca negativa de inventário/herdeiros (DataJud, autos)", origem: antifraude, obrigatoria: false, peso: 1.0 }
      - { tipo_documento: extrato_saldo_devedor, descricao: "Critério (c): valor atualizado × custo de diligências + custas (piso R$ 10.000 provisório)", origem: subsidio, obrigatoria: false, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: relatorio_garantias, descricao: "Garantia real registrada ainda não excutida", origem: subsidio, obrigatoria: false, peso: 1.0 }
      - { tipo_documento: andamentos, descricao: "Qualquer indício de bens nos andamentos (penhora, arresto, Sisbajud positivo, Renajud com veículo) — processo volta à carteira viva", origem: publicacao, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, art. 921, III e §§ 1º a 5º (suspensão, arquivamento e prescrição intercorrente)", tipo: dispositivo, para_que_serve: "consequência jurídica de não impulsionar; o que o sócio aceita ou não ao decidir", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CPC, arts. 797 e 805 (interesse do exequente × menor onerosidade) e 775 (desistência da execução)", tipo: dispositivo, para_que_serve: "base para parar de diligenciar sem extinguir o crédito", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes: []
      argumentos_chave:
        - "Critério (a) — sem bens: Sisbajud + Renajud + Infojud negativos (cumulados ou sequenciais) E dias_sem_andamento > 1.095 (3 anos sem movimentação útil). Só um dos dois não basta."
        - "Critério (b) — falecido: óbito com busca negativa de inventário/arrolamento no DataJud e de herdeiros qualificáveis; se aparecer herdeiro/inventário, vai a T04.1."
        - "Critério (c) — valor: valor_divida_atualizado < custo_diligencias_estimado + custas_pendentes_valor; piso absoluto PROVISÓRIO de R$ 10.000 (abaixo dele não se diligencia) — definir com o BASA, política do banco."
        - "Saída possível do sócio, por processo: manter diligenciando (volta a T02/T08), aceitar a suspensão/arquivamento do art. 921 sem recurso, ou requerer baixa conforme a régua do BASA. Nenhuma dessas decisões é tomada em lote nem pelo advogado da carteira."
    pedidos:
      - "Relatório de carteira morta por processo (critério atendido, evidência, custo × valor) ao advogado da carteira e ao sócio; nenhuma peça automática."
    pedidos_subsidiarios:
      - "Só após socio_decisao_carteira_morta ∈ {aceitar_suspensao_921, requerer_baixa}: a esteira gera a manifestação correspondente (pedido_suspensao_921) para revisão."
    risco_se_mal_aplicada: "Parar de diligenciar crédito com garantia real não excutida ou com herdeiros solventes; ou, no sentido oposto, gastar diligência em processo que atende aos três critérios."
    pendencia: "piso de R$ 10.000 e régua de baixa a definir com o BASA (política do banco)"
    ativa: true

  # ---------------------------------------------------------------- (2) IMPULSO PADRÃO POR FASE
  - id: T02
    nome: "Impulso padrão por fase da execução"
    categoria: processual
    ordem: 3
    pai: null
    resumo: >-
      Para cada fase do processo há uma próxima diligência útil padrão. A tese-mãe define a regra:
      só impulsiona processo viva/viva_prioritaria/observacao, com saldo atualizado e memória de
      cálculo citáveis; as subteses escolhem a peça. Peças de impulso padrão são processadas em
      LOTE DIÁRIO, com piso de revisão de 300 s e revisor = advogado da carteira (decisão 5).
      Processo parado há 90 dias sem movimentação útil recebe alerta + minuta de impulso
      automática para a fila de revisão (decisão 9 — provisório; alinhar ao SLA do contrato
      BASA). Cumpre o KPI do BASA de SLA de impulso.
    condicoes_aplicacao:
      - { campo: recomendacao_triagem, operador: in, valor: [viva_prioritaria, viva, observacao] }
      - { campo: cliente_orientou_suspender, operador: "==", valor: false }
      - { campo: memoria_calculo_disponivel, operador: "==", valor: true }
    provas_necessarias:
      - { tipo_documento: extrato_saldo_devedor, descricao: "Saldo atualizado com data-base", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: andamentos, descricao: "Último andamento útil e despacho pendente", origem: publicacao, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: despacho, descricao: "Despacho recente já determinando a diligência pretendida (não repetir pedido)", origem: publicacao, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, arts. 797, 798, I, b (demonstrativo do débito) e 829", tipo: dispositivo, para_que_serve: "requisitos de qualquer petição de impulso com valor", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CPC, art. 835 (ordem de penhora) e art. 854 (penhora de dinheiro — Sisbajud)", tipo: dispositivo, para_que_serve: "preferência legal do dinheiro", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ — penhora on-line não exige esgotamento de outras diligências (jurisprudência consolidada) [A CONFERIR]", tipo: precedente, para_que_serve: "pedir Sisbajud já após a citação sem pagamento", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Toda petição de impulso traz: fase atual com citação de página, saldo atualizado com data-base e página da planilha, pedido específico e prazo."
        - "Nunca repetir diligência idêntica em menos de 180 dias sem fato novo [ILUSTRATIVO]."
        - "Ordem de diligências após citação sem pagamento (decisão 6): pedido CUMULADO Sisbajud + Renajud + Infojud em uma única peça (T02.2); se o juízo indeferir o cumulado, fallback sequencial (Sisbajud → Renajud → Infojud) e registro de preferencia_juizo_cumulado = sequencial para aquela vara; depois CNIB/SREI (T02.3) → avaliação/leilão (T02.4)."
        - "Gatilho de 90 dias (decisão 9): dias_sem_andamento > 90 em processo viva/observacao gera alerta e minuta de impulso da fase para a fila de revisão, sem esperar despacho (impulso_automatico_90d_gerado = true). Valor PROVISÓRIO — alinhar ao SLA do contrato BASA."
    pedidos:
      - "Prosseguimento da execução com a diligência da fase (ver subteses)."
    pedidos_subsidiarios: []
    risco_se_mal_aplicada: "Impulso genérico ('requer o prosseguimento') não conta como diligência útil para fins de prescrição intercorrente e não move o KPI."
    ativa: true

  - id: T02.1
    nome: "Citação pendente → novas diligências de endereço, citação por hora certa ou por edital"
    categoria: processual
    ordem: 4
    pai: T02
    resumo: >-
      Executado ainda não citado: pedir consulta de endereços (Sisbajud/Renajud/Infojud/SIEL),
      citação por hora certa se há ocultação, e, esgotadas as tentativas, citação por edital.
      Alternativa: arresto executivo (CPC 830) quando há bens e o executado não é encontrado.
    condicoes_aplicacao:
      - { campo: fase_execucao, operador: in, valor: [distribuida, citacao_pendente] }
      - { campo: citacao_realizada, operador: "==", valor: false }
    provas_necessarias:
      - { tipo_documento: certidao_oficial, descricao: "Certidões negativas do oficial/AR com os endereços diligenciados", origem: publicacao, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: certidao_oficial, descricao: "Menos de 2 tentativas em endereços distintos (edital prematuro é nulo)", origem: publicacao, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, arts. 252 a 254 (hora certa), 256 e 257 (edital), 830 (arresto executivo)", tipo: dispositivo, para_que_serve: "formas de citação e arresto", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CPC, art. 256, § 3º (esgotamento das tentativas; consulta a cadastros públicos)", tipo: dispositivo, para_que_serve: "requisito do edital", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ — nulidade de citação por edital sem esgotamento dos meios [A CONFERIR]", tipo: precedente, para_que_serve: "não pedir edital cedo demais (vira nulidade em embargos — T06.4)", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Sequência: endereço do título/portal → AR → oficial → consultas (Sisbajud endereços, Renajud, Infojud, SIEL) → hora certa (se ocultação certificada) → edital."
        - "Se há bens conhecidos e o executado não é encontrado: arresto executivo antes do edital."
    pedidos:
      - "Consulta de endereços nos sistemas conveniados; citação por hora certa ou edital conforme a certidão; arresto executivo se houver bens."
    pedidos_subsidiarios:
      - "Citação por meio eletrônico/aplicativo quando o tribunal admitir [A CONFERIR — TJPA/TJAM]."
    risco_se_mal_aplicada: "Edital prematuro → nulidade de todo o processado."
    ativa: true

  - id: T02.2
    nome: "Citado sem pagamento → pedido CUMULADO Sisbajud (com teimosinha) + Renajud + Infojud em uma peça; fallback sequencial por juízo"
    categoria: processual
    ordem: 5
    pai: T02
    resumo: >-
      Decorrido o prazo de 3 dias sem pagamento, requerer EM UMA ÚNICA PEÇA (decisão 6): bloqueio
      Sisbajud do saldo atualizado com reiteração automática (teimosinha), restrição/penhora de
      veículos via Renajud e quebra de sigilo fiscal via Infojud (DIRPF/DOI), contra todos os
      executados (emitente e avalistas). Se o juízo indeferir o cumulado (exigindo esgotamento
      prévio), a esteira registra preferencia_juizo_cumulado = sequencial para aquela vara/órgão
      julgador (M10 aprende por juízo) e passa a pedir em sequência: Sisbajud → Renajud → Infojud.
    condicoes_aplicacao:
      - { campo: fase_execucao, operador: "==", valor: citado_sem_pagamento }
      - { campo: citacao_realizada, operador: "==", valor: true }
      - { campo: preferencia_juizo_cumulado, operador: in, valor: [cumulado, desconhecida, sequencial], nota: "cumulado/desconhecida → peça cumulada; sequencial → só a próxima diligência da sequência" }
    provas_necessarias:
      - { tipo_documento: certidao_decurso_prazo, descricao: "Certidão de decurso do prazo de pagamento", origem: publicacao, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: extrato_saldo_devedor, descricao: "Saldo atualizado com data-base ≤ 30 dias", origem: subsidio, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: comprovante_pagamento, descricao: "Pagamento/depósito nos autos", origem: publicacao, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, arts. 829, 835, I, e 854", tipo: dispositivo, para_que_serve: "penhora de dinheiro como primeira opção", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CPC, art. 833, IV e X (impenhorabilidade de salário e poupança até 40 SM)", tipo: dispositivo, para_que_serve: "antecipar a manifestação sobre impenhorabilidade", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ — reiteração periódica do Sisbajud ('teimosinha') admitida [A CONFERIR]", tipo: precedente, para_que_serve: "pedir reiteração automática", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "STJ — relativização da impenhorabilidade de salário para dívida não alimentar em percentual razoável (EREsp 1.582.475) [A CONFERIR]", tipo: precedente, para_que_serve: "penhora de percentual de remuneração alta", conferido: false, nota: "[A CONFERIR pelo advogado-dono — número e alcance]" }
      argumentos_chave:
        - "Penhora on-line independe de esgotamento de outras diligências; valor = saldo atualizado da planilha anexa."
        - "Requer-se a ordem contra todos os executados (emitente e avalistas) e reiteração automática."
        - "Pedido cumulado (Sisbajud + Renajud + Infojud) economiza um ciclo de despacho por diligência (meses no interior); Renajud é gratuito e Infojud é requerido no mesmo ato com a justificativa de que a execução se faz no interesse do credor (CPC 797) [A CONFERIR — há juízos que exigem Sisbajud negativo antes do Infojud]."
        - "Fallback sequencial: ao primeiro indeferimento do cumulado pelo órgão julgador, registrar preferencia_juizo_cumulado = sequencial no dossiê e em M10 (por vara/juízo); nos próximos processos da mesma vara a esteira já gera a peça sequencial. Preferência volta a 'cumulado' se o mesmo juízo deferir um cumulado depois."
    pedidos:
      - "Peça cumulada: (i) bloqueio Sisbajud do valor atualizado contra todos os executados, com reiteração automática, transferência para conta judicial e intimação; (ii) Renajud — restrição de transferência e penhora de veículos; (iii) Infojud — 3 últimas DIRPF e DOI; tudo com CPF/CNPJ e valor da planilha."
    pedidos_subsidiarios:
      - "Se o juízo indeferir o cumulado: deferimento ao menos do Sisbajud, seguindo-se Renajud e Infojud em peças sequenciais (preferencia_juizo_cumulado = sequencial)."
      - "Se bloqueio parcial: manutenção e prosseguimento pelo saldo remanescente."
    risco_se_mal_aplicada: "Ordem contra homônimo ou com valor de moeda antiga (outlier) — ver antifraude; insistir no cumulado em juízo que já o indeferiu gera atraso e desgaste."
    ativa: true

  - id: T02.3
    nome: "Diligências cumuladas negativas → CNIB, SREI/matrículas e penhora de outros bens (imóvel, quotas, recebíveis, faturamento)"
    categoria: processual
    ordem: 6
    pai: T02
    resumo: >-
      Sisbajud + Renajud + Infojud negativos ou irrisórios (cumulados ou sequenciais — T02.2):
      requerer indisponibilidade de imóveis (CNIB), pesquisa de matrículas (SREI/ONR, cruzada
      com a DOI do Infojud) e, conforme o resultado, penhora de imóvel, quotas, recebíveis ou
      faturamento (PJ). É o terceiro passo da ordem da decisão 6 (cumulado → CNIB/SREI →
      avaliação/leilão). Se nenhuma diligência localizar bens e o processo passar 3 anos sem
      movimentação útil, entra o critério (a) de carteira morta (T01.1).
    condicoes_aplicacao:
      - { campo: fase_execucao, operador: "==", valor: penhora_frustrada }
      - { campo: diligencias_cumuladas_negativas, operador: "==", valor: true }
    provas_necessarias:
      - { tipo_documento: detalhamento_sisbajud, descricao: "Resultado negativo/irrisório do Sisbajud, do Renajud e do Infojud (com datas)", origem: publicacao, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: despacho, descricao: "CNIB/SREI já cumpridos sem fato novo", origem: publicacao, obrigatoria: false, peso: 0.9 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, art. 835, II a XIII, 866 (penhora de faturamento), 835, § 3º (bem fiduciário)", tipo: dispositivo, para_que_serve: "ordem e espécies de penhora", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CPC, art. 139, IV (medidas atípicas) e 772-773 (poderes do juiz na execução)", tipo: dispositivo, para_que_serve: "consultas e medidas indutivas", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "Lei 8.009/1990, art. 3º, V (bem de família: exceção da hipoteca) e CF, art. 5º, XXVI / CPC 833, VIII (pequena propriedade rural)", tipo: dispositivo, para_que_serve: "limites da penhora de imóvel rural", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ — Infojud/quebra de sigilo fiscal após diligências do credor frustradas [A CONFERIR]", tipo: precedente, para_que_serve: "requisito para o Infojud", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "STJ — medidas atípicas do art. 139, IV exigem indícios de patrimônio oculto (REsp 1.782.418 / 1.788.950) [A CONFERIR]", tipo: precedente, para_que_serve: "não pedir medida atípica sem indício", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Sequência de custo crescente depois do cumulado (T02.2): CNIB → SREI/matrículas (cruzar com DOI do Infojud) → penhora de imóvel/quotas/recebíveis → avaliação e leilão (T02.4)."
        - "Em PJ: penhora de faturamento em percentual compatível com a continuidade da atividade."
    pedidos:
      - "CNIB (indisponibilidade de imóveis) e pesquisa SREI/ONR de matrículas; penhora dos bens localizados (imóvel, quotas, recebíveis, faturamento)."
    pedidos_subsidiarios:
      - "Medidas atípicas do art. 139, IV só com indício concreto de patrimônio (exige sócio)."
    risco_se_mal_aplicada: "Pedir medida atípica sem indício gera indeferimento e desgaste; penhorar pequena propriedade rural trabalhada pela família é nulo."
    ativa: true

  - id: T02.4
    nome: "Bens penhorados → avaliação, intimação do cônjuge/credores, leilão eletrônico ou adjudicação"
    categoria: processual
    ordem: 7
    pai: T02
    resumo: >-
      Com penhora formalizada: requerer avaliação (oficial ou avaliador), registro da penhora
      (imóvel/veículo), intimação do cônjuge e de credores com garantia, e expropriação —
      adjudicação pelo BASA, alienação por iniciativa particular ou leilão eletrônico.
    condicoes_aplicacao:
      - { campo: fase_execucao, operador: in, valor: [bens_penhorados, avaliacao_leilao] }
      - { campo: bens_localizados, operador: "==", valor: true }
    provas_necessarias:
      - { tipo_documento: auto_penhora, descricao: "Auto/termo de penhora e, se imóvel, matrícula atualizada", origem: publicacao, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: embargos_terceiro, descricao: "Embargos de terceiro pendentes sobre o bem", origem: publicacao, obrigatoria: false, peso: 0.9 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, arts. 838-844 (formalização e registro), 870-875 (avaliação), 876 (adjudicação), 879-903 (alienação e leilão eletrônico), 842 (cônjuge), 889 (intimações)", tipo: dispositivo, para_que_serve: "rito expropriatório", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "Res. CNJ 236/2016 (leilão eletrônico) e provimentos TJPA/TJAM sobre leiloeiros [A CONFERIR]", tipo: norma_regulatoria, para_que_serve: "regras locais de leilão", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ — preço vil: inferior a 50 % da avaliação (CPC 891) [A CONFERIR]", tipo: precedente, para_que_serve: "fixar lance mínimo", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Adjudicação pelo BASA é a via mais rápida quando o bem interessa ao banco (política interna [A CONFERIR])."
        - "Intimações do art. 889 omitidas anulam o leilão: checklist obrigatório."
    pedidos:
      - "Avaliação, registro da penhora, intimações legais e designação de leilão eletrônico (ou adjudicação/alienação particular)."
    pedidos_subsidiarios:
      - "Lance mínimo não inferior a 50 % da avaliação [A CONFERIR]."
    risco_se_mal_aplicada: "Leilão anulado por falta de intimação do cônjuge/credor hipotecário/coproprietário."
    ativa: true

  # ---------------------------------------------------------------- (2) GARANTIA RURAL / FIDUCIÁRIA
  - id: T03
    nome: "Penhora de safra, penhor rural, cédula de produto rural e alienação fiduciária"
    categoria: processual
    ordem: 8
    pai: null
    resumo: >-
      Crédito rural (cédula rural pignoratícia/hipotecária, nota de crédito rural, CPR) tem
      garantia típica: penhor de safra/semoventes/máquinas e hipoteca rural. Requerer a penhora
      do bem empenhado/hipotecado com depositário, vistoria e, na safra, acompanhamento da
      colheita/venda. Alienação fiduciária (imóvel ou móvel) não é penhorável pelo próprio credor
      fiduciário — segue rito próprio (consolidação/busca e apreensão), fora desta execução.
    condicoes_aplicacao:
      - { campo: titulo_tipo, operador: in, valor: [cedula_rural_pignoraticia, cedula_rural_hipotecaria, nota_credito_rural, cpr] }
      - { campo: garantia_tipo, operador: contem, valor: penhor_rural }
    provas_necessarias:
      - { tipo_documento: cedula, descricao: "Cédula com a descrição do bem empenhado/hipotecado e registro", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: certidao_registro_garantia, descricao: "Registro do penhor/hipoteca (RI/RTD)", origem: subsidio, obrigatoria: false, peso: 0.8 }
    provas_que_afastam:
      - { tipo_documento: laudo_vistoria, descricao: "Bem empenhado inexistente/perecido (safra colhida e vendida; semoventes dispersos)", origem: publicacao, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "Decreto-Lei 167/1967 (cédulas de crédito rural — arts. 10, 41 e ss. penhor rural; 60 e ss. execução; 69 e 71 impenhorabilidade relativa)", tipo: dispositivo, para_que_serve: "regime da cédula rural e de sua garantia", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "Lei 8.929/1994 (CPR) e Lei 13.986/2020 (Agro: CPR, patrimônio rural em afetação)", tipo: dispositivo, para_que_serve: "execução da CPR e garantias", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CC, arts. 1.438 a 1.446 (penhor rural) e 1.473 e ss. (hipoteca)", tipo: dispositivo, para_que_serve: "direito material da garantia", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "Lei 9.514/1997 (alienação fiduciária de imóvel) e Decreto-Lei 911/1969 (móveis)", tipo: dispositivo, para_que_serve: "rito próprio fora da execução; credor fiduciário não penhora bem próprio", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CPC, art. 835, § 3º e art. 833, VIII; CF, art. 5º, XXVI", tipo: dispositivo, para_que_serve: "limites: pequena propriedade rural; bem fiduciário", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ — penhora de safra futura/percentual da produção admitida [A CONFERIR]", tipo: precedente, para_que_serve: "penhorar produção", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "STJ, Súmula 93 (capitalização em cédulas rurais) [A CONFERIR]", tipo: sumula, para_que_serve: "encargos próprios da cédula rural", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "O penhor rural recai sobre o bem descrito na cédula independentemente de nova penhora: pedir constatação e depósito."
        - "Safra: percentual da produção com depositário e comunicação a cooperativas/compradores habituais."
    pedidos:
      - "Penhora/constatação do bem empenhado ou hipotecado, nomeação de depositário, vistoria e avaliação; penhora de percentual da safra."
    pedidos_subsidiarios:
      - "Se o bem pereceu: reforço de penhora e Sisbajud (T02.2/T02.3)."
    risco_se_mal_aplicada: "Confundir alienação fiduciária com penhor; penhorar bem de pequena propriedade rural familiar."
    ativa: true

  # ---------------------------------------------------------------- (2) IDPJ E SUCESSÃO
  - id: T04
    nome: "Desconsideração da personalidade jurídica (IDPJ) e redirecionamento a sócios"
    categoria: processual
    ordem: 9
    pai: null
    resumo: >-
      Executado PJ sem bens, com indícios de confusão patrimonial, encerramento irregular ou
      desvio de finalidade: instaurar incidente de desconsideração para alcançar os sócios.
      Exige sócio FBS (custo, risco e padrão probatório altos); jamais em massa sem indício.
    condicoes_aplicacao:
      - { campo: executado_tipo, operador: in, valor: [pj, pf_e_pj] }
      - { campo: fase_execucao, operador: "==", valor: penhora_frustrada }
      - { campo: bens_localizados, operador: "==", valor: false }
    provas_necessarias:
      - { tipo_documento: ficha_cadastral_junta, descricao: "Ficha da Junta Comercial / QSA com sócios e situação (baixa, inapta)", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: detalhamento_sisbajud, descricao: "Diligências negativas contra a PJ", origem: publicacao, obrigatoria: true, peso: 0.9 }
      - { tipo_documento: certidao_oficial, descricao: "Certidão de encerramento irregular (empresa não localizada no endereço fiscal)", origem: publicacao, obrigatoria: false, peso: 0.8 }
    provas_que_afastam:
      - { tipo_documento: cedula, descricao: "Sócios já são avalistas no título (redirecionamento desnecessário — executar o aval)", origem: subsidio, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, arts. 133 a 137 (IDPJ) e 790, VII", tipo: dispositivo, para_que_serve: "rito do incidente", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CC, art. 50 (teoria maior; redação da Lei 13.874/2019)", tipo: dispositivo, para_que_serve: "requisitos materiais", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ, Súmula 435 (dissolução irregular — execução fiscal; aplicação à civil é controvertida) [A CONFERIR]", tipo: sumula, para_que_serve: "encerramento irregular como indício, não presunção", conferido: false, nota: "[A CONFERIR pelo advogado-dono — STJ exige teoria maior na execução civil]" }
        - { ref: "STJ — encerramento irregular, por si só, não autoriza desconsideração na execução civil (REsp 1.526.287 e outros) [A CONFERIR]", tipo: precedente, para_que_serve: "padrão probatório", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Antes do IDPJ: executar avalistas (80 % dos títulos têm aval) — mais barato e certo."
        - "IDPJ só com indício documentado de abuso (confusão patrimonial, desvio); custo processual e risco de sucumbência."
    pedidos:
      - "Instauração do IDPJ com citação dos sócios; suspensão do processo principal (CPC 134 §3º)."
    pedidos_subsidiarios: []
    risco_se_mal_aplicada: "IDPJ em massa sem indício: indeferimento, honorários contra o banco e precedente ruim na comarca."
    ativa: true

  - id: T04.1
    nome: "Óbito do executado — habilitação do espólio/herdeiros e sucessão processual"
    categoria: processual
    ordem: 10
    pai: T04
    resumo: >-
      Executado falecido: suspender (CPC 313, I), habilitar espólio (se há inventário) ou herdeiros
      (CPC 687-692 / 110), limitando a responsabilidade às forças da herança. Sem herdeiros nem
      inventário localizável, o caso atende ao critério (b) de carteira morta (T01.1/X01) — a
      decisão de parar é do sócio, caso a caso.
    condicoes_aplicacao:
      - { campo: executado_obito, operador: "==", valor: true }
      - { campo: executado_inventario_aberto, operador: "==", valor: true }
    provas_necessarias:
      - { tipo_documento: certidao_obito, descricao: "Certidão de óbito", origem: extracao, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: certidao_inventario, descricao: "Dados do inventário/arrolamento e do inventariante (DataJud)", origem: antifraude, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: certidao_inventario, descricao: "Inventário negativo (sem bens)", origem: antifraude, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, arts. 110, 313, I e § 1º, 687 a 692 (habilitação), 779, II (espólio/herdeiros)", tipo: dispositivo, para_que_serve: "sucessão processual na execução", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CC, arts. 1.792 e 1.997 (herdeiro responde nas forças da herança)", tipo: dispositivo, para_que_serve: "limite da responsabilidade", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CPC, art. 642 e ss. (habilitação de crédito no inventário)", tipo: dispositivo, para_que_serve: "via alternativa: habilitar o crédito no inventário", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ — atos praticados após o óbito sem suspensão são nulos (CPC 313 §1º) [A CONFERIR]", tipo: precedente, para_que_serve: "pedir suspensão imediata ao constatar óbito", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Havendo inventário: habilitar o crédito nos autos do inventário e/ou citar o espólio na execução."
        - "Sem inventário: habilitação dos herdeiros conhecidos (certidão de óbito + qualificação)."
    pedidos:
      - "Suspensão (CPC 313, I) e habilitação do espólio/herdeiros; prosseguimento contra eles nos limites da herança."
    pedidos_subsidiarios:
      - "Habilitação do crédito no inventário (CPC 642)."
    risco_se_mal_aplicada: "Prosseguir contra morto anula os atos; habilitar herdeiro errado (homônimo) gera dano."
    ativa: true

  # ---------------------------------------------------------------- (2) CUMPRIMENTO DE SENTENÇA
  - id: T05
    nome: "Cumprimento de sentença — embargos julgados improcedentes, honorários e sentença condenatória"
    categoria: processual
    ordem: 11
    pai: null
    resumo: >-
      Após trânsito em julgado de embargos improcedentes (ou de sentença em monitória/ação de
      cobrança), requerer o cumprimento: intimação para pagar em 15 dias sob pena de multa de
      10 % e honorários de 10 % (CPC 523), incluindo a sucumbência dos embargos.
    condicoes_aplicacao:
      - { campo: sentenca_embargos_transitada, operador: "==", valor: true }
      - { campo: embargos_julgados_resultado, operador: in, valor: [improcedentes, parcialmente_procedentes] }
    provas_necessarias:
      - { tipo_documento: sentenca, descricao: "Sentença/acórdão dos embargos e certidão de trânsito", origem: publicacao, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: extrato_saldo_devedor, descricao: "Planilha atualizada incluindo honorários fixados", origem: subsidio, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: despacho, descricao: "Recurso pendente com efeito suspensivo", origem: publicacao, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, arts. 523, 524 (demonstrativo), 525 (impugnação), 513 § 2º (intimação)", tipo: dispositivo, para_que_serve: "rito do cumprimento", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CPC, art. 85, §§ 1º e 13 (honorários nos embargos e no cumprimento)", tipo: dispositivo, para_que_serve: "cumular honorários", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ, Tema 410 / Súmula 517 (honorários no cumprimento após o prazo de pagamento) [A CONFERIR]", tipo: tema, para_que_serve: "honorários do cumprimento", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Em embargos parcialmente procedentes, prosseguir pelo valor remanescente apurado na própria sentença (não refazer o cálculo fora dela)."
    pedidos:
      - "Intimação do executado para pagar em 15 dias (CPC 523); multa e honorários de 10 %; Sisbajud na sequência."
    pedidos_subsidiarios: []
    risco_se_mal_aplicada: "Cumprimento com valor que ignora a parcial procedência dos embargos → excesso de execução."
    ativa: true

  # ---------------------------------------------------------------- (3) RESPOSTA A EMBARGOS
  - id: T06
    nome: "Impugnação aos embargos à execução — tese-mãe"
    categoria: merito
    ordem: 12
    pai: null
    resumo: >-
      Resposta padrão do exequente aos embargos: tempestividade/efeito suspensivo, higidez do
      título e do cálculo, e enfrentamento das matérias típicas do executado (subteses). Peça
      de maior risco da tipologia: revisão de 20 min e advogado da carteira.
    condicoes_aplicacao:
      - { campo: embargos_opostos, operador: "==", valor: true }
      - { campo: titulo_localizado, operador: "==", valor: true }
      - { campo: memoria_calculo_disponivel, operador: "==", valor: true }
    provas_necessarias:
      - { tipo_documento: peticao_embargos, descricao: "Petição de embargos e anexos (para enfrentar cada matéria)", origem: extracao, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: cedula, descricao: "Título com cláusulas de encargos destacadas", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: extrato_saldo_devedor, descricao: "Memória de cálculo com critérios (índices, taxas, datas)", origem: subsidio, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: laudo_pericial, descricao: "Perícia contábil já apontou excesso relevante", origem: publicacao, obrigatoria: false, peso: 0.9 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, arts. 914 a 920 (embargos; 915 prazo; 917 matérias; 918 rejeição liminar; 919 sem efeito suspensivo; 920 impugnação em 15 dias)", tipo: dispositivo, para_que_serve: "rito e prazo da impugnação", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CPC, arts. 783 e 784, III e XII; Lei 10.931/2004, art. 28 (CCB é título executivo); DL 167/67, art. 41 (cédula rural)", tipo: dispositivo, para_que_serve: "executividade do título", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ, Súmula 300 (confissão de dívida é título executivo) e Súmula 233/247 (abertura de crédito em conta corrente não é — risco) [A CONFERIR]", tipo: sumula, para_que_serve: "delimitar o que é título e o que exige monitória (T12)", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "STJ, Súmula 381 (vedado conhecer de ofício abusividade em contrato bancário)", tipo: sumula, para_que_serve: "limitar a cognição às matérias alegadas", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Embargos não suspendem a execução sem garantia + risco (CPC 919 §1º): pedir prosseguimento."
        - "Enfrentar cada matéria alegada com a cláusula e a página do cálculo; não responder matéria não alegada (Súmula 381)."
    pedidos:
      - "Rejeição liminar ou improcedência dos embargos; prosseguimento da execução; honorários."
    pedidos_subsidiarios:
      - "Se acolhido algum item, prosseguimento pelo valor remanescente com honorários recíprocos."
    risco_se_mal_aplicada: "Impugnação genérica perde embargos vencíveis; responder matéria não alegada abre porta a revisão de ofício."
    ativa: true

  - id: T06.1
    nome: "Excesso de execução — SEMPRE exigir a planilha do embargante (art. 917 §§ 3º e 4º), pedir rejeição liminar sem ela e recalcular pelo portal BASA"
    categoria: merito
    ordem: 13
    pai: T06
    resumo: >-
      Regra fixa (decisão 7): toda impugnação que enfrente alegação de excesso de execução
      EXIGE a planilha do embargante com o valor que ele entende correto (CPC 917 §3º) e pede a
      rejeição liminar da alegação quando a planilha falta (917 §4º, I) — sem exceção e sem
      entrar no mérito do cálculo nessa parte. Com planilha: antes de impugnar, a esteira
      RECALCULA o débito com o saldo e a memória de cálculo do portal BASA (data-base atual) e
      confronta critério a critério (índice, taxa, termo inicial, encargos), citando página.
    condicoes_aplicacao:
      - { campo: embargos_materia, operador: contem, valor: excesso_execucao }
    provas_necessarias:
      - { tipo_documento: extrato_saldo_devedor, descricao: "Memória de cálculo do portal BASA com critérios, recalculada na data-base da impugnação", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: peticao_embargos, descricao: "Petição de embargos: verificar se há valor declarado e planilha (embargos_planilha_apresentada)", origem: extracao, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: laudo_pericial, descricao: "Cálculo do BASA com erro aritmético evidente (então recalcular e reconhecer a parte incontroversa, não defender)", origem: publicacao, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, art. 917, III, §§ 2º, 3º e 4º", tipo: dispositivo, para_que_serve: "ônus do embargante de declarar o valor e juntar planilha; rejeição liminar / não conhecimento sem ela", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ — excesso sem planilha: não conhecimento / rejeição liminar [A CONFERIR]", tipo: precedente, para_que_serve: "rejeição sem perícia", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "SEMPRE: se embargos_planilha_apresentada == false → pedido principal de rejeição liminar da alegação de excesso (917 §4º, I), sem debater o cálculo; a esteira não gera impugnação de excesso sem esse pedido."
        - "Com planilha: recalcular com saldo/memória do portal BASA (data-base ≤ 30 dias) e enfrentar a divergência critério a critério; perícia só se a divergência não for resolvível por documentos."
        - "Se o recálculo do BASA mostrar que o embargante tem razão em parte (ex.: comissão de permanência cumulada — T06.3): reconhecer a parte e prosseguir pela incontroversa (917 §4º, II)."
    pedidos:
      - "Rejeição liminar da alegação de excesso de execução por ausência de planilha/valor declarado (CPC 917 §§ 3º e 4º, I); subsidiariamente, improcedência com base na memória de cálculo recalculada do BASA."
    pedidos_subsidiarios:
      - "Se perícia: honorários periciais pelo embargante; prosseguimento pela parte incontroversa (917 §4º, II)."
    risco_se_mal_aplicada: "Defender cálculo com comissão de permanência cumulada (Súmula 472) perde."
    ativa: true

  - id: T06.2
    nome: "Iliquidez / incerteza do título — CCB e cédula rural são líquidas com a planilha"
    categoria: merito
    ordem: 14
    pai: T06
    resumo: >-
      A CCB é título executivo líquido quando acompanhada da planilha de evolução da dívida
      (Lei 10.931, art. 28 §2º); a cédula rural, pelo DL 167/67. Iliquidez só se o valor não for
      apurável pelos critérios do próprio título.
    condicoes_aplicacao:
      - { campo: embargos_materia, operador: contem, valor: iliquidez }
    provas_necessarias:
      - { tipo_documento: cedula, descricao: "Título com cláusulas de valor, encargos e vencimento", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: extrato_saldo_devedor, descricao: "Planilha de evolução", origem: subsidio, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: cedula, descricao: "Contrato de abertura de crédito em conta corrente (Súmula 233) sem CCB", origem: subsidio, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "Lei 10.931/2004, art. 28, caput e § 2º", tipo: dispositivo, para_que_serve: "CCB + planilha = título líquido", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "DL 167/1967, arts. 10 e 41; CPC, art. 783", tipo: dispositivo, para_que_serve: "liquidez da cédula rural", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ, Tema repetitivo sobre executividade da CCB (REsp 1.291.575 — Tema 576) [A CONFERIR]", tipo: tema, para_que_serve: "CCB é título executivo mesmo em abertura de crédito", conferido: false, nota: "[A CONFERIR pelo advogado-dono — número do tema]" }
        - { ref: "STJ, Súmulas 233 e 247 [A CONFERIR]", tipo: sumula, para_que_serve: "distinguir abertura de crédito (não título) — se for o caso, converter em monitória (T12)", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Liquidez = determinabilidade por cálculo aritmético a partir do título; a planilha anexa satisfaz."
    pedidos:
      - "Improcedência da alegação de iliquidez."
    pedidos_subsidiarios:
      - "Se reconhecida a inexecutividade, aproveitamento dos autos como monitória/cobrança (fungibilidade) [A CONFERIR]."
    risco_se_mal_aplicada: "Insistir em executividade de contrato de abertura de crédito puro."
    ativa: true

  - id: T06.3
    nome: "Encargos — capitalização pactuada e comissão de permanência (Súmulas 539, 541, 472, 93, 596 STF)"
    categoria: merito
    ordem: 15
    pai: T06
    resumo: >-
      Capitalização inferior à anual é válida se pactuada após 31/03/2000 (Súmula 539), bastando
      taxa anual > 12× a mensal (Súmula 541); em cédulas rurais, Súmula 93. Comissão de
      permanência só é defensável se não cumulada (Súmula 472) — se o cálculo do BASA cumula,
      recalcular antes de impugnar (sinal de acordo parcial).
    condicoes_aplicacao:
      - { campo: embargos_materia, operador: contem, valor: capitalizacao }
    provas_necessarias:
      - { tipo_documento: cedula, descricao: "Cláusula de capitalização e taxas (mensal/anual) destacadas", origem: subsidio, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: extrato_saldo_devedor, descricao: "Cálculo com comissão de permanência cumulada com juros/multa/correção", origem: subsidio, obrigatoria: false, peso: 1.0 }
      - { tipo_documento: cedula, descricao: "Título sem cláusula expressa de capitalização", origem: subsidio, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "MP 2.170-36/2001, art. 5º; DL 167/67, art. 5º (cédula rural); Lei 10.931/2004, art. 28 § 1º, I", tipo: dispositivo, para_que_serve: "base legal da capitalização", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "Res. CMN sobre encargos de inadimplemento (comissão de permanência — Res. 1.129/1986 e sucessoras) [A CONFERIR]", tipo: norma_regulatoria, para_que_serve: "regime da comissão de permanência", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ, Súmula 539", tipo: sumula, para_que_serve: "capitalização pactuada após 31/03/2000", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "STJ, Súmula 541", tipo: sumula, para_que_serve: "pactuação pela taxa anual > duodécuplo da mensal", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "STJ, Súmula 472", tipo: sumula, para_que_serve: "comissão de permanência não cumulável", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "STJ, Súmula 93", tipo: sumula, para_que_serve: "capitalização em cédula rural/comercial/industrial", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "STF, Súmula 596; STJ, Súmula 382 (juros > 12 % não é abusivo por si)", tipo: sumula, para_que_serve: "juros remuneratórios", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "STJ, Temas 246/247 (REsp 1.061.530 — contratos bancários; juros, capitalização, comissão de permanência) [A CONFERIR]", tipo: tema, para_que_serve: "repetitivo-base de encargos bancários", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Cláusula expressa + taxa anual > 12× mensal = capitalização válida."
        - "Se o cálculo cumula comissão de permanência: substituir por juros + correção + multa antes de impugnar (não defender o indefensável)."
    pedidos:
      - "Improcedência quanto aos encargos; manutenção do cálculo."
    pedidos_subsidiarios:
      - "Se afastada a comissão de permanência: recálculo com juros remuneratórios pactuados + correção + multa de 2 %, prosseguindo pelo saldo."
    risco_se_mal_aplicada: "Defender cumulação da comissão de permanência: derrota certa e sucumbência."
    ativa: true

  - id: T06.4
    nome: "Nulidade de citação (edital/hora certa) — regularidade e comparecimento espontâneo"
    categoria: merito
    ordem: 16
    pai: T06
    resumo: >-
      Edital precedido de esgotamento dos meios (certidões, consultas) é válido; o comparecimento
      do executado para embargar supre eventual vício (CPC 239 §1º) sem reabrir prazo de pagamento.
    condicoes_aplicacao:
      - { campo: embargos_materia, operador: contem, valor: nulidade_citacao }
    provas_necessarias:
      - { tipo_documento: certidao_oficial, descricao: "Certidões negativas e consultas prévias ao edital", origem: publicacao, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: certidao_oficial, descricao: "Edital sem tentativa em endereço conhecido do título", origem: publicacao, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, arts. 239, § 1º, 256, § 3º, 257 e 280", tipo: dispositivo, para_que_serve: "requisitos do edital e convalidação", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ — comparecimento espontâneo supre a citação; prazo de embargos corre da ciência [A CONFERIR]", tipo: precedente, para_que_serve: "neutralizar a nulidade", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Demonstrar com páginas a sequência de tentativas; se o vício for real, aceitar renovação da citação (não insistir)."
    pedidos:
      - "Rejeição da nulidade; subsidiariamente, aproveitamento dos atos e prosseguimento."
    pedidos_subsidiarios: []
    risco_se_mal_aplicada: "Defender edital prematuro perde e anula a penhora."
    ativa: true

  - id: T06.5
    nome: "Prescrição da pretensão executiva — prazo do título, interrupção pelo despacho citatório e causas suspensivas"
    categoria: merito
    ordem: 17
    pai: T06
    resumo: >-
      Prazo: 3 anos para títulos de crédito (CC 206 §3º, VIII; Súmula 504 para cheque/nota
      promissória) × 5 anos para dívida líquida de instrumento particular (CC 206 §5º, I) — qual
      se aplica à CCB e à cédula rural o advogado-dono deve fixar. Interrupção retroage ao
      ajuizamento (CPC 240 §1º); suspensões por renegociação/moratória legal (Lei 13.340 etc.).
    condicoes_aplicacao:
      - { campo: embargos_materia, operador: contem, valor: prescricao }
    provas_necessarias:
      - { tipo_documento: cedula, descricao: "Vencimento (final/antecipado)", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: andamentos, descricao: "Data do ajuizamento e do despacho citatório", origem: publicacao, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: andamentos, descricao: "Ajuizamento após o prazo contado do vencimento, sem causa suspensiva", origem: publicacao, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CC, art. 206, § 3º, VIII e § 5º, I; art. 202, I e parágrafo único", tipo: dispositivo, para_que_serve: "prazo e interrupção", conferido: false, nota: "[A CONFERIR pelo advogado-dono — prazo aplicável à CCB e às cédulas rurais]" }
        - { ref: "CPC, art. 240, §§ 1º a 3º", tipo: dispositivo, para_que_serve: "interrupção retroativa ao ajuizamento", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "Lei 10.931/2004, art. 44 (prescrição da CCB — aplica regras dos títulos de crédito?) [A CONFERIR]", tipo: dispositivo, para_que_serve: "prazo da CCB", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "DL 167/1967, art. 60 (aplicação da legislação cambial às cédulas rurais) [A CONFERIR]", tipo: dispositivo, para_que_serve: "prazo da cédula rural", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ, Súmulas 503 e 504 (prazo para cheque/nota promissória prescritos); jurisprudência sobre prazo da CCB (3 × 5 anos) [A CONFERIR]", tipo: sumula, para_que_serve: "definir prazo", conferido: false, nota: "[A CONFERIR pelo advogado-dono — risco: há decisões de 3 anos para CCB]" }
      argumentos_chave:
        - "Termo inicial: vencimento (ou vencimento antecipado notificado); interrupção retroage à distribuição se a citação não demorou por culpa do exequente."
        - "Moratórias legais do crédito rural (Lei 13.340/2016 e sucessoras) suspendem/interrompem [A CONFERIR]."
    pedidos:
      - "Rejeição da prescrição."
    pedidos_subsidiarios: []
    risco_se_mal_aplicada: "Se o prazo de 3 anos for o aplicável e a onda 2015–16 não tiver interrupção válida, insistir gera sucumbência; ver T08."
