        - { ref: "Res. ANAC 400/2016, art. 26 (4h como marco da assistência de hospedagem/reacomodação) [A CONFERIR]", tipo: norma_regulatoria, para_que_serve: "parâmetro regulatório para 'atraso relevante'", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ, REsp 1.584.465 e precedentes da 3ª/4ª Turmas — dano moral por atraso de voo não é presumido; depende das circunstâncias (tempo, assistência, perda de compromisso) [A CONFERIR número e tese; verificar Tema afetado]", tipo: precedente, para_que_serve: "base principal da tese", conferido: false, nota: "[A CONFERIR pelo advogado-dono — conferir se há tema repetitivo em andamento/julgado sobre dano moral em atraso de voo e sua tese exata]" }
        - { ref: "TJPA / Turmas Recursais — orientação local sobre atraso < 4h e assistência prestada [A CONFERIR]", tipo: precedente, para_que_serve: "jurisprudência local", conferido: false, nota: "[A CONFERIR pelo advogado-dono — risco: Turmas Recursais do PA podem presumir dano em cancelamento]" }
        - { ref: "TJPA — faixa usual de dano moral por subtipo (atraso/cancelamento/overbooking/bagagem) [A CONFERIR]", tipo: precedente, para_que_serve: "quantum subsidiário", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
