excecoes:
  - id: X01
    descricao: "PNR não localizado ou status/motivo do voo não entregue pelo cliente"
    condicoes:
      - { campo: motivo_categoria, operador: "==", valor: desconhecido }
    acao: pedir_subsidio
    nota: "Volta ao M3 com prazo; sem motivo codificado não há T06/T07 e a defesa fica só em T08/T12."
  - id: X02
    descricao: "Indício de falha real imputável sem assistência (motivo comercial/malha, sem vouchers, atraso longo, bagagem não devolvida)"
    condicoes:
      - { campo: indicio_falha_real_cia, operador: "==", valor: true }
    acao: sinalizar_acordo
    nota: "Defender aqui é temerário; acordo cedo reduz dano moral e honorários."
  - id: X03
    descricao: "Autor não consta como passageiro no PNR"
    condicoes:
      - { campo: pnr_autor_e_passageiro, operador: "==", valor: false }
    acao: escalar_socio
    nota: "Pode ser ilegitimidade (peça específica) ou erro de subsídio; decisão humana antes de qualquer minuta."
  - id: X04
    descricao: "Passageiro vulnerável (criança, idoso, gestante, PcD/PNAE) com atraso ≥ 12h ou pernoite"
    condicoes:
      - { campo: autor_menor_idoso_pcd, operador: "==", valor: true }
      - { campo: atraso_total_horas, operador: ">=", valor: 12, nota: "[A CONFERIR pelo advogado-dono]" }
    acao: escalar_socio
    nota: "Exposição alta a dano moral majorado; defender × acordar é decisão do sócio."
  - id: X05
    descricao: "Motivo meteorológico alegado sem METAR/TAF disponível"
    condicoes:
      - { campo: motivo_categoria, operador: "==", valor: meteorologia }
      - { campo: metar_taf_disponivel, operador: "==", valor: false }
    acao: pedir_subsidio
    nota: "T06 bloqueada até o METAR/TAF ser anexado (REDEMET/ICEA); nunca alegar 'mau tempo' sem o dado."
  - id: X06
    descricao: "Autor possivelmente falecido antes da procuração/ajuizamento"
    condicoes:
      - { campo: autor_falecido, operador: "==", valor: true }
    acao: escalar_socio
    nota: "Não gerar minuta padrão; peça específica por advogado."
  - id: X07
    descricao: "Valor da causa acima da alçada de contestação padrão"
    condicoes:
      - { campo: valor_causa, operador: ">", valor: 50000.0, nota: "[A CONFERIR pelo advogado-dono] alçada do cliente" }
    acao: alertar_revisor
    nota: "Exige segunda revisão por sócio."
  - id: X08
    descricao: "Fora da tipologia: acidente aéreo, milhas/fidelidade, cobrança no cartão, pacote de agência"
    condicoes:
      - { campo: subtipo, operador: not_in, valor: [cancelamento, atraso, perda_conexao, overbooking, bagagem_extravio, bagagem_avaria, bagagem_violacao, assistencia, misto] }
    acao: nao_gerar_minuta
    nota: "Reclassificar."
  - id: X09
    descricao: "Voo internacional — regime da Convenção de Montreal"
    condicoes:
      - { campo: voo_internacional, operador: "==", valor: true }
    acao: alertar_revisor
    nota: "Revisor deve verificar aplicação do Tema 210 STF (prazo bienal, tetos de DES ao dano material) e não estender aos pedidos de dano moral."

# -----------------------------------------------------------------------------
# SINAIS DE ACORDO
# -----------------------------------------------------------------------------
sinais_acordo:
  politica: >-
    Defender quando há causa externa documentada (METAR/TAF/NOTAM) ou culpa do passageiro, e
    assistência comprovada com vouchers em nome do passageiro. Acordar cedo quando o motivo é
    comercial/malha, quando falta comprovante de assistência, quando o atraso é longo com
    passageiro vulnerável, ou quando a bagagem não foi devolvida. Valores e alçadas abaixo são
    ilustrativos e devem ser calibrados com a carteira do cliente por comarca e subtipo
    [A CONFERIR pelo advogado-dono]. Este playbook é só de defesa; o lado do autor é do spinoff.
  quando_acordar:
    - condicoes:
        - { campo: indicio_falha_real_cia, operador: "==", valor: true }
      racional: "Falha imputável e sem assistência; defender só aumenta sucumbência."
    - condicoes:
        - { campo: motivo_categoria, operador: in, valor: [malha_rotativa, tripulacao, comercial] }
        - { campo: atraso_total_horas, operador: ">=", valor: 4, nota: "[A CONFERIR pelo advogado-dono]" }
      racional: "Fortuito interno com atraso relevante: condenação por dano moral é a regra."
    - condicoes:
        - { campo: assistencia_comprovantes_disponiveis, operador: "==", valor: false }
        - { campo: atraso_total_horas, operador: ">=", valor: 4, nota: "[A CONFERIR pelo advogado-dono]" }
      racional: "Sem voucher não se prova a Res. 400; exposição alta."
    - condicoes:
        - { campo: subtipo, operador: in, valor: [bagagem_extravio] }
        - { campo: bagagem_entregue_dias, operador: ">", valor: 7, nota: "[A CONFERIR pelo advogado-dono] prazo doméstico" }
      racional: "Extravio além do prazo regulatório: dano moral presumido pelo STJ."
    - condicoes:
        - { campo: subtipo, operador: in, valor: [overbooking] }
        - { campo: overbooking_voluntarios_chamados, operador: "==", valor: false }
      racional: "Preterição sem procedimento: dano moral in re ipsa."
  quando_nao_acordar:
    - condicoes:
        - { campo: motivo_categoria, operador: in, valor: [meteorologia, atc_infraestrutura_aeroportuaria] }
        - { campo: metar_condicao_abaixo_minimos, operador: "==", valor: true }
        - { campo: assistencia_comprovantes_disponiveis, operador: "==", valor: true }
      racional: "Caso forte: causa externa documentada + assistência; acordo alimenta ações em série por voo."
    - condicoes:
        - { campo: passageiro_no_show, operador: "==", valor: true }
        - { campo: status_voo, operador: "==", valor: operado_no_horario }
      racional: "Culpa exclusiva do passageiro."
    - condicoes:
        - { campo: atraso_total_horas, operador: "<", valor: 4, nota: "[A CONFERIR pelo advogado-dono]" }
        - { campo: autor_alega_compromisso_perdido, operador: "==", valor: false }
      racional: "Atraso curto sem circunstância agravante: jurisprudência do STJ favorável."
    - condicoes:
        - { campo: acoes_mesmo_pnr_n, operador: ">=", valor: 3 }
      racional: "Fracionamento por PNR; não acordar antes de reunir os feitos."
    - condicoes:
        - { campo: autor_domicilio_outra_uf, operador: "==", valor: true }
      racional: "Foro artificial: arguir incompetência antes de qualquer negociação."
  faixas_valor:
    - grupo_comarcas: "Região Metropolitana de Belém"
      comarcas: ["Belém", "Ananindeua", "Marituba", "Benevides", "Santa Bárbara do Pará", "Santa Izabel do Pará"]
      valor_min: 1000.0
      valor_max: 4000.0
      moeda: BRL
      base: "ILUSTRATIVO [A CONFERIR pelo advogado-dono] — substituir pela média de condenação da carteira por subtipo (atraso < 4h, 4–12h, > 12h/pernoite, overbooking, bagagem), 12 meses"
      calibrar: true
    - grupo_comarcas: "Interior — polos com aeroporto (Santarém, Marabá, Altamira, Parauapebas/Carajás)"
      comarcas: ["Santarém", "Marabá", "Altamira", "Parauapebas"]
      valor_min: 1500.0
      valor_max: 5000.0
      moeda: BRL
      base: "ILUSTRATIVO [A CONFERIR pelo advogado-dono]"
      calibrar: true
    - grupo_comarcas: "Interior — demais comarcas"
      comarcas: ["*"]
      valor_min: 1500.0
      valor_max: 6000.0
      moeda: BRL
      base: "ILUSTRATIVO [A CONFERIR pelo advogado-dono] — verificar comarcas sem aeroporto usadas como foro de conveniência"
      calibrar: true
  alcadas:
    - { ate_valor: 3000.0, aprovador: "advogado responsável pela carteira [A CONFERIR]" }
    - { ate_valor: 10000.0, aprovador: "sócio FBS + jurídico do cliente [A CONFERIR]" }
    - { ate_valor: 999999.0, aprovador: "comitê do cliente [A CONFERIR]" }
  decisao_final: "A decisão de acordar é do advogado/cliente; a plataforma só sinaliza e registra."

# -----------------------------------------------------------------------------
# ANTIFRAUDE ESPECÍFICO (M4)
