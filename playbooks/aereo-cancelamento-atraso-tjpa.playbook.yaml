  - { campo: comarca, tipo: texto, origem: extracao, descricao: "Comarca do juízo", obrigatorio: true }
  - { campo: juizado_especial, tipo: booleano, origem: extracao, descricao: "Tramita em Juizado Especial (Lei 9.099)", obrigatorio: true }
  - { campo: subtipo, tipo: texto, origem: extracao, descricao: "cancelamento | atraso | perda_conexao | overbooking | bagagem_extravio | bagagem_avaria | bagagem_violacao | assistencia | misto", obrigatorio: true, bloqueia_minuta_se_ausente: true }
  - { campo: voo_internacional, tipo: booleano, origem: extracao, descricao: "Trecho internacional (ou conexão internacional no mesmo bilhete)", obrigatorio: true, bloqueia_minuta_se_ausente: true }
  - { campo: valor_causa, tipo: valor_monetario, origem: extracao, descricao: "Valor da causa", obrigatorio: true }
  - { campo: valor_dano_moral_pedido, tipo: valor_monetario, origem: extracao, descricao: "Valor pedido a título de dano moral", obrigatorio: false }
  - { campo: valor_dano_material_pedido, tipo: valor_monetario, origem: extracao, descricao: "Valor pedido a título de dano material", obrigatorio: false }
  - { campo: dano_material_comprovado, tipo: booleano, origem: extracao, descricao: "Há notas/recibos dos gastos alegados (hotel, alimentação, transporte, bens)", obrigatorio: false }
  - { campo: data_voo, tipo: data, origem: extracao, descricao: "Data do voo original", obrigatorio: true, bloqueia_minuta_se_ausente: true }
  - { campo: data_ajuizamento, tipo: data, origem: extracao, descricao: "Data de distribuição", obrigatorio: true }
  - { campo: autor_pede_gratuidade, tipo: booleano, origem: extracao, descricao: "Pedido de justiça gratuita", obrigatorio: true }
  - { campo: renda_declarada_autor, tipo: valor_monetario, origem: extracao, descricao: "Renda mensal que consta dos autos", obrigatorio: false }
  - { campo: autor_alega_compromisso_perdido, tipo: booleano, origem: extracao, descricao: "Inicial alega perda de compromisso específico (trabalho, evento, consulta, conexão com outra cia)", obrigatorio: true }
  - { campo: compromisso_comprovado, tipo: booleano, origem: extracao, descricao: "Há prova documental do compromisso perdido", obrigatorio: false }
  - { campo: autor_menor_idoso_pcd, tipo: booleano, origem: extracao, descricao: "Autor é criança, idoso, gestante, PcD ou PNAE (agrava o dano)", obrigatorio: true }
  - { campo: comprovante_endereco_titular, tipo: texto, origem: extracao, descricao: "autor | terceiro | ausente", obrigatorio: true }
  - { campo: comprovante_endereco_uf, tipo: texto, origem: extracao, descricao: "UF do comprovante de endereço juntado", obrigatorio: true }
  - { campo: data_procuracao, tipo: data, origem: extracao, descricao: "Data da procuração juntada", obrigatorio: true }
  # --- subsídios do cliente (M3) ---
  - { campo: pnr, tipo: texto, origem: subsidio, descricao: "Localizador da reserva (PNR)", obrigatorio: true, bloqueia_minuta_se_ausente: true }
  - { campo: pnr_autor_e_passageiro, tipo: booleano, origem: subsidio, descricao: "Autor consta como passageiro no PNR", obrigatorio: true }
  - { campo: passageiro_fez_checkin, tipo: booleano, origem: subsidio, descricao: "Registro de check-in do passageiro no voo original", obrigatorio: true }
  - { campo: passageiro_embarcou_reacomodacao, tipo: booleano, origem: subsidio, descricao: "Passageiro embarcou no voo reacomodado (bording registrado)", obrigatorio: false }
  - { campo: passageiro_no_show, tipo: booleano, origem: subsidio, descricao: "Passageiro não se apresentou (no-show) no voo original", obrigatorio: true }
  - { campo: status_voo, tipo: texto, origem: subsidio, descricao: "operado_no_horario | atrasado | cancelado | desviado", obrigatorio: true, bloqueia_minuta_se_ausente: true }
  - { campo: atraso_total_horas, tipo: numero, origem: subsidio, descricao: "Atraso total na chegada ao destino final (horas), considerando reacomodação", obrigatorio: true }
  - { campo: motivo_codigo, tipo: texto, origem: subsidio, descricao: "Código de motivo (IATA delay code / interno) do atraso/cancelamento", obrigatorio: true }
  - { campo: motivo_categoria, tipo: texto, origem: subsidio, descricao: "meteorologia | atc_infraestrutura_aeroportuaria | manutencao_nao_programada | seguranca_operacional | malha_rotativa | tripulacao | comercial | desconhecido", obrigatorio: true, bloqueia_minuta_se_ausente: true }
  - { campo: metar_taf_disponivel, tipo: booleano, origem: subsidio, descricao: "Há METAR/TAF do aeroporto (origem/destino/alternativa) na janela do voo", obrigatorio: false }
  - { campo: metar_condicao_abaixo_minimos, tipo: booleano, origem: subsidio, descricao: "METAR/TAF mostram teto/visibilidade/vento abaixo dos mínimos operacionais na janela", obrigatorio: false }
  - { campo: outras_cias_afetadas_mesmo_dia, tipo: booleano, origem: subsidio, descricao: "Outros voos (outras cias) no mesmo aeroporto/janela também atrasados/cancelados", obrigatorio: false }
  - { campo: manutencao_registro_disponivel, tipo: booleano, origem: subsidio, descricao: "Há registro técnico (log de manutenção, MEL, relatório) da falha não programada", obrigatorio: false }
  - { campo: comunicacao_previa_horas, tipo: numero, origem: subsidio, descricao: "Horas de antecedência com que o passageiro foi informado da alteração (null se não informado)", obrigatorio: false }
  - { campo: comunicacao_meio, tipo: texto, origem: subsidio, descricao: "email | sms | app | balcao | nenhum", obrigatorio: false }
  - { campo: assistencia_prestada, tipo: lista, origem: subsidio, descricao: "Itens de assistência material prestados: comunicacao | alimentacao | hospedagem | transporte (com comprovantes)", obrigatorio: true }
  - { campo: assistencia_comprovantes_disponiveis, tipo: booleano, origem: subsidio, descricao: "Há vouchers/notas/registro de hotel/transporte em nome do passageiro", obrigatorio: true }
  - { campo: opcao_oferecida, tipo: texto, origem: subsidio, descricao: "reacomodacao_propria | reacomodacao_outra_cia | reembolso | execucao_outro_meio | nenhuma", obrigatorio: true }
  - { campo: opcao_escolhida_passageiro, tipo: texto, origem: subsidio, descricao: "reacomodacao | reembolso | outro_meio | recusou | desconhecida", obrigatorio: false }
  - { campo: reembolso_realizado, tipo: booleano, origem: subsidio, descricao: "Reembolso integral já efetuado (data e valor)", obrigatorio: false }
  - { campo: overbooking_voluntarios_chamados, tipo: booleano, origem: subsidio, descricao: "Na preterição, houve chamada de voluntários e oferta de compensação", obrigatorio: false }
  - { campo: overbooking_compensacao_paga, tipo: valor_monetario, origem: subsidio, descricao: "Compensação financeira paga ao passageiro preterido", obrigatorio: false }
  - { campo: pir_registrado, tipo: booleano, origem: subsidio, descricao: "Property Irregularity Report (PIR) registrado para a bagagem", obrigatorio: false }
  - { campo: bagagem_entregue_dias, tipo: numero, origem: subsidio, descricao: "Dias entre o PIR e a entrega da bagagem (null se não localizada)", obrigatorio: false }
  - { campo: bagagem_conteudo_declarado, tipo: booleano, origem: subsidio, descricao: "Passageiro fez declaração especial de valor no despacho", obrigatorio: false }
  - { campo: bagagem_indenizacao_paga, tipo: valor_monetario, origem: subsidio, descricao: "Valor já pago administrativamente pela bagagem", obrigatorio: false }
  - { campo: reclamacao_administrativa_previa, tipo: booleano, origem: subsidio, descricao: "Houve SAC/consumidor.gov/ANAC antes da ação", obrigatorio: false }
  # --- cruzamentos (antifraude / publicações) ---
  - { campo: litispendencia_cnj, tipo: lista, origem: antifraude, descricao: "Processos em curso com mesmas partes/causa/pedido", obrigatorio: true }
  - { campo: coisa_julgada_cnj, tipo: lista, origem: antifraude, descricao: "Processos transitados com mesmas partes/causa/pedido", obrigatorio: true }
  - { campo: acoes_mesmo_pnr_n, tipo: numero, origem: antifraude, descricao: "Nº de ações com o mesmo PNR (outros passageiros da reserva ou mesmo autor)", obrigatorio: true }
  - { campo: acoes_mesmo_autor_mesmo_reu_n, tipo: numero, origem: antifraude, descricao: "Nº de ações do autor contra o cliente (carteira + publicações)", obrigatorio: true }
  - { campo: acoes_mesmo_advogado_mes_n, tipo: numero, origem: antifraude, descricao: "Nº de ações do mesmo advogado contra o cliente no mês", obrigatorio: true }
  - { campo: acoes_mesmo_voo_n, tipo: numero, origem: antifraude, descricao: "Nº de ações pelo mesmo voo/data (qualquer autor)", obrigatorio: false }
  - { campo: autor_domicilio_outra_uf, tipo: booleano, origem: antifraude, descricao: "Domicílio real do autor (PNR, cadastro, outras ações) em UF diversa da comarca", obrigatorio: true }
  - { campo: autor_falecido, tipo: booleano, origem: antifraude, descricao: "Indício de óbito do autor antes do ajuizamento/procuração", obrigatorio: true }
  - { campo: indicio_falha_real_cia, tipo: booleano, origem: calculado, descricao: "Sinais de que a falha foi imputável e sem assistência (motivo comercial/malha, sem comprovantes de assistência, atraso > 12h, bagagem não devolvida)", obrigatorio: true }

# -----------------------------------------------------------------------------
# ÁRVORE DE TESES
# -----------------------------------------------------------------------------
teses:
  # ---------------------------------------------------------------- PRELIMINARES
  - id: T01
    nome: "Impugnação à gratuidade de justiça"
    categoria: preliminar
    ordem: 1
    pai: null
    resumo: >-
      O autor pede gratuidade, mas renda, perfil de viagem (classe, destino, frequência) e
      despesas alegadas afastam a presunção de hipossuficiência.
    condicoes_aplicacao:
      - { campo: autor_pede_gratuidade, operador: "==", valor: true }
      - { campo: renda_declarada_autor, operador: ">", valor: 4554.0, nota: "~3 salários mínimos [A CONFERIR pelo advogado-dono — valor e critério local]" }
    provas_necessarias:
      - { tipo_documento: holerite, descricao: "Comprovante de renda nos autos", origem: extracao, obrigatoria: true, peso: 0.9 }
      - { tipo_documento: pnr, descricao: "Histórico de viagens/classe tarifária no cadastro do passageiro", origem: subsidio, obrigatoria: false, peso: 0.6 }
    provas_que_afastam:
      - { tipo_documento: declaracao_hipossuficiencia, descricao: "Renda ≤ limite do TJPA e ausência de outros sinais", origem: extracao, obrigatoria: false, peso: 0.8 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, arts. 98 a 100 e 99, § 2º", tipo: dispositivo, para_que_serve: "presunção relativa e impugnação", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "TJPA — critério das Câmaras Cíveis para impugnação à gratuidade [A CONFERIR]", tipo: precedente, para_que_serve: "parâmetro local", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "A presunção do art. 99, § 3º, é relativa; viagens frequentes/internacionais indicam capacidade."
    pedidos:
      - "Revogação/indeferimento da gratuidade ou intimação para comprová-la."
    pedidos_subsidiarios:
      - "Parcelamento das custas (CPC, art. 98, § 6º) [A CONFERIR pelo advogado-dono]."
    risco_se_mal_aplicada: "Impugnar gratuidade com base em uma única viagem promocional soa abusivo."
    ativa: true

  - id: T02
    nome: "Incompetência territorial — foro artificial (comprovante de endereço de conveniência)"
    categoria: preliminar
    ordem: 2
    pai: null
    resumo: >-
      O autor ajuizou em comarca paraense sem vínculo com seu domicílio real (PNR, cadastro,
      outras ações indicam outra UF/comarca), com comprovante de endereço de terceiro ou recente,
      para alcançar jurisprudência mais favorável. Pede-se declínio para o foro do domicílio do
      autor ou do local do fato/contratação.
    condicoes_aplicacao:
      - { campo: autor_domicilio_outra_uf, operador: "==", valor: true }
    provas_necessarias:
      - { tipo_documento: pnr, descricao: "Cadastro do passageiro com endereço/telefone/DDD e histórico de embarques", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: relatorio_antifraude, descricao: "Outras ações do autor em comarcas/UF diversas; comprovante de endereço em nome de terceiro", origem: antifraude, obrigatoria: true, peso: 0.9 }
    provas_que_afastam:
      - { tipo_documento: comprovante_residencia, descricao: "Comprovante idôneo e atual em nome do autor na comarca, ou voo com origem/destino na comarca", origem: extracao, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CDC, art. 101, I", tipo: dispositivo, para_que_serve: "foro do domicílio do autor — pressupõe domicílio real", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CPC, arts. 64, 65 e 337, II; CC, arts. 70 a 72", tipo: dispositivo, para_que_serve: "incompetência relativa (arguir em preliminar, sob pena de prorrogação); conceito de domicílio", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "Lei 9.099/1995, art. 4º", tipo: dispositivo, para_que_serve: "competência nos Juizados", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "TJPA / Turmas Recursais — declínio de competência por domicílio fictício em ações de consumo [A CONFERIR]", tipo: precedente, para_que_serve: "jurisprudência local sobre foro de conveniência", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "O foro do art. 101, I, do CDC protege o domicílio real do consumidor, não um endereço emprestado."
        - "Cadastro da reserva, DDD e outras ações do autor apontam domicílio em outra UF."
    pedidos:
      - "Acolhimento da incompetência relativa com remessa ao foro do domicílio real do autor."
    pedidos_subsidiarios:
      - "Intimação do autor para comprovar residência atual na comarca."
    risco_se_mal_aplicada: "Arguir incompetência contra morador real da comarca com base só no DDD do telefone."
    ativa: true

  - id: T03
    nome: "Litispendência ou coisa julgada"
    categoria: preliminar
    ordem: 3
    pai: null
    resumo: "Há outra ação em curso (ou já julgada) com as mesmas partes, causa de pedir e pedido sobre o mesmo voo/PNR."
    condicoes_aplicacao:
      - { campo: litispendencia_cnj, operador: existe }
    provas_necessarias:
      - { tipo_documento: certidao_processo, descricao: "Cópia da inicial e andamento do processo anterior", origem: antifraude, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: peticao_inicial, descricao: "Voos/eventos comprovadamente distintos", origem: extracao, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, art. 337, VI e VII, §§ 1º a 4º; art. 485, V", tipo: dispositivo, para_que_serve: "litispendência, coisa julgada e extinção", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes: []
      argumentos_chave:
        - "Tríplice identidade demonstrada documentalmente."
    pedidos:
      - "Extinção sem resolução do mérito (CPC, art. 485, V)."
    pedidos_subsidiarios:
      - "Reunião dos feitos por conexão (CPC, art. 55) se a identidade for parcial."
    risco_se_mal_aplicada: "Confundir ida e volta do mesmo PNR com eventos distintos ocorridos em ambos."
    ativa: true

  - id: T03.1
    nome: "Coisa julgada"
    categoria: preliminar
    ordem: 4
    pai: T03
    resumo: "Variante de T03 quando o processo anterior já transitou em julgado."
    condicoes_aplicacao:
      - { campo: coisa_julgada_cnj, operador: existe }
    provas_necessarias:
      - { tipo_documento: certidao_transito, descricao: "Certidão de trânsito em julgado e sentença anterior", origem: antifraude, obrigatoria: true, peso: 1.0 }
    provas_que_afastam: []
    fundamentacao:
      dispositivos:
        - { ref: "CPC, art. 337, VII e § 4º; arts. 502 e 508", tipo: dispositivo, para_que_serve: "coisa julgada material", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes: []
      argumentos_chave:
        - "Questão já decidida com trânsito em julgado."
    pedidos:
      - "Extinção sem resolução do mérito por coisa julgada."
    pedidos_subsidiarios: []
    risco_se_mal_aplicada: null
    ativa: true

  - id: T04
    nome: "Fracionamento indevido de demandas (um bilhete/PNR, várias ações; ida e volta separadas; bagagem separada do atraso)"
    categoria: processual
    ordem: 5
    pai: null
    resumo: >-
      Um mesmo contrato de transporte (PNR) e um mesmo evento foram desdobrados em várias ações
      (por passageiro da mesma família quando o dano é um só, por trecho, por pedido), multiplicando
      honorários e dano moral. Pede-se reunião por conexão e consideração do conjunto.
    condicoes_aplicacao:
      - { campo: acoes_mesmo_pnr_n, operador: ">=", valor: 2 }
    provas_necessarias:
      - { tipo_documento: relatorio_antifraude, descricao: "Lista das ações com o mesmo PNR/voo: autores, datas, pedidos", origem: antifraude, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: pnr, descricao: "PNR com todos os passageiros e trechos", origem: subsidio, obrigatoria: true, peso: 0.9 }
    provas_que_afastam:
      - { tipo_documento: peticao_inicial, descricao: "Passageiros com danos próprios e individualizados (ex.: criança desacompanhada, PcD)", origem: extracao, obrigatoria: false, peso: 0.7 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, arts. 55, 58 e 59; arts. 5º, 6º, 77 e 80", tipo: dispositivo, para_que_serve: "conexão, prevenção, boa-fé processual", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ / TJPA — fracionamento de demandas e abuso do direito de ação em transporte aéreo [A CONFERIR]", tipo: precedente, para_que_serve: "caracterização do fracionamento abusivo", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CNJ — Recomendação sobre litigância predatória; Centro de Inteligência do TJPA [A CONFERIR]", tipo: norma_regulatoria, para_que_serve: "instrumentos de gestão", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Um só evento (voo X, data Y) e um só contrato foram pulverizados em N ações pelo mesmo advogado."
        - "Dano moral de passageiros do mesmo núcleo pelo mesmo atraso deve ser arbitrado em conjunto."
    pedidos:
      - "Reunião dos feitos no juízo prevento; reconhecimento do fracionamento para fins de dano moral e sucumbência."
    pedidos_subsidiarios:
      - "Fixação de dano moral considerando o conjunto das ações do mesmo PNR."
    risco_se_mal_aplicada: "Negar individualidade do dano de passageiro vulnerável (criança, idoso, PcD) do mesmo PNR."
    ativa: true

  # ---------------------------------------------------------------- PREJUDICIAL
  - id: T05
    nome: "Prescrição — CDC art. 27 (5 anos, doméstico) / Convenção de Montreal art. 35 (2 anos, internacional)"
    categoria: prejudicial
    ordem: 6
    pai: null
    resumo: >-
      Entre a data do voo e o ajuizamento transcorreu prazo superior ao prescricional: 5 anos (CDC,
      art. 27) no transporte doméstico; 2 anos (Convenção de Montreal, art. 35) no internacional,
      conforme prevalência fixada pelo STF.
    condicoes_aplicacao:
      - { campo: data_voo, operador: existe }
      - { campo: data_ajuizamento, operador: existe }
    provas_necessarias:
      - { tipo_documento: pnr, descricao: "PNR/bilhete com data do voo e natureza (doméstico/internacional)", origem: subsidio, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: reclamacao_administrativa, descricao: "Reclamação que o advogado-dono entenda suspensiva/interruptiva", origem: subsidio, obrigatoria: false, peso: 0.5 }
    fundamentacao:
      dispositivos:
        - { ref: "CDC, art. 27", tipo: dispositivo, para_que_serve: "5 anos — fato do serviço (doméstico)", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "Convenção de Montreal (Decreto 5.910/2006), art. 35", tipo: dispositivo, para_que_serve: "2 anos — transporte internacional", conferido: false, nota: "[A CONFERIR pelo advogado-dono — conferir se o STF/STJ aplicam o art. 35 também a dano moral]" }
        - { ref: "CBA (Lei 7.565/1986), art. 317", tipo: dispositivo, para_que_serve: "prazo de 2 anos — discutir aplicabilidade residual", conferido: false, nota: "[A CONFERIR pelo advogado-dono — STJ afasta o CBA em relação de consumo doméstica?]" }
      precedentes:
        - { ref: "STF, RE 636.331 e ARE 766.618 (Tema 210) — prevalência das Convenções de Varsóvia/Montreal sobre o CDC no transporte internacional", tipo: tema, para_que_serve: "base para o prazo bienal internacional", conferido: false, nota: "[A CONFERIR pelo advogado-dono — tese exata e alcance (dano material × moral)]" }
      argumentos_chave:
        - "Transporte internacional: prazo bienal da Convenção, que prevalece sobre o CDC (Tema 210 STF)."
        - "Transporte doméstico: prazo quinquenal do CDC, contado do voo."
    pedidos:
      - "Reconhecimento da prescrição e extinção com resolução de mérito (CPC, art. 487, II)."
    pedidos_subsidiarios: []
    risco_se_mal_aplicada: "Invocar prazo bienal da Convenção para voo doméstico, ou para dano moral quando o tribunal restringe a prevalência ao dano material."
    ativa: true

  # ---------------------------------------------------------------- MÉRITO — CAUSA DO ATRASO/CANCELAMENTO
  - id: T06
    nome: "Força maior / fortuito externo — condições meteorológicas adversas (METAR/TAF) ou restrição de tráfego aéreo/infraestrutura aeroportuária"
    categoria: merito
    ordem: 7
    pai: null
    resumo: >-
      O atraso/cancelamento decorreu de condição meteorológica abaixo dos mínimos operacionais
      (teto, visibilidade, vento, tempestade — regime amazônico), de fechamento/restrição de
      aeroporto ou de controle de tráfego aéreo (ATC), eventos externos e inevitáveis. Prova-se com
      METAR/TAF da janela do voo, NOTAM, comunicados de infraestrutura, e com o impacto em voos
      de outras companhias no mesmo aeroporto e dia.
    condicoes_aplicacao:
      - { campo: motivo_categoria, operador: in, valor: [meteorologia, atc_infraestrutura_aeroportuaria] }
      - { campo: status_voo, operador: in, valor: [atrasado, cancelado, desviado] }
    provas_necessarias:
      - { tipo_documento: registro_voo, descricao: "Registro operacional do voo: horários programado/real, status, código do motivo", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: metar_taf, descricao: "METAR/TAF do(s) aeroporto(s) na janela do voo (REDEMET/ICEA) com leitura dos mínimos", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: notam, descricao: "NOTAM/comunicado de fechamento ou restrição de pista/aeroporto; registro de ATC", origem: subsidio, obrigatoria: false, peso: 0.9 }
      - { tipo_documento: relatorio_malha, descricao: "Painel de voos do aeroporto (outras cias) na mesma janela mostrando atrasos/cancelamentos generalizados", origem: subsidio, obrigatoria: false, peso: 0.8 }
    provas_que_afastam:
      - { tipo_documento: metar_taf, descricao: "METAR/TAF dentro dos mínimos na janela; ou condição adversa só horas depois do horário programado", origem: subsidio, obrigatoria: false, peso: 1.0 }
      - { tipo_documento: relatorio_malha, descricao: "Outras cias operaram normalmente no mesmo aeroporto/janela", origem: subsidio, obrigatoria: false, peso: 0.9 }
      - { tipo_documento: registro_voo, descricao: "Código de motivo comercial/malha/tripulação divergente da alegação meteorológica", origem: subsidio, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CDC, art. 14, § 3º, II", tipo: dispositivo, para_que_serve: "excludente: fato de terceiro / fortuito externo", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CC, arts. 393 e 734", tipo: dispositivo, para_que_serve: "força maior; responsabilidade do transportador salvo força maior", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CBA (Lei 7.565/1986), arts. 256, § 1º, 'b', e 230", tipo: dispositivo, para_que_serve: "exclusão por motivo meteorológico/segurança; dever de assistência subsiste", conferido: false, nota: "[A CONFERIR pelo advogado-dono — aplicabilidade do CBA em relação de consumo]" }
        - { ref: "Res. ANAC 400/2016, arts. 20 a 27 (alteração, cancelamento, atraso: informação, assistência, reacomodação) [A CONFERIR artigos]", tipo: norma_regulatoria, para_que_serve: "mesmo com força maior, obrigações de assistência — demonstrar cumprimento (T08)", conferido: false, nota: "[A CONFERIR pelo advogado-dono — versão consolidada com alterações]" }
        - { ref: "Convenção de Montreal, art. 19", tipo: dispositivo, para_que_serve: "internacional: transportador não responde se tomou todas as medidas razoáveis", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ — condição meteorológica adversa como fortuito externo × previsibilidade/risco da atividade (precedentes A CONFERIR)", tipo: precedente, para_que_serve: "regra e limites: a cia precisa provar a condição e a assistência", conferido: false, nota: "[A CONFERIR pelo advogado-dono — risco: tribunais exigem prova específica, não 'print' genérico]" }
        - { ref: "TJPA / Turmas Recursais — acórdãos que reconhecem força maior meteorológica com METAR anexo [A CONFERIR]", tipo: precedente, para_que_serve: "jurisprudência local", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "O METAR das HHhMM–HHhMM registra teto/visibilidade/vento abaixo dos mínimos; a operação era inviável com segurança."
        - "Outros voos (cias X e Y) no mesmo aeroporto foram cancelados/atrasados na mesma janela."
        - "A companhia não cria nem controla o clima nem o tráfego aéreo; cumpriu a assistência devida (T08)."
    pedidos:
      - "Improcedência por rompimento do nexo causal (fortuito externo)."
    pedidos_subsidiarios:
      - "Reconhecimento de que a assistência prestada mitigou integralmente os danos (T08)."
    risco_se_mal_aplicada: "Alegar 'mau tempo' sem METAR/TAF anexo é a defesa mais rejeitada nesta tipologia; viola a regra de citação e desmoraliza a peça."
    ativa: true

  - id: T07
    nome: "Manutenção não programada e segurança de voo — dever de não decolar"
    categoria: merito
    ordem: 8
    pai: null
    resumo: >-
      O atraso/cancelamento decorreu de falha técnica imprevista detectada na inspeção pré-voo ou
      em voo, cuja correção é obrigatória por normas de aeronavegabilidade; a companhia agiu no
      interesse da segurança dos passageiros. Tese de alto risco: a jurisprudência majoritária
      trata manutenção como fortuito interno; usar principalmente para afastar/mitigar dano moral,
      combinada com T08.
    condicoes_aplicacao:
      - { campo: motivo_categoria, operador: in, valor: [manutencao_nao_programada, seguranca_operacional] }
      - { campo: manutencao_registro_disponivel, operador: "==", valor: true }
    provas_necessarias:
      - { tipo_documento: registro_voo, descricao: "Registro do voo com código de motivo técnico", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: log_manutencao, descricao: "Registro técnico da falha (log de manutenção, item MEL, relatório de pane) e da liberação da aeronave", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: registro_reacomodacao, descricao: "Providências imediatas: troca de aeronave, reacomodação, tempo até o novo voo", origem: subsidio, obrigatoria: true, peso: 0.8 }
    provas_que_afastam:
      - { tipo_documento: log_manutencao, descricao: "Falha recorrente na mesma aeronave ou item de manutenção programada vencido", origem: subsidio, obrigatoria: false, peso: 1.0 }
      - { tipo_documento: registro_voo, descricao: "Motivo técnico sem registro de manutenção correspondente", origem: subsidio, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CBA (Lei 7.565/1986), arts. 20, 66 e seguintes (aeronavegabilidade) e RBAC 121/135 [A CONFERIR]", tipo: norma_regulatoria, para_que_serve: "proibição de operar aeronave sem condição de aeronavegabilidade", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CDC, art. 14, § 3º, I", tipo: dispositivo, para_que_serve: "inexistência de defeito: o serviço foi prestado com a segurança que dele se espera", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ — manutenção não programada como fortuito interno (risco do empreendimento) [A CONFERIR]", tipo: precedente, para_que_serve: "risco a enfrentar: a tese raramente exclui a responsabilidade; serve para o quantum", conferido: false, nota: "[A CONFERIR pelo advogado-dono — avaliar se vale incluir como exclusão ou só como mitigação]" }
        - { ref: "TJPA — tratamento de manutenção não programada [A CONFERIR]", tipo: precedente, para_que_serve: "jurisprudência local", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "A falha foi detectada em inspeção e a decolagem seria ilícita; a decisão protegeu os passageiros."
        - "A companhia reacomodou em X horas e prestou assistência integral; não há dano moral indenizável, apenas dissabor."
    pedidos:
      - "Improcedência; subsidiariamente, afastamento ou redução do dano moral pela diligência demonstrada."
    pedidos_subsidiarios:
      - "Quantum reduzido, considerando a causa de segurança e a assistência prestada."
    risco_se_mal_aplicada: "Sustentar manutenção como excludente plena contra jurisprudência consolidada de fortuito interno gera sucumbência e perda de credibilidade; usar como mitigação."
    ativa: true

  # ---------------------------------------------------------------- MÉRITO — CUMPRIMENTO DA RES. ANAC 400
  - id: T08
    nome: "Cumprimento integral da Res. ANAC 400/2016 — informação, assistência material, reacomodação e reembolso"
    categoria: merito
    ordem: 9
    pai: null
    resumo: >-
      Independentemente da causa, a companhia cumpriu as obrigações regulatórias: informou o
      passageiro com a antecedência devida (ou imediatamente), ofereceu as alternativas
      (reacomodação no próprio voo/outra cia, reembolso integral, execução por outro meio),
      prestou assistência material escalonada por tempo de espera (comunicação ≥ 1h, alimentação
      ≥ 2h, hospedagem/transporte ≥ 4h) [A CONFERIR] e o passageiro chegou ao destino com atraso
      limitado. O dano moral, se algum, é mínimo.
    condicoes_aplicacao:
      - { campo: assistencia_comprovantes_disponiveis, operador: "==", valor: true }
      - { campo: opcao_oferecida, operador: "!=", valor: nenhuma }
    provas_necessarias:
      - { tipo_documento: comunicacao_passageiro, descricao: "Registro de aviso ao passageiro (e-mail/SMS/app) com data/hora e conteúdo", origem: subsidio, obrigatoria: true, peso: 0.9 }
      - { tipo_documento: voucher_assistencia, descricao: "Vouchers de alimentação, hospedagem e transporte emitidos em nome do passageiro, com data/hora", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: registro_reacomodacao, descricao: "Registro da oferta de alternativas e da opção escolhida; novo bilhete/boarding pass", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: comprovante_reembolso, descricao: "Comprovante de reembolso integral (data, valor, meio), quando escolhido", origem: subsidio, obrigatoria: false, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: voucher_assistencia, descricao: "Vouchers em nome de outro passageiro, de outra data, ou ausentes para faixa de espera atingida", origem: subsidio, obrigatoria: false, peso: 1.0 }
      - { tipo_documento: comunicacao_passageiro, descricao: "Aviso com antecedência inferior à regulatória para alteração programada [A CONFERIR 72h]", origem: subsidio, obrigatoria: false, peso: 0.9 }
      - { tipo_documento: registro_reacomodacao, descricao: "Reacomodação só para dias depois sem oferta de outra cia/reembolso", origem: subsidio, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "Res. ANAC 400/2016, arts. 12 (alteração programada — aviso 72h), 20-22 (informação), 21 (alternativas: reacomodação/reembolso/outro meio), 26-27 (assistência material escalonada 1h/2h/4h), 28-29 (reembolso) [A CONFERIR artigos e prazos]", tipo: norma_regulatoria, para_que_serve: "pauta objetiva do que a companhia devia e cumpriu", conferido: false, nota: "[A CONFERIR pelo advogado-dono — versão consolidada da Res. 400 com alterações; conferir cada prazo]" }
        - { ref: "CDC, arts. 6º, III, 14 e 20", tipo: dispositivo, para_que_serve: "dever de informação e adequação do serviço — demonstrar atendimento", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CC, art. 741", tipo: dispositivo, para_que_serve: "interrupção da viagem: dever de concluir o transporte e custear estada", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ — assistência material prestada como fator que afasta ou reduz o dano moral por atraso (precedentes A CONFERIR)", tipo: precedente, para_que_serve: "efeito jurídico do cumprimento da Res. 400", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "TJPA / Turmas Recursais — peso da assistência comprovada no quantum [A CONFERIR]", tipo: precedente, para_que_serve: "jurisprudência local", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "O passageiro foi informado às HHhMM, recebeu voucher de alimentação/hotel/transporte (anexos) e foi reacomodado no voo Z, chegando com X horas de atraso."
        - "O cumprimento da Res. ANAC 400 esgota o dever regulatório; não há falha adicional que fundamente dano moral."
    pedidos:
      - "Improcedência; subsidiariamente, redução substancial do dano moral pela assistência prestada."
    pedidos_subsidiarios:
      - "Abatimento de valores já reembolsados/pagos de qualquer condenação."
    risco_se_mal_aplicada: "Afirmar assistência prestada sem voucher em nome do passageiro anexo é o erro mais comum da tipologia e inverte o resultado."
    ativa: true

  - id: T08.1
    nome: "Reembolso integral já efetuado / opção do passageiro pelo reembolso"
    categoria: merito
    ordem: 10
    pai: T08
    resumo: >-
      O passageiro optou pelo reembolso (ou pela execução por outro meio) e foi integralmente
      reembolsado no prazo regulatório; não há dano material remanescente e o dano moral não decorre
      de opção voluntária.
    condicoes_aplicacao:
      - { campo: reembolso_realizado, operador: "==", valor: true }
    provas_necessarias:
      - { tipo_documento: comprovante_reembolso, descricao: "Comprovante do estorno (data, valor, forma, prazo)", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: registro_reacomodacao, descricao: "Registro da escolha do passageiro pelo reembolso", origem: subsidio, obrigatoria: true, peso: 0.9 }
    provas_que_afastam:
      - { tipo_documento: comprovante_reembolso, descricao: "Reembolso parcial, em crédito não aceito, ou fora do prazo de 7 dias [A CONFERIR]", origem: subsidio, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "Res. ANAC 400/2016, arts. 28-29 (reembolso integral em 7 dias) [A CONFERIR]", tipo: norma_regulatoria, para_que_serve: "regularidade do reembolso", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CC, art. 884", tipo: dispositivo, para_que_serve: "vedação ao enriquecimento sem causa (reembolso + dano material do bilhete)", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes: []
      argumentos_chave:
        - "O valor do bilhete já foi estornado; o pedido de dano material é bis in idem."
    pedidos:
      - "Improcedência do dano material; consideração do reembolso tempestivo no dano moral."
    pedidos_subsidiarios: []
    risco_se_mal_aplicada: "Alegar reembolso realizado quando foi em crédito/voucher recusado pelo passageiro."
    ativa: true

  - id: T09
    nome: "Preterição de embarque (overbooking) — chamada de voluntários e compensação paga"
    categoria: merito
    ordem: 11
    pai: null
    resumo: >-
      Na preterição, a companhia seguiu o procedimento regulatório: buscou voluntários, ofereceu
      compensação negociada, e ao passageiro preterido involuntariamente pagou a compensação
      financeira mínima da Res. 400 (DES) além da assistência e reacomodação; a compensação paga
      deve ser considerada/abatida.
    condicoes_aplicacao:
      - { campo: subtipo, operador: in, valor: [overbooking, misto] }
      - { campo: overbooking_voluntarios_chamados, operador: "==", valor: true }
    provas_necessarias:
      - { tipo_documento: registro_pretericao, descricao: "Registro operacional da chamada de voluntários e da preterição (horários, nº de passageiros)", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: comprovante_compensacao, descricao: "Comprovante de pagamento da compensação (valor em DES convertido) e termo assinado", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: voucher_assistencia, descricao: "Assistência material e reacomodação do preterido", origem: subsidio, obrigatoria: true, peso: 0.9 }
    provas_que_afastam:
      - { tipo_documento: registro_pretericao, descricao: "Sem chamada de voluntários; preterição de passageiro com check-in e no portão no horário", origem: subsidio, obrigatoria: false, peso: 1.0 }
      - { tipo_documento: comprovante_compensacao, descricao: "Compensação não paga ou abaixo do mínimo regulatório", origem: subsidio, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "Res. ANAC 400/2016, arts. 22 a 24 (preterição: voluntários, compensação de 250/500 DES, assistência) [A CONFERIR artigos e valores]", tipo: norma_regulatoria, para_que_serve: "procedimento e compensação tarifada", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CC, art. 944", tipo: dispositivo, para_que_serve: "compensação paga abate a indenização", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ — overbooking: dano moral in re ipsa × efeito da compensação paga [A CONFERIR]", tipo: precedente, para_que_serve: "risco: STJ tende a presumir dano moral em preterição; a compensação paga reduz o quantum", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "O procedimento regulatório foi observado e o passageiro recebeu compensação de R$ X e reacomodação em Y horas."
        - "A compensação paga deve ser abatida de qualquer condenação."
    pedidos:
      - "Improcedência; subsidiariamente, abatimento da compensação paga e quantum reduzido."
    pedidos_subsidiarios:
