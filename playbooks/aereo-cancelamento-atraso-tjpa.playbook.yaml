# =============================================================================
# Águia Peregrina — M0 Playbook — Transporte aéreo: cancelamento/atraso/overbooking/bagagem (defesa) — TJPA
# =============================================================================
# PRIMEIRO RASCUNHO. Nenhuma citação legal, número, prazo ou valor aqui foi
# conferido por advogado. Todo item marcado "[A CONFERIR pelo advogado-dono]"
# e `conferido: false` precisa ser validado (texto vigente da Res. ANAC
# 400/2016 e alterações, Tema do STF sobre Convenção de Montreal, Temas/Súmulas
# do STJ, jurisprudência atual do TJPA e Turmas Recursais) antes de o status
# virar `aprovado`. O validador recusa `status: aprovado` enquanto houver pendência.
#
# ESCOPO: SOMENTE DEFESA da companhia aérea. O spinoff de compra de créditos
# judiciais opera a mesma tipologia pelo lado do autor; este playbook não
# cobre esse lado (lado: defesa) e não deve ser reaproveitado para ele.
#
# Fonte da verdade: este YAML. A versão em prosa
# (aereo-cancelamento-atraso-tjpa.playbook.md) é derivada.
# =============================================================================

schema_version: "1.0"

metadata:
  id: aereo-cancelamento-atraso-tjpa
  nome: "Transporte aéreo — cancelamento, atraso, preterição (overbooking) e extravio de bagagem — defesa de companhia aérea — TJPA"
  tipologia: aereo_cancelamento_atraso
  tribunal: TJPA
  reu_tipo: companhia_aerea
  lado: defesa
  tipo_peca_padrao: contestacao
  versao: 1
  supera_versao: null
  autor_nome: "Gustavo Fonseca — OAB/PA 12.724 — revisão própria até nomear advogado-dono da tipologia"
  autor_oab: "PA 12724"
  criado_em: 2026-10-19T12:00:00-03:00
  status: rascunho
  aprovado_por_nome: null
  aprovado_por_oab: null
  aprovado_em: null
  descricao: >-
    Ações de consumidor contra companhia aérea (foco: Azul, LATAM e Gol operando no Pará —
    Belém/BEL, Santarém/STM, Marabá/MAB, Altamira/ATM, Carajás/CKS) por cancelamento ou atraso de
    voo, perda de conexão, preterição de embarque (overbooking), extravio/avaria/violação de
    bagagem e falhas de assistência material. Pedidos típicos: dano moral, dano material
    (despesas, diárias, bens), reembolso. Defesa exclusivamente; o lado do autor é tratado pelo
    spinoff de créditos e não por este playbook.
  observacoes: >-
    Rascunho gerado para validação. Antes de aprovar: (1) conferir artigos da Res. ANAC 400/2016
    (assistência material por faixa de atraso, reacomodação, reembolso, informação, bagagem) e
    alterações posteriores; (2) conferir a tese do STF no RE 636.331 (Tema 210) e sua extensão
    (bagagem × dano moral) e a jurisprudência do STJ sobre dano moral por atraso (prova do dano ×
    in re ipsa) e sobre limite de indenização de bagagem; (3) calibrar faixas de acordo por grupo
    de comarcas e por tipo de evento; (4) confirmar com o cliente quais subsídios (PNR, status do
    voo, código de motivo, METAR/TAF, vouchers, PIR) ele entrega em até 5 dias úteis e em que formato.

