        - "Sem declaração especial de valor e sem prova do conteúdo, o dano material não pode superar o padrão/limite."
        - "Internacional: dano material limitado a 1.288 DES [A CONFERIR] (Tema 210 STF)."
    pedidos:
      - "Improcedência do dano moral (extravio temporário breve) e limitação do dano material ao comprovado/limite convencional."
    pedidos_subsidiarios:
