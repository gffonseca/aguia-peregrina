  # ---------------------------------------------------------------- MÉRITO — BAGAGEM
  - id: T11
    nome: "Bagagem — devolução em prazo curto, ausência de declaração de valor, limite indenizatório (Convenção de Montreal no internacional) e PIR"
    categoria: merito
    ordem: 13
    pai: null
    resumo: >-
      A bagagem foi localizada e entregue em poucos dias (extravio temporário), não houve
      declaração especial de valor, o conteúdo alegado não foi comprovado, e a companhia já
      indenizou/ressarciu administrativamente. No transporte internacional, aplica-se o limite de
      1.288 DES [A CONFERIR] da Convenção de Montreal ao dano material (STF, Tema 210).
    condicoes_aplicacao:
      - { campo: subtipo, operador: in, valor: [bagagem_extravio, bagagem_avaria, bagagem_violacao, misto] }
      - { campo: pir_registrado, operador: "==", valor: true }
    provas_necessarias:
      - { tipo_documento: pir, descricao: "PIR com data/hora, descrição da bagagem e etiqueta", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: registro_entrega_bagagem, descricao: "Comprovante de entrega da bagagem (data, local, assinatura) ou de indenização paga", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: etiqueta_bagagem, descricao: "Etiqueta/recibo de despacho e ausência de declaração especial de valor", origem: subsidio, obrigatoria: false, peso: 0.8 }
