# -----------------------------------------------------------------------------
# MODELO DE PEÇA (M6)
# -----------------------------------------------------------------------------
modelo_peca:
  tipo: contestacao
  formato_saida: markdown
  regra_citacao: "Toda afirmação de fato cita document_page_id (draft_citations). Sem página, sem afirmação. METAR/TAF e vouchers só entram com o documento-fonte anexo."
  secoes:
    - { ordem: 1, id: enderecamento, titulo: "Endereçamento, qualificação e tempestividade", obrigatoria: true, teses_vinculadas: [], instrucoes: "Juízo, vara/juizado, número CNJ, partes; data da citação e tempestividade.", exige_citacao_de_pagina: false }
    - { ordem: 2, id: sintese, titulo: "Síntese da demanda", obrigatoria: true, teses_vinculadas: [], instrucoes: "Resumir pedidos e causa de pedir em até 8 linhas; identificar subtipo, voo, data, trechos e se é internacional.", exige_citacao_de_pagina: true }
    - { ordem: 3, id: preliminares, titulo: "Preliminares", obrigatoria: false, teses_vinculadas: [T01, T02, T03, T03.1, T04], instrucoes: "Uma subseção por tese aplicável, na ordem do playbook; incompetência relativa (T02) obrigatoriamente aqui, sob pena de prorrogação. Omitir se nenhuma se aplicar.", exige_citacao_de_pagina: true }
    - { ordem: 4, id: prejudicial, titulo: "Prejudicial de mérito — prescrição", obrigatoria: false, teses_vinculadas: [T05], instrucoes: "Só se o prazo (5 anos doméstico / 2 anos internacional) tiver transcorrido.", exige_citacao_de_pagina: true }
    - { ordem: 5, id: fatos, titulo: "Dos fatos — a reserva, o voo e o atendimento", obrigatoria: true, teses_vinculadas: [], instrucoes: "Linha do tempo do dossiê: PNR e passageiros, voo programado, comunicação, causa (código), METAR/NOTAM, alternativas oferecidas, assistência (vouchers), reacomodação/reembolso, chegada ao destino, PIR/entrega de bagagem, reclamação, ajuizamento. Cada evento com página.", exige_citacao_de_pagina: true }
    - { ordem: 6, id: merito_causa, titulo: "Do mérito — causa do atraso/cancelamento", obrigatoria: false, teses_vinculadas: [T06, T07, T10], instrucoes: "Só para subtipos de voo. Descrever a causa com registro do voo + METAR/TAF/NOTAM ou log de manutenção anexos; no-show com registro de check-in/portão. Nunca 'mau tempo' sem METAR.", exige_citacao_de_pagina: true }
    - { ordem: 7, id: merito_res400, titulo: "Do cumprimento da Resolução ANAC 400/2016", obrigatoria: false, teses_vinculadas: [T08, T08.1, T09], instrucoes: "Tabela: obrigação regulatória × prova anexa (aviso, alternativas, alimentação, hospedagem, transporte, reembolso, compensação por preterição). Só itens com comprovante.", exige_citacao_de_pagina: true }
    - { ordem: 8, id: merito_bagagem, titulo: "Do mérito — bagagem", obrigatoria: false, teses_vinculadas: [T11], instrucoes: "Só para subtipos de bagagem. PIR, prazo de devolução, declaração de valor, indenização paga; no internacional, teto de DES só para dano material.", exige_citacao_de_pagina: true }
    - { ordem: 9, id: dano_moral, titulo: "Da inexistência de dano moral", obrigatoria: true, teses_vinculadas: [T12], instrucoes: "Atraso total, assistência, ausência de circunstância concreta; enfrentar vulnerabilidade/compromisso se alegados; tom respeitoso; quantum subsidiário com faixa do TJPA.", exige_citacao_de_pagina: true }
    - { ordem: 10, id: subsidiarios, titulo: "Pedidos subsidiários — dano material, abatimentos, juros e correção", obrigatoria: true, teses_vinculadas: [T13], instrucoes: "Impugnar despesas sem comprovante/nexo; abater pagos; tetos da Convenção no internacional; Súmulas 362/54 e Lei 14.905/2024 [A CONFERIR].", exige_citacao_de_pagina: true }
    - { ordem: 11, id: providencias, titulo: "Providências processuais", obrigatoria: false, teses_vinculadas: [T14], instrucoes: "Só com flags confirmados por human_decide. Linguagem neutra; sem imputar fraude a pessoa.", exige_citacao_de_pagina: true }
    - { ordem: 12, id: provas, titulo: "Das provas", obrigatoria: true, teses_vinculadas: [], instrucoes: "Protestar por depoimento pessoal, juntada de registros operacionais, ofício à ANAC/DECEA/REDEMET se necessário; especificar.", exige_citacao_de_pagina: false }
    - { ordem: 13, id: pedidos, titulo: "Dos pedidos", obrigatoria: true, teses_vinculadas: [], instrucoes: "Consolidar na ordem: preliminares (incompetência primeiro), prejudicial, improcedência por subtipo, subsidiários, sucumbência, intimações.", exige_citacao_de_pagina: false }
    - { ordem: 14, id: anexos, titulo: "Rol de documentos", obrigatoria: true, teses_vinculadas: [], instrucoes: "Listar cada anexo com o tipo do playbook (pnr, registro_voo, metar_taf, voucher_assistencia, registro_reacomodacao, pir…).", exige_citacao_de_pagina: false }
  estilo:
    - "Português formal; frases curtas; sem adjetivação do autor ou do advogado adverso."
    - "Nenhuma afirmação de fato sem página dos autos ou documento anexo identificado; 'condições meteorológicas' só com METAR/TAF anexo e horário."
    - "Referências legais, artigos da Res. ANAC 400 e da Convenção de Montreal só os conferidos no playbook; nunca estender a Convenção ao dano moral sem decisão do advogado-dono."
    - "Tom respeitoso com passageiro vulnerável (criança, idoso, gestante, PcD/PNAE)."

# -----------------------------------------------------------------------------
# CRITÉRIOS DE REVISÃO (M7)
# -----------------------------------------------------------------------------
criterios_revisao:
  tempo_minimo_segundos: 900
  papel_minimo_revisor: lawyer
  exige_segunda_revisao_se:
    - { campo: valor_causa, operador: ">", valor: 50000.0, nota: "[A CONFERIR pelo advogado-dono]" }
    - { campo: autor_falecido, operador: "==", valor: true }
    - { campo: indicio_falha_real_cia, operador: "==", valor: true }
    - { campo: voo_internacional, operador: "==", valor: true }
    - { campo: autor_menor_idoso_pcd, operador: "==", valor: true }
  checklist:
    - { id: R01, item: "Cada fato da peça tem citação de página dos autos ou documento anexo identificado", bloqueante: true }
    - { id: R02, item: "Todas as referências legais, artigos da Res. ANAC 400 e da Convenção de Montreal citados estão conferidos no playbook (nenhum placeholder sobrou)", bloqueante: true }
    - { id: R03, item: "T06 (meteorologia/ATC) só foi usada com registro do voo + METAR/TAF/NOTAM anexos e horários compatíveis", bloqueante: true }
    - { id: R04, item: "T08 só foi usada com vouchers/registros em nome do passageiro e na data do evento; tabela obrigação × prova preenchida", bloqueante: true }
    - { id: R05, item: "Convenção de Montreal só invocada em voo internacional e só para dano material/prazo", bloqueante: true }
    - { id: R06, item: "Incompetência relativa (T02), se cabível, está nas preliminares (não se prorroga por omissão)", bloqueante: true }
    - { id: R07, item: "Nenhuma expressão imputa fraude/má-fé ao autor ou ao advogado sem flag confirmado por human_decide", bloqueante: true }
    - { id: R08, item: "Subtipo, PNR, voo, datas, atraso total e valores batem com o dossiê; seções de mérito não aplicáveis foram omitidas", bloqueante: true }
    - { id: R09, item: "Pedidos subsidiários presentes (dano material limitado, abatimentos, quantum, juros/correção)", bloqueante: true }
    - { id: R10, item: "Tom respeitoso; sem 'mero dissabor' em pernoite não assistido ou com passageiro vulnerável", bloqueante: false }
    - { id: R11, item: "Sinal de acordo avaliado e registrado (defender × acordar) antes de protocolar", bloqueante: false }
  motivos_recusa_padrao:
    - "Fato sem prova citável"
    - "Tese aplicada sem prova necessária (meteorologia sem METAR; assistência sem voucher)"
    - "Referência legal/regulatória não conferida ou inexistente"
    - "Convenção de Montreal aplicada fora do escopo (doméstico ou dano moral)"
    - "Subtipo/PNR/voo/valores/datas divergentes do dossiê"
    - "Linguagem imputa fraude sem decisão humana"
    - "Caso deveria ir para acordo/escalada, não para contestação padrão"

# -----------------------------------------------------------------------------
# MÉTRICAS (M10/M11)
# -----------------------------------------------------------------------------
metricas:
  - { id: M01, nome: "Tempo médio de revisão por contestação", definicao: "média de reviews.review_seconds para drafts desta tipologia", meta: "< 25 min com qualidade [A CONFERIR]", fonte: reviews }
  - { id: M02, nome: "Aprovação sem alteração substancial", definicao: "% de reviews aprovadas com substantial_change = false", meta: "> 60 % após 200 casos [A CONFERIR]", fonte: reviews }
  - { id: M03, nome: "Subsídios faltantes detectados antes da defesa", definicao: "% de casos com exceção X01/X05 aberta antes de gerar minuta", meta: "> 90 %", fonte: "dossiers + excecoes" }
  - { id: M04, nome: "Taxa de êxito por tese × subtipo × comarca", definicao: "outcomes.result ∈ {improcedente, parcial} por thesis_version_id, subtipo e comarca vs. baseline", meta: "≥ baseline + 10 p.p. [A CONFERIR]", fonte: outcomes }
  - { id: M05, nome: "Condenação média por subtipo e faixa de atraso", definicao: "média de outcomes.award_value por subtipo × faixa (<4h, 4–12h, >12h) × comarca; alimenta faixas_valor", meta: "queda de 20 % vs. baseline [A CONFERIR]", fonte: outcomes }
  - { id: M06, nome: "Custo de tokens por processo", definicao: "soma de llm_calls.cost_usd por case_id", meta: "< US$ 2 por contestação [A CONFERIR]", fonte: llm_calls }
  - { id: M07, nome: "Concordância modelo × revisor sênior", definicao: "gt_tasks.agreement_score médio (amostra semanal)", meta: "> 0,85", fonte: gt_tasks }
  - { id: M08, nome: "Flags antifraude confirmados por humano", definicao: "% de fraud_checks com result = flag e human_decision = confirmed, por código", meta: "monitorar precisão; recalibrar se < 50 %", fonte: fraud_checks }
  - { id: M09, nome: "Acordos sinalizados × realizados", definicao: "casos com sinal de acordo vs. outcomes.result = acordo e valor médio", meta: "calibrar faixas_valor trimestralmente", fonte: outcomes }
  - { id: M10, nome: "Cobertura de METAR/TAF em T06", definicao: "% de peças com T06 em que há metar_taf anexo com horário dentro da janela do voo", meta: "100 %", fonte: "drafts + draft_citations" }
  - { id: M11, nome: "Declínios de competência obtidos (T02)", definicao: "% de T02 arguidas com decisão de declínio", meta: "monitorar; recalibrar comprovante_endereco_outra_uf", fonte: outcomes }
