      implementada_em_m4: false
      calibrar: true
    - codigo: concentracao_advogado_mes
      descricao: "Mesmo advogado com mais de N ações contra o cliente no mês"
      parametros: { n_min: 30, janela_dias: 30, nota: "[A CONFERIR pelo advogado-dono] calibrar N com a carteira" }
      severidade: low
      evidencia_esperada: "lista de CNJs do mesmo advogado na janela"
      implementada_em_m4: false
