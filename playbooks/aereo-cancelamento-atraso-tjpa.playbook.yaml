    provas_que_afastam:
      - { tipo_documento: registro_entrega_bagagem, descricao: "Bagagem não localizada após o prazo regulatório (7 dias doméstico / 21 internacional [A CONFERIR]) ou devolvida violada com registro", origem: subsidio, obrigatoria: false, peso: 1.0 }
      - { tipo_documento: pir, descricao: "PIR não registrado por recusa do balcão (reclamação administrativa do passageiro comprova)", origem: extracao, obrigatoria: false, peso: 0.9 }
    fundamentacao:
      dispositivos:
        - { ref: "Res. ANAC 400/2016, arts. 32 a 35 (bagagem: PIR, prazo de devolução, ressarcimento de despesas, indenização em 7 dias) [A CONFERIR artigos e prazos]", tipo: norma_regulatoria, para_que_serve: "procedimento e prazos regulatórios", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "Convenção de Montreal (Decreto 5.910/2006), arts. 17, 22 (limite de 1.288 DES para bagagem) e 31 (protesto em prazo)", tipo: dispositivo, para_que_serve: "limite indenizatório e prazo de reclamação no internacional", conferido: false, nota: "[A CONFERIR pelo advogado-dono — valor atualizado do limite em DES e tese do STF sobre alcance (dano material apenas)]" }
        - { ref: "CDC, art. 14; CC, art. 734, parágrafo único", tipo: dispositivo, para_que_serve: "declaração de valor como pressuposto de indenização acima do padrão — enfrentar o CDC", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STF, RE 636.331 (Tema 210) — limites da Convenção aplicam-se ao dano material no internacional; dano moral fora do limite", tipo: tema, para_que_serve: "teto da indenização material por bagagem internacional", conferido: false, nota: "[A CONFERIR pelo advogado-dono — tese e alcance]" }
        - { ref: "STJ — extravio temporário × definitivo; dano moral por extravio temporário de poucos dias (precedentes A CONFERIR)", tipo: precedente, para_que_serve: "quantum ou afastamento por devolução rápida", conferido: false, nota: "[A CONFERIR pelo advogado-dono — risco: STJ reconhece dano moral in re ipsa no extravio, mesmo temporário]" }
        - { ref: "TJPA — faixa de dano moral por extravio temporário/definitivo [A CONFERIR]", tipo: precedente, para_que_serve: "quantum local", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
