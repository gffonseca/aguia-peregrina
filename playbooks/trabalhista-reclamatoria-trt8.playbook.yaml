  - { campo: rito, tipo: texto, origem: extracao, descricao: "ordinario | sumarissimo", obrigatorio: true }
  - { campo: cliente_e_tomador, tipo: booleano, origem: subsidio, descricao: "Cliente figura como tomador de serviços (não empregador direto)", obrigatorio: true, bloqueia_minuta_se_ausente: true }
