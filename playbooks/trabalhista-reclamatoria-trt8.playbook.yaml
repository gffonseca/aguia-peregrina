        - { ref: "Lei 8.666/1993, art. 71, § 1º / Lei 14.133/2021, art. 121", tipo: dispositivo, para_que_serve: "ente público", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "TST, Súmula 331 (I a VI)", tipo: sumula, para_que_serve: "alcance da subsidiariedade e necessidade de participação no processo", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "STF, Tema 725 (ADPF 324 / RE 958.252) — licitude da terceirização de atividade-fim", tipo: tema, para_que_serve: "afastar vínculo/ilicitude", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
