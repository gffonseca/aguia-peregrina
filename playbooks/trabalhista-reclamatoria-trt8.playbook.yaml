  - { campo: dano_moral_fundamento, tipo: texto, origem: extracao, descricao: "assedio_moral | assedio_sexual | acidente | atraso_salarios | revista | nenhum", obrigatorio: false }
  - { campo: data_ajuizamento, tipo: data, origem: extracao, descricao: "Data de distribuição", obrigatorio: true }
  - { campo: data_audiencia, tipo: data, origem: publicacao, descricao: "Data da audiência (inicial/una)", obrigatorio: false }
