        - { ref: "Lei 14.905/2024 (CC, arts. 389 e 406 — IPCA + SELIC deduzido IPCA)", tipo: dispositivo, para_que_serve: "índices após 30/08/2024 [A CONFERIR]", conferido: false, nota: "[A CONFERIR pelo advogado-dono — aplicação na Justiça do Trabalho (decisões do TST em 2024/2025)]" }
      precedentes:
        - { ref: "STF, ADC 58 e ADC 59 (IPCA-E pré-judicial + SELIC da citação)", tipo: precedente, para_que_serve: "índices", conferido: false, nota: "[A CONFERIR pelo advogado-dono — modulação e interação com a Lei 14.905]" }
        - { ref: "TST, Súmula 368 e OJ 400 SDI-1 (IR/INSS; juros não integram base do IR)", tipo: sumula, para_que_serve: "descontos", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "TST, OJ 415 SDI-1 (dedução global de horas extras pagas)", tipo: precedente, para_que_serve: "dedução", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
