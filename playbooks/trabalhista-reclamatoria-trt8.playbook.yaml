  - { campo: pedidos, tipo: lista, origem: extracao, descricao: "Lista de pedidos da inicial com valor indicado por pedido: horas_extras | intervalo | insalubridade | periculosidade | rescisorias | equiparacao | dano_moral | justa_causa | subsidiaria | outros", obrigatorio: true, bloqueia_minuta_se_ausente: true }
