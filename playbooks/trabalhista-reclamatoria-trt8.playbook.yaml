  # ---------------------------------------------------------------- SINAL (não é argumento autônomo)
  - id: T13
    nome: "Sinais de litigância em série / troca de favores — providências processuais e preparação de audiência"
    categoria: sinal
    ordem: 17
    pai: null
    resumo: >-
      Providências (contradita de testemunha por troca de favores — com prova; depoimento pessoal;
      exibição de documentos; comunicação ao Centro de Inteligência/Corregedoria do TRT-8) que só
      entram na peça ou no briefing se o advogado-revisor confirmar os flags do M4: reclamante com
      múltiplas ações contra o grupo, testemunhas recíprocas, pedidos idênticos em série do mesmo
      escritório, atestados repetidos. Jamais rotular reclamante, testemunha ou advogado.
    condicoes_aplicacao:
      - { campo: testemunha_reciproca, operador: "==", valor: true }
    provas_necessarias:
      - { tipo_documento: relatorio_antifraude, descricao: "Flags do M4 com evidência (CNJs cruzados, atas de audiência) e decisão humana registrada (human_decide)", origem: antifraude, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: relatorio_antifraude, descricao: "Flags não confirmados por advogado com OAB", origem: antifraude, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CLT, arts. 793-A a 793-D (litigância de má-fé, inclusive testemunha) e 829; CPC, arts. 447, § 3º, e 457", tipo: dispositivo, para_que_serve: "contradita e má-fé — usar com prova", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "TST, Súmula 357 (não torna suspeita a testemunha só por litigar contra o mesmo empregador) — limite da contradita", tipo: sumula, para_que_serve: "risco: só a reciprocidade com o mesmo objeto justifica a contradita [A CONFERIR jurisprudência SDI-1]", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CNJ — Recomendação sobre litigância predatória; TRT-8 — Centro de Inteligência / Corregedoria [A CONFERIR]", tipo: norma_regulatoria, para_que_serve: "canal institucional", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Contradita fundamentada em reciprocidade comprovada (atas das duas ações), não na mera condição de litigante."
        - "Depoimento pessoal e exibição de documentos; comunicação institucional do padrão sem imputar conduta a pessoa."
    pedidos:
      - "Contradita (em audiência) com a prova; depoimento pessoal; exibição de documentos; demais providências."
    pedidos_subsidiarios: []
    risco_se_mal_aplicada: "Contradita com base só na Súmula 357 invertida ou acusação de má-fé sem prova gera multa ao réu e antipatia do juízo; só após decisão humana registrada."
    ativa: true

