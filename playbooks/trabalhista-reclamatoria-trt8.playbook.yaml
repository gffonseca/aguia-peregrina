# -----------------------------------------------------------------------------
# ÁRVORE DE TESES — uma tese por pedido típico
# -----------------------------------------------------------------------------
teses:
  # ---------------------------------------------------------------- PRELIMINARES / PROCESSUAIS
  - id: T01
    nome: "Impugnação à justiça gratuita e honorários sucumbenciais do reclamante (ADI 5.766)"
    categoria: preliminar
    ordem: 1
    pai: null
    resumo: >-
      O reclamante recebia salário acima de 40 % do teto do RGPS e não comprovou insuficiência
      (CLT, art. 790, §§ 3º e 4º); requer-se indeferimento da gratuidade e, em qualquer caso,
      condenação em honorários sucumbenciais (art. 791-A) sobre os pedidos improcedentes, observada
      a modulação da ADI 5.766 quanto à exigibilidade.
    condicoes_aplicacao:
      - { campo: reclamante_pede_gratuidade, operador: "==", valor: true }
      - { campo: reclamante_ultimo_salario, operador: ">", valor: 3262.0, nota: "40 % do teto do RGPS — atualizar anualmente [A CONFERIR pelo advogado-dono]" }
    provas_necessarias:
      - { tipo_documento: holerite, descricao: "Últimos holerites com salário acima do parâmetro", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: ctps_registro, descricao: "Novo emprego do reclamante (CTPS digital/CNIS), se disponível", origem: subsidio, obrigatoria: false, peso: 0.7 }
    provas_que_afastam:
      - { tipo_documento: declaracao_hipossuficiencia, descricao: "Desemprego atual comprovado e salário abaixo do parâmetro", origem: extracao, obrigatoria: false, peso: 0.9 }
    fundamentacao:
      dispositivos:
        - { ref: "CLT, art. 790, §§ 3º e 4º", tipo: dispositivo, para_que_serve: "critério objetivo (40 % do teto) e ônus de comprovar", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CLT, art. 791-A, caput e § 4º", tipo: dispositivo, para_que_serve: "honorários sucumbenciais recíprocos", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STF, ADI 5.766 (honorários do beneficiário da gratuidade: inconstitucionalidade parcial do § 4º do art. 791-A — suspensão de exigibilidade)", tipo: precedente, para_que_serve: "delimitar: condenação possível, exigibilidade suspensa", conferido: false, nota: "[A CONFERIR pelo advogado-dono — tese exata e embargos]" }
        - { ref: "TST — declaração de hipossuficiência × salário acima de 40 % do teto (Súmula 463, I e jurisprudência pós-reforma) [A CONFERIR]", tipo: sumula, para_que_serve: "saber se o TST aceita só a declaração", conferido: false, nota: "[A CONFERIR pelo advogado-dono — risco: SDI-1 tende a aceitar a declaração]" }
      argumentos_chave:
        - "Salário contratual superior ao parâmetro legal; declaração genérica não basta."
        - "Honorários sucumbenciais sobre os pedidos improcedentes, ainda que com exigibilidade suspensa."
    pedidos:
      - "Indeferimento da gratuidade; condenação em honorários sucumbenciais (art. 791-A)."
    pedidos_subsidiarios:
      - "Se deferida a gratuidade, condenação em honorários com exigibilidade suspensa (ADI 5.766)."
    risco_se_mal_aplicada: "Impugnar gratuidade de reclamante desempregado com salário mínimo irrita o juízo."
    ativa: true

  - id: T02
    nome: "Litispendência / coisa julgada / quitação por acordo anterior"
    categoria: preliminar
    ordem: 2
    pai: null
    resumo: "Há ação em curso ou já julgada com as mesmas partes, causa de pedir e pedido, ou acordo homologado com quitação geral do contrato."
    condicoes_aplicacao:
      - { campo: litispendencia_cnj, operador: existe }
    provas_necessarias:
      - { tipo_documento: certidao_processo, descricao: "Cópia da inicial, sentença ou termo de acordo do processo anterior", origem: antifraude, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: peticao_inicial, descricao: "Períodos contratuais ou pedidos realmente distintos; acordo com quitação restrita aos pedidos", origem: extracao, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, art. 337, VI e VII, e 485, V (aplicação subsidiária — CLT, art. 769)", tipo: dispositivo, para_que_serve: "litispendência e coisa julgada", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CLT, art. 831, parágrafo único", tipo: dispositivo, para_que_serve: "acordo homologado = decisão irrecorrível", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "TST, Súmula 259 e OJ 132 da SDI-2 — eficácia da quitação em acordo judicial [A CONFERIR]", tipo: sumula, para_que_serve: "quitação geral × restrita", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Tríplice identidade ou quitação geral do extinto contrato demonstradas documentalmente."
    pedidos:
      - "Extinção sem resolução do mérito (CPC, art. 485, V)."
    pedidos_subsidiarios:
      - "Reunião dos feitos por conexão."
    risco_se_mal_aplicada: "Invocar quitação de acordo com ressalva expressa de pedidos."
    ativa: true

  - id: T03
    nome: "Limitação da condenação aos valores indicados na inicial (CLT, art. 840, § 1º; IN 41/2018 TST)"
    categoria: processual
    ordem: 3
    pai: null
    resumo: >-
      Os pedidos foram liquidados na inicial; eventual condenação limita-se aos valores indicados
      por pedido, sob pena de julgamento ultra petita. Tese controvertida (TST tem decidido que os
      valores são estimativos); o advogado-dono define a posição e a redação.
    condicoes_aplicacao:
      - { campo: pedidos_liquidados, operador: "==", valor: true }
    provas_necessarias:
      - { tipo_documento: peticao_inicial, descricao: "Inicial com valores por pedido", origem: extracao, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: peticao_inicial, descricao: "Inicial com ressalva expressa de que os valores são estimativos (e orientação do TRT-8 acatando)", origem: extracao, obrigatoria: false, peso: 0.8 }
    fundamentacao:
      dispositivos:
        - { ref: "CLT, art. 840, § 1º", tipo: dispositivo, para_que_serve: "pedido certo, determinado e com indicação de valor", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CPC, arts. 141 e 492", tipo: dispositivo, para_que_serve: "congruência / vedação ao ultra petita", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "IN 41/2018 do TST, art. 12, § 2º", tipo: norma_regulatoria, para_que_serve: "valor pode ser estimado — enfrentar", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "TST, SDI-1 — valores da inicial como mera estimativa (Emb-RR A CONFERIR) × Turmas do TRT-8 [A CONFERIR]", tipo: precedente, para_que_serve: "estado atual da controvérsia", conferido: false, nota: "[A CONFERIR pelo advogado-dono — risco alto: SDI-1 firmou que os valores são estimativos; avaliar manter como subsidiária]" }
      argumentos_chave:
        - "O reclamante liquidou os pedidos sem ressalva; a condenação não pode superar o pedido."
    pedidos:
      - "Limitação de eventual condenação aos valores indicados por pedido na inicial."
    pedidos_subsidiarios:
      - "Ao menos, limitação do valor da causa para fins de custas e honorários."
    risco_se_mal_aplicada: "Apresentar como tese pacífica o que a SDI-1 já rejeitou; manter tom de subsidiariedade."
    ativa: true

  # ---------------------------------------------------------------- PREJUDICIAL
  - id: T04
    nome: "Prescrição bienal e quinquenal (CF, art. 7º, XXIX; Súmula 308 TST) e prescrição do FGTS (Súmula 362)"
    categoria: prejudicial
    ordem: 4
    pai: null
    resumo: >-
      Ação ajuizada após 2 anos da extinção do contrato (prescrição total) ou, em todo caso,
      pretensões anteriores a 5 anos do ajuizamento (prescrição parcial), inclusive reflexos;
      FGTS com prazo próprio conforme modulação do STF (ARE 709.212).
    condicoes_aplicacao:
      - { campo: data_ajuizamento, operador: existe }
      - { campo: data_admissao, operador: existe }
    provas_necessarias:
      - { tipo_documento: ficha_registro, descricao: "Ficha de registro/CTPS com admissão e rescisão", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: trct, descricao: "TRCT com data do término", origem: subsidio, obrigatoria: false, peso: 0.9 }
    provas_que_afastam:
      - { tipo_documento: certidao_processo, descricao: "Ação anterior arquivada que interrompa a prescrição (Súmula 268 TST) ou protesto", origem: antifraude, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CF, art. 7º, XXIX; CLT, art. 11", tipo: dispositivo, para_que_serve: "prazos bienal e quinquenal", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "TST, Súmula 308", tipo: sumula, para_que_serve: "marco da prescrição quinquenal", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "TST, Súmula 362 (FGTS) e STF, ARE 709.212 (modulação)", tipo: sumula, para_que_serve: "prazo do FGTS", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "TST, Súmula 268 (interrupção por ação arquivada — só pedidos idênticos)", tipo: sumula, para_que_serve: "limitar a interrupção", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "TST, Súmula 294 (prescrição total × parcial em alteração contratual)", tipo: sumula, para_que_serve: "pedidos de diferenças por alteração do pactuado", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Contrato extinto em DD/MM/AAAA; ação ajuizada após o biênio — prescrição total."
        - "Subsidiariamente, prescritas as parcelas anteriores a DD/MM/AAAA (quinquênio), inclusive reflexos."
    pedidos:
      - "Pronúncia da prescrição total (CPC, art. 487, II) ou, ao menos, parcial quinquenal."
    pedidos_subsidiarios:
      - "Prescrição do FGTS conforme modulação do STF."
    risco_se_mal_aplicada: "Alegar prescrição bienal com contrato ainda ativo ou com protesto interruptivo nos autos."
    ativa: true

  # ---------------------------------------------------------------- MÉRITO — JORNADA
  - id: T05
    nome: "Horas extras — controle de ponto válido com horários variáveis (Súmula 338 TST) e pagamento/compensação comprovados"
    categoria: merito
    ordem: 5
    pai: null
    resumo: >-
      A empresa mantém controle de jornada válido (REP/eletrônico ou manual com variação de
      horários), cujos registros gozam de presunção de veracidade; as horas extras registradas
      foram pagas (holerites) ou compensadas; a jornada da inicial é inverossímil frente aos
      registros. Ônus de desconstituir os cartões é do reclamante.
    condicoes_aplicacao:
      - { campo: controle_ponto_tipo, operador: in, valor: [eletronico_rep, manual] }
      - { campo: cartoes_ponto_periodo_completo, operador: "==", valor: true }
      - { campo: ponto_com_variacao, operador: "==", valor: true }
    provas_necessarias:
      - { tipo_documento: cartao_ponto, descricao: "Cartões/espelhos de ponto de todo o período imprescrito, com variação de horários e assinatura/aceite eletrônico", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: holerite, descricao: "Holerites com rubrica de horas extras e adicional noturno pagos", origem: subsidio, obrigatoria: true, peso: 0.9 }
      - { tipo_documento: demonstrativo_jornada, descricao: "Demonstrativo (planilha) confrontando ponto × pagamento por mês", origem: subsidio, obrigatoria: false, peso: 0.8 }
      - { tipo_documento: escala_trabalho, descricao: "Escalas/turnos aplicados (12x36, 6x1, revezamento) e norma coletiva que os autoriza", origem: subsidio, obrigatoria: false, peso: 0.7 }
    provas_que_afastam:
      - { tipo_documento: cartao_ponto, descricao: "Registros 'britânicos' (horários invariáveis) — Súmula 338, III", origem: subsidio, obrigatoria: false, peso: 1.0 }
      - { tipo_documento: cartao_ponto, descricao: "Períodos sem cartão em estabelecimento com mais de 20 empregados — Súmula 338, I", origem: subsidio, obrigatoria: false, peso: 1.0 }
      - { tipo_documento: holerite, descricao: "Horas registradas no ponto sem pagamento correspondente nem compensação", origem: subsidio, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CLT, arts. 58, 59, 59-A, 59-B, 74, § 2º", tipo: dispositivo, para_que_serve: "jornada, horas extras, 12x36, compensação e dever de registro", conferido: false, nota: "[A CONFERIR pelo advogado-dono — limite de empregados para o registro (20) e redação vigente do § 2º]" }
        - { ref: "CPC, art. 373, I; CLT, art. 818, I", tipo: dispositivo, para_que_serve: "ônus do reclamante quanto à jornada quando há controle válido", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "Portaria MTP 671/2021 (REP) [A CONFERIR]", tipo: norma_regulatoria, para_que_serve: "validade do registro eletrônico", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "TST, Súmula 338, I, II e III", tipo: sumula, para_que_serve: "presunção dos cartões; inversão se ausentes; britânicos inválidos", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "TST, Súmula 85 (compensação) e Súmula 444 (12x36)", tipo: sumula, para_que_serve: "validade da compensação e da escala", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "TST, Súmula 366 (minutos residuais) e CLT, art. 58, § 1º", tipo: sumula, para_que_serve: "tolerância de 5/10 minutos", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "TRT-8 — orientação das Turmas sobre validade de ponto eletrônico e ônus da prova [A CONFERIR]", tipo: precedente, para_que_serve: "jurisprudência regional", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Os cartões de ponto anexos, com horários variáveis, provam a jornada real e gozam de presunção relativa de veracidade."
        - "Toda hora extra registrada foi paga (holerites) ou compensada; o demonstrativo mês a mês comprova."
        - "A jornada da inicial (X h/dia, sem folgas) é inverossímil e cabe ao reclamante desconstituir os registros."
    pedidos:
      - "Improcedência do pedido de horas extras e reflexos."
    pedidos_subsidiarios:
      - "Em caso de condenação: dedução dos valores pagos sob o mesmo título (OJ 415 SDI-1 [A CONFERIR]); observância dos dias efetivamente trabalhados, do divisor correto (Súmula 431 [A CONFERIR]), da base de cálculo (Súmula 264) e do adicional convencional; reflexos sem bis in idem (OJ 394 [A CONFERIR — alteração 2023])."
    risco_se_mal_aplicada: "Afirmar ponto válido com registros britânicos anexos inverte o ônus contra a empresa e dá credibilidade à jornada da inicial."
    ativa: true

  - id: T05.1
    nome: "Banco de horas / compensação prevista em norma coletiva ou acordo individual"
    categoria: merito
    ordem: 6
    pai: T05
    resumo: >-
      As horas excedentes foram compensadas em banco de horas válido (ACT/CCT ou acordo individual
      escrito pós-reforma), com extratos periódicos e quitação do saldo na rescisão.
    condicoes_aplicacao:
      - { campo: banco_horas_previsto_norma, operador: "==", valor: true }
      - { campo: banco_horas_extratos_localizados, operador: "==", valor: true }
    provas_necessarias:
      - { tipo_documento: norma_coletiva, descricao: "ACT/CCT com cláusula de banco de horas vigente no período", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: extrato_banco_horas, descricao: "Extratos mensais de crédito/débito e quitação do saldo no TRCT", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: acordo_individual, descricao: "Acordo individual escrito de compensação (CLT, art. 59, §§ 5º e 6º)", origem: subsidio, obrigatoria: false, peso: 0.9 }
    provas_que_afastam:
      - { tipo_documento: extrato_banco_horas, descricao: "Saldo não compensado no prazo (6 meses/1 ano) nem pago na rescisão", origem: subsidio, obrigatoria: false, peso: 1.0 }
      - { tipo_documento: cartao_ponto, descricao: "Habitualidade de horas extras incompatível com compensação (Súmula 85, IV/V)", origem: subsidio, obrigatoria: false, peso: 0.9 }
    fundamentacao:
      dispositivos:
        - { ref: "CLT, art. 59, §§ 2º, 5º e 6º; art. 611-A, II", tipo: dispositivo, para_que_serve: "banco de horas e prevalência do negociado", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "TST, Súmula 85 (I a VI)", tipo: sumula, para_que_serve: "requisitos e consequências", conferido: false, nota: "[A CONFERIR pelo advogado-dono — item V: banco de horas exige norma coletiva, salvo pós-reforma]" }
        - { ref: "STF, Tema 1.046 (ARE 1.121.633) — validade de normas coletivas que limitam direitos", tipo: tema, para_que_serve: "prevalência do negociado", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Banco de horas previsto em norma coletiva válida (Tema 1.046) e operado com extratos transparentes."
    pedidos:
      - "Improcedência; reconhecimento da compensação."
    pedidos_subsidiarios:
      - "Se invalidado o banco, pagamento apenas do adicional sobre as horas compensadas (Súmula 85, III/IV)."
    risco_se_mal_aplicada: "Invocar banco de horas sem extrato é confissão de horas não pagas."
    ativa: true

  - id: T05.2
    nome: "Exceções ao controle de jornada — cargo de confiança (art. 62, II) e atividade externa (art. 62, I)"
    categoria: merito
    ordem: 7
    pai: T05
    resumo: >-
      O reclamante exercia cargo de gestão com poderes (admitir, punir, representar) e gratificação
      ≥ 40 %, ou atividade externa incompatível com fiscalização, anotada no registro; não faz jus a
      horas extras.
    condicoes_aplicacao:
      - { campo: controle_ponto_tipo, operador: "==", valor: isento_art62 }
    provas_necessarias:
      - { tipo_documento: ficha_registro, descricao: "Registro com função/anotação de exceção do art. 62 e gratificação de função", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: organograma, descricao: "Organograma mostrando subordinados e alçadas do reclamante", origem: subsidio, obrigatoria: true, peso: 0.9 }
      - { tipo_documento: procuracao_alcada, descricao: "Procurações, alçadas de aprovação, e-mails de gestão (admissão/punição)", origem: subsidio, obrigatoria: false, peso: 0.8 }
      - { tipo_documento: relatorio_rota, descricao: "Para externos: ausência de rastreamento/roteiro imposto; autonomia de horário", origem: subsidio, obrigatoria: false, peso: 0.7 }
    provas_que_afastam:
      - { tipo_documento: holerite, descricao: "Gratificação inferior a 40 % ou inexistente", origem: subsidio, obrigatoria: false, peso: 1.0 }
      - { tipo_documento: cartao_ponto, descricao: "Existência de controle de ponto do 'gestor' ou rastreamento/GPS/roteiro do externo", origem: subsidio, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CLT, art. 62, I, II e parágrafo único", tipo: dispositivo, para_que_serve: "exceções ao capítulo de jornada", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "TST — requisitos do cargo de confiança (fidúcia especial; não basta o nome 'supervisor') e do trabalho externo (incompatibilidade real) [A CONFERIR]", tipo: precedente, para_que_serve: "risco: interpretação restritiva", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Poderes de gestão efetivos, subordinados e gratificação demonstrados documentalmente."
    pedidos:
      - "Improcedência das horas extras pela exceção do art. 62."
    pedidos_subsidiarios:
      - "Se afastada a exceção, horas extras só além da 8ª/44ª com dedução da gratificação (controvertido) [A CONFERIR]."
    risco_se_mal_aplicada: "Alegar cargo de confiança de 'supervisor de call center' sem poderes reais é derrota certa e compromete a credibilidade da empresa em audiência."
    ativa: true

  - id: T06
    nome: "Intervalo intrajornada — fruição regular (pré-assinalação / registro) e regime pós-reforma (art. 71, § 4º)"
    categoria: merito
    ordem: 8
    pai: null
    resumo: >-
      O intervalo foi regularmente concedido, conforme pré-assinalação (art. 74, § 2º) ou registro;
      eventual supressão parcial pós-11/11/2017 gera apenas o pagamento do período suprimido, de
      natureza indenizatória, sem reflexos; redução autorizada por norma coletiva é válida
      (art. 611-A, III; Tema 1.046).
    condicoes_aplicacao:
      - { campo: intervalo_pre_assinalado, operador: "==", valor: true }
    provas_necessarias:
      - { tipo_documento: cartao_ponto, descricao: "Cartões com pré-assinalação ou registro do intervalo", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: norma_coletiva, descricao: "Cláusula de redução do intervalo, se aplicável", origem: subsidio, obrigatoria: false, peso: 0.9 }
      - { tipo_documento: escala_trabalho, descricao: "Escala de revezamento de refeição do setor (call center/varejo)", origem: subsidio, obrigatoria: false, peso: 0.6 }
    provas_que_afastam:
      - { tipo_documento: cartao_ponto, descricao: "Registros mostrando intervalos inferiores a 1h sem norma autorizativa, ou pré-assinalação em jornada com extras habituais", origem: subsidio, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CLT, art. 71, caput e § 4º (redação da Lei 13.467/2017); art. 74, § 2º; art. 611-A, III", tipo: dispositivo, para_que_serve: "intervalo, pré-assinalação, consequência da supressão e redução por norma coletiva", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "TST, Súmula 437 (I a IV) — aplicação só ao período anterior à reforma [A CONFERIR]", tipo: sumula, para_que_serve: "delimitação temporal dos reflexos", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "STF, Tema 1.046 — validade da redução do intervalo por norma coletiva", tipo: tema, para_que_serve: "prevalência do negociado", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "TRT-8 — orientação sobre pré-assinalação e ônus da prova do intervalo [A CONFERIR]", tipo: precedente, para_que_serve: "jurisprudência regional", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Intervalo pré-assinalado nos cartões; cabe ao reclamante provar a supressão."
        - "Período pós-reforma: só o tempo suprimido, indenizatório, sem reflexos."
    pedidos:
      - "Improcedência do pedido de intervalo intrajornada."
    pedidos_subsidiarios:
      - "Se reconhecida supressão parcial pós-reforma: pagamento apenas dos minutos suprimidos com adicional de 50 %, sem reflexos; pré-reforma: conforme Súmula 437 limitada ao período."
    risco_se_mal_aplicada: "Pré-assinalação em jornada com extras habituais e testemunhas uníssonas tende a ser afastada; avaliar acordo no pedido."
    ativa: true

  # ---------------------------------------------------------------- MÉRITO — AMBIENTE
  - id: T07
    nome: "Adicional de insalubridade — ausência de agente/neutralização por EPI (PGR/PPRA, LTCAT, fichas de EPI com CA)"
    categoria: merito
    ordem: 9
    pai: null
    resumo: >-
      Os programas de gestão de riscos e o laudo técnico do setor não apontam agente insalubre acima
      dos limites da NR-15, ou o agente é neutralizado por EPI eficaz, fornecido e substituído com
      registro em ficha assinada e CA válido; ASOs sem alterações. Laudos periciais judiciais
      anteriores no mesmo centro de custo corroboram.
    condicoes_aplicacao:
      - { campo: ltcat_localizado, operador: "==", valor: true }
      - { campo: ficha_epi_localizada, operador: "==", valor: true }
    provas_necessarias:
      - { tipo_documento: pgr_ppra, descricao: "PGR/PPRA do período, do estabelecimento e do GHE do reclamante", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: ltcat, descricao: "LTCAT / laudo de insalubridade com medições (ruído, calor, químicos, biológicos) por função", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: ficha_epi, descricao: "Fichas de entrega de EPI assinadas, com CA e periodicidade de troca", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: pcmso_aso, descricao: "PCMSO e ASOs (admissional, periódicos, demissional)", origem: subsidio, obrigatoria: false, peso: 0.7 }
      - { tipo_documento: laudo_pericial, descricao: "Laudos periciais judiciais anteriores favoráveis no mesmo centro de custo/função", origem: antifraude, obrigatoria: false, peso: 0.9 }
      - { tipo_documento: treinamento_epi, descricao: "Registros de treinamento de uso de EPI e de fiscalização", origem: subsidio, obrigatoria: false, peso: 0.6 }
    provas_que_afastam:
      - { tipo_documento: laudo_pericial, descricao: "Laudos anteriores desfavoráveis no mesmo setor/função", origem: antifraude, obrigatoria: false, peso: 1.0 }
      - { tipo_documento: ficha_epi, descricao: "Fichas sem assinatura, sem CA, ou com lacunas de meses", origem: subsidio, obrigatoria: false, peso: 1.0 }
      - { tipo_documento: ltcat, descricao: "Laudo próprio reconhece agente acima do limite sem neutralização (ex.: ruído > 85 dB; agente biológico em limpeza hospitalar — Anexo 14)", origem: subsidio, obrigatoria: false, peso: 1.0 }
      - { tipo_documento: holerite, descricao: "Adicional já pago em grau inferior ao pedido (discussão só de grau)", origem: subsidio, obrigatoria: false, peso: 0.6 }
    fundamentacao:
      dispositivos:
        - { ref: "CLT, arts. 189 a 192 e 195", tipo: dispositivo, para_que_serve: "insalubridade, graus, perícia obrigatória", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "NR-15 (anexos por agente), NR-6 (EPI/CA), NR-1 (PGR), NR-7 (PCMSO), NR-22 (mineração) [A CONFERIR]", tipo: norma_regulatoria, para_que_serve: "limites de tolerância e deveres do empregador", conferido: false, nota: "[A CONFERIR pelo advogado-dono — NR-22 para mineração; NR-17 Anexo II para call center]" }
      precedentes:
        - { ref: "TST, Súmula 80 (EPI que elimina a insalubridade exclui o adicional) e Súmula 289 (fornecimento não basta; exige uso/fiscalização)", tipo: sumula, para_que_serve: "neutralização por EPI e seus limites", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "TST, Súmula 448 (classificação oficial; limpeza de banheiros públicos/coletivos) e OJ 4 SDI-1", tipo: sumula, para_que_serve: "enquadramento — atenção em terceirizadas de limpeza", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "TST, Súmula 47 (intermitência) e Súmula 139 (integração)", tipo: sumula, para_que_serve: "subsidiárias", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "TST, Súmula 228 / Súmula Vinculante 4 STF — base de cálculo (salário mínimo)", tipo: sumula, para_que_serve: "base de cálculo subsidiária", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "O LTCAT do setor, com medições, não constata agente acima do limite; os EPIs (CA nº …) neutralizam e foram entregues/trocados conforme fichas assinadas."
        - "Laudos periciais judiciais anteriores no mesmo centro de custo concluíram pela ausência de insalubridade."
        - "Protesta-se pela perícia (art. 195) com quesitos e assistente técnico."
    pedidos:
      - "Improcedência do adicional de insalubridade."
    pedidos_subsidiarios:
      - "Se devido: grau conforme laudo, base de cálculo no salário mínimo (SV 4), limitação ao período sem EPI comprovado, dedução de valores pagos, honorários periciais pelo reclamante se sucumbente no objeto (art. 790-B)."
    risco_se_mal_aplicada: "Contestar insalubridade em limpeza hospitalar/banheiros coletivos ou mineração sem fichas de EPI completas: perícia desfavorável e custo pericial; avaliar acordo no pedido (X05)."
    ativa: true

  - id: T07.1
    nome: "Adicional de periculosidade — ausência de exposição (NR-16) ou exposição eventual/fortuita"
    categoria: merito
    ordem: 10
    pai: T07
    resumo: >-
      O reclamante não trabalhava em área de risco (inflamáveis, explosivos, energia elétrica,
      segurança patrimonial, motocicleta) ou o contato era eventual/fortuito (Súmula 364); laudo do
      setor e descrição de atividades comprovam.
    condicoes_aplicacao:
      - { campo: ltcat_localizado, operador: "==", valor: true }
    provas_necessarias:
      - { tipo_documento: ltcat, descricao: "Laudo de periculosidade do setor com delimitação de áreas de risco (NR-16/NR-20)", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: descricao_cargo, descricao: "Descrição de atividades e local de trabalho do reclamante (layout/planta)", origem: subsidio, obrigatoria: true, peso: 0.9 }
      - { tipo_documento: laudo_pericial, descricao: "Laudos anteriores no mesmo setor", origem: antifraude, obrigatoria: false, peso: 0.9 }
    provas_que_afastam:
      - { tipo_documento: ltcat, descricao: "Laudo próprio delimita área de risco que inclui o posto do reclamante", origem: subsidio, obrigatoria: false, peso: 1.0 }
      - { tipo_documento: ficha_registro, descricao: "Função de vigilante/segurança patrimonial (Lei 12.740/2012) ou uso de motocicleta registrado", origem: subsidio, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CLT, art. 193 e §§; NR-16; NR-20", tipo: dispositivo, para_que_serve: "hipóteses e áreas de risco", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "TST, Súmula 364 (I e II) — exposição eventual/fortuita e tempo reduzido", tipo: sumula, para_que_serve: "afastar adicional por contato eventual", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "TST, Súmula 361 (eletricitários — intermitente gera adicional integral) e OJ 324/385 SDI-1 [A CONFERIR]", tipo: sumula, para_que_serve: "riscos a enfrentar", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Posto de trabalho fora da área de risco delimitada no laudo; contato, se algum, eventual."
    pedidos:
      - "Improcedência do adicional de periculosidade."
    pedidos_subsidiarios:
      - "Se devido: 30 % sobre o salário básico (art. 193, § 1º), sem acréscimos; não cumulação com insalubridade (§ 2º) [A CONFERIR — controvérsia sobre cumulação]."
    risco_se_mal_aplicada: "Negar periculosidade de abastecedor/eletricista/vigilante com laudo próprio reconhecendo área de risco."
    ativa: true

  # ---------------------------------------------------------------- MÉRITO — RESCISÃO
  - id: T08
    nome: "Verbas rescisórias — TRCT, comprovante de pagamento no prazo, FGTS e multa do art. 477 indevida"
    categoria: merito
    ordem: 11
    pai: null
    resumo: >-
      As verbas rescisórias foram corretamente calculadas, pagas no prazo do art. 477, § 6º,
      e o FGTS recolhido/liberado; TRCT assinado (e homologado quando exigível). Não há diferenças
      nem multas dos arts. 467 e 477.
    condicoes_aplicacao:
      - { campo: trct_homologado_ou_assinado, operador: "==", valor: true }
      - { campo: comprovante_pagamento_rescisao, operador: "==", valor: true }
    provas_necessarias:
      - { tipo_documento: trct, descricao: "TRCT com discriminação das verbas e assinatura", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: comprovante_pagamento, descricao: "Comprovante bancário do pagamento das rescisórias com data", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: extrato_fgts, descricao: "Extrato analítico do FGTS, GRRF e chave de conectividade", origem: subsidio, obrigatoria: true, peso: 0.9 }
      - { tipo_documento: aviso_previo, descricao: "Aviso prévio (trabalhado/indenizado) e projeção", origem: subsidio, obrigatoria: false, peso: 0.7 }
    provas_que_afastam:
      - { tipo_documento: comprovante_pagamento, descricao: "Pagamento após o 10º dia (art. 477, § 6º) sem culpa do empregado", origem: subsidio, obrigatoria: false, peso: 1.0 }
      - { tipo_documento: extrato_fgts, descricao: "Competências sem recolhimento de FGTS", origem: subsidio, obrigatoria: false, peso: 1.0 }
      - { tipo_documento: trct, descricao: "Verbas calculadas sobre base inferior (sem média de extras/adicionais habituais)", origem: subsidio, obrigatoria: false, peso: 0.8 }
    fundamentacao:
      dispositivos:
        - { ref: "CLT, arts. 477, §§ 6º, 8º e 10, e 467; art. 487 (aviso prévio); Lei 12.506/2011", tipo: dispositivo, para_que_serve: "prazo, multa, verbas incontroversas, aviso proporcional", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "Lei 8.036/1990, art. 18 (FGTS e multa de 40 %)", tipo: dispositivo, para_que_serve: "regularidade do FGTS", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "TST, Súmula 330 (eficácia liberatória da quitação no TRCT — parcelas discriminadas) [A CONFERIR vigência pós-reforma]", tipo: sumula, para_que_serve: "quitação das parcelas pagas", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "TST, Súmula 462 (multa do art. 477 devida mesmo com reconhecimento judicial do vínculo) — enfrentar", tipo: sumula, para_que_serve: "risco", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Rescisórias pagas em DD/MM (comprovante), dentro do prazo legal; FGTS integralmente recolhido (extrato)."
        - "Verbas incontroversas inexistentes; multa do art. 467 indevida porque há controvérsia fundada."
    pedidos:
      - "Improcedência das diferenças rescisórias e das multas dos arts. 467 e 477."
    pedidos_subsidiarios:
      - "Dedução dos valores pagos no TRCT; multa do art. 477 limitada a um salário; FGTS apenas das competências comprovadamente faltantes."
    risco_se_mal_aplicada: "Negar multa do art. 477 com comprovante de pagamento fora do prazo anexo."
    ativa: true

  - id: T08.1
    nome: "Justa causa — gradação de penalidades, imediatidade, proporcionalidade e prova do fato (art. 482)"
    categoria: merito
    ordem: 12
    pai: T08
    resumo: >-
      A dispensa por justa causa observou tipicidade (alínea do art. 482), prova robusta do fato,
      imediatidade entre a ciência e a punição, proporcionalidade/gradação (advertências e suspensões
      anteriores, salvo falta grave única) e ausência de dupla punição.
    condicoes_aplicacao:
      - { campo: modalidade_rescisao, operador: "==", valor: justa_causa }
      - { campo: justa_causa_documentada, operador: "==", valor: true }
    provas_necessarias:
      - { tipo_documento: advertencia_suspensao, descricao: "Advertências e suspensões anteriores assinadas (ou com recusa testemunhada)", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: sindicancia, descricao: "Apuração interna do fato (relatório, imagens, depoimentos, BO se aplicável)", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: comunicacao_dispensa, descricao: "Comunicação da justa causa com a alínea e data", origem: subsidio, obrigatoria: true, peso: 0.9 }
      - { tipo_documento: regulamento_interno, descricao: "Regulamento/código de conduta com ciência do empregado", origem: subsidio, obrigatoria: false, peso: 0.7 }
    provas_que_afastam:
      - { tipo_documento: sindicancia, descricao: "Lapso superior a 30 dias [A CONFERIR] entre a ciência do fato e a dispensa sem justificativa (perdão tácito)", origem: subsidio, obrigatoria: false, peso: 1.0 }
      - { tipo_documento: advertencia_suspensao, descricao: "Mesmo fato já punido com advertência/suspensão (dupla punição)", origem: subsidio, obrigatoria: false, peso: 1.0 }
      - { tipo_documento: sindicancia, descricao: "Prova do fato exclusivamente por depoimento de preposto/gestor interessado", origem: subsidio, obrigatoria: false, peso: 0.8 }
    fundamentacao:
      dispositivos:
        - { ref: "CLT, art. 482 (alíneas) e art. 818, II", tipo: dispositivo, para_que_serve: "tipicidade e ônus do empregador", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "TST — requisitos da justa causa (imediatidade, proporcionalidade, non bis in idem, gradação) — Súmula 32 (abandono) e jurisprudência [A CONFERIR]", tipo: precedente, para_que_serve: "requisitos", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "TRT-8 — orientação sobre prova da justa causa e perdão tácito [A CONFERIR]", tipo: precedente, para_que_serve: "jurisprudência regional", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Fato grave provado por apuração documentada; punição imediata e proporcional, após gradação anterior."
    pedidos:
      - "Improcedência da reversão da justa causa e das verbas dela decorrentes."
    pedidos_subsidiarios:
      - "Se revertida: verbas da dispensa imotivada sem dano moral (a reversão em si não o gera [A CONFERIR]); dedução de valores pagos."
    risco_se_mal_aplicada: "Sustentar justa causa sem sindicância nem gradação, ou com lapso longo, converte em dispensa imotivada com multa e pode gerar dano moral."
    ativa: true

  # ---------------------------------------------------------------- MÉRITO — EQUIPARAÇÃO
  - id: T09
    nome: "Equiparação salarial — fatos impeditivos do art. 461 (tempo na função > 4 anos, tempo no empregador > 2 anos, produtividade/perfeição, quadro de carreira)"
    categoria: merito
    ordem: 13
    pai: null
    resumo: >-
      Não há identidade de funções com o paradigma no mesmo estabelecimento, ou presente fato
      impeditivo: diferença de tempo na função superior a 4 anos, ou de tempo no empregador
      superior a 2 anos, diferença de produtividade/perfeição técnica, ou quadro de carreira/plano
      de cargos (pós-reforma, sem homologação).
    condicoes_aplicacao:
      - { campo: paradigma_indicado, operador: existe }
    provas_necessarias:
      - { tipo_documento: ficha_registro, descricao: "Fichas de registro do reclamante e do paradigma (admissão, função, promoções, estabelecimento)", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: descricao_cargo, descricao: "Descrição de cargos e atribuições efetivas de cada um", origem: subsidio, obrigatoria: true, peso: 0.9 }
      - { tipo_documento: plano_cargos, descricao: "Plano de cargos e salários com promoções alternadas por merecimento e antiguidade", origem: subsidio, obrigatoria: false, peso: 0.9 }
      - { tipo_documento: avaliacao_desempenho, descricao: "Avaliações de desempenho/produtividade que diferenciem o paradigma", origem: subsidio, obrigatoria: false, peso: 0.7 }
    provas_que_afastam:
      - { tipo_documento: ficha_registro, descricao: "Mesma função, mesmo estabelecimento, diferença de tempo inferior aos limites, sem plano de cargos", origem: subsidio, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CLT, art. 461, caput e §§ 1º a 6º (redação da Lei 13.467/2017)", tipo: dispositivo, para_que_serve: "requisitos e fatos impeditivos; mesmo estabelecimento; 4 anos na função / 2 no empregador", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CLT, art. 818, II", tipo: dispositivo, para_que_serve: "ônus do empregador quanto aos fatos impeditivos", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "TST, Súmula 6 (itens vigentes pós-reforma) [A CONFERIR quais itens subsistem]", tipo: sumula, para_que_serve: "ônus da prova, equiparação em cadeia, paradigma remoto", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Paradigma com X anos a mais na função (> 4) / Y anos no empregador (> 2); funções diversas conforme descrições."
    pedidos:
      - "Improcedência da equiparação salarial e reflexos."
    pedidos_subsidiarios:
      - "Se deferida: diferenças só a partir da data em que presentes os requisitos; limitação ao período de contemporaneidade; dedução."
    risco_se_mal_aplicada: "Alegar fato impeditivo sem ficha de registro do paradigma anexa (ônus do empregador — art. 818, II)."
    ativa: true

  # ---------------------------------------------------------------- MÉRITO — DANO MORAL
  - id: T10
    nome: "Dano moral (assédio moral/sexual, revista, cobrança de metas) — ausência de prova do fato e do nexo; canal de denúncia e apuração"
    categoria: merito
    ordem: 14
    pai: null
    resumo: >-
      A narrativa de assédio é genérica, sem indicação de fatos, datas, agressor e testemunhas;
      o reclamante nunca acionou o canal de denúncia; cobrança de metas e fiscalização são exercício
      regular do poder diretivo. A prova do fato é ônus do reclamante (art. 818, I).
    condicoes_aplicacao:
      - { campo: valor_dano_moral_pedido, operador: ">", valor: 0 }
    provas_necessarias:
      - { tipo_documento: politica_compliance, descricao: "Política contra assédio, código de conduta e canal de denúncia com ciência do empregado", origem: subsidio, obrigatoria: true, peso: 0.9 }
      - { tipo_documento: registro_canal_denuncia, descricao: "Ausência de denúncia do reclamante no canal / ou apuração realizada e resultado", origem: subsidio, obrigatoria: true, peso: 0.9 }
      - { tipo_documento: organograma, descricao: "Organograma com gestores do período (para testemunhas e para verificar se o 'agressor' era superior)", origem: subsidio, obrigatoria: true, peso: 0.8 }
      - { tipo_documento: avaliacao_desempenho, descricao: "Avaliações e feedbacks sem registro de conflito", origem: subsidio, obrigatoria: false, peso: 0.5 }
    provas_que_afastam:
      - { tipo_documento: registro_canal_denuncia, descricao: "Denúncia registrada e não apurada, ou apuração que confirmou o fato", origem: subsidio, obrigatoria: false, peso: 1.0 }
      - { tipo_documento: mensagens, descricao: "Prints/áudios de mensagens ofensivas de gestor juntados pelo reclamante", origem: extracao, obrigatoria: false, peso: 1.0 }
      - { tipo_documento: atestado_medico, descricao: "Afastamento por CID F (transtornos) contemporâneo com CAT ou nexo indicado", origem: extracao, obrigatoria: false, peso: 0.8 }
    fundamentacao:
      dispositivos:
        - { ref: "CLT, arts. 223-A a 223-G (dano extrapatrimonial; tarifação — ADI 6.050) e 818, I", tipo: dispositivo, para_que_serve: "requisitos, parâmetros de fixação e ônus", conferido: false, nota: "[A CONFERIR pelo advogado-dono — ADI 6.050: tarifação como critério orientativo]" }
        - { ref: "CC, arts. 186, 927 e 944; CLT, art. 2º (poder diretivo)", tipo: dispositivo, para_que_serve: "pressupostos e exercício regular", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "Lei 14.457/2022 (CIPA — prevenção e combate ao assédio) [A CONFERIR]", tipo: dispositivo, para_que_serve: "mostrar cumprimento das medidas preventivas", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "TST — assédio moral exige conduta reiterada, prova robusta; cobrança de metas razoável não configura [A CONFERIR]", tipo: precedente, para_que_serve: "regra geral", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "TST — revista de bolsas/pertences impessoal sem contato físico não gera dano (Súmula/OJ A CONFERIR); revista íntima gera", tipo: precedente, para_que_serve: "varejo/call center", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "TRT-8 — faixa de dano moral por assédio e por atraso de salários [A CONFERIR]", tipo: precedente, para_que_serve: "quantum subsidiário", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Narrativa genérica, sem fato datado nem agressor identificado; nenhuma denúncia no canal disponível."
        - "Cobrança de metas e fiscalização impessoal integram o poder diretivo."
        - "Subsidiariamente, fixação pelos parâmetros do art. 223-G em grau leve."
    pedidos:
      - "Improcedência do pedido de dano moral."
    pedidos_subsidiarios:
      - "Fixação em grau leve (art. 223-G, § 1º, I — orientativo) proporcional; juros/correção conforme ADC 58 e Lei 14.905/2024 [A CONFERIR]."
    risco_se_mal_aplicada: "Negar assédio com denúncia interna registrada e não apurada, ou com prints anexos, agrava o quantum e expõe a empresa; sempre segunda revisão por sócio (X06)."
    ativa: true

  # ---------------------------------------------------------------- MÉRITO — TERCEIRIZAÇÃO
  - id: T11
    nome: "Responsabilidade subsidiária do tomador — licitude da terceirização, fiscalização documentada, benefício de ordem e limites (Súmula 331; Temas 725 e 246 STF)"
    categoria: merito
    ordem: 15
    pai: null
    resumo: >-
      Quando o cliente é o tomador: a terceirização é lícita (Tema 725), não há vínculo nem
      responsabilidade solidária; eventual subsidiariedade pressupõe inadimplemento da prestadora
      e, para ente público, culpa in vigilando comprovada pelo reclamante (Tema 246/1.118); o
      tomador fiscalizou (documentos), tem benefício de ordem e não responde por multas
      personalíssimas nem por período fora do contrato.
    condicoes_aplicacao:
      - { campo: cliente_e_tomador, operador: "==", valor: true }
      - { campo: contrato_prestacao_servicos_localizado, operador: "==", valor: true }
    provas_necessarias:
      - { tipo_documento: contrato_prestacao_servicos, descricao: "Contrato tomador × prestadora com vigência e objeto", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: fiscalizacao_contrato, descricao: "Comprovantes de fiscalização: retenção de notas, certidões, guias FGTS/INSS, folha, ponto, visitas", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: ficha_registro, descricao: "Registro do reclamante pela prestadora (sem subordinação direta ao tomador)", origem: subsidio, obrigatoria: true, peso: 0.9 }
    provas_que_afastam:
      - { tipo_documento: fiscalizacao_contrato, descricao: "Nenhum registro de fiscalização; prestadora inadimplente conhecida", origem: subsidio, obrigatoria: false, peso: 1.0 }
