# -----------------------------------------------------------------------------
# SINAIS DE ACORDO — modelagem financeira por pedido
# -----------------------------------------------------------------------------
sinais_acordo:
  politica: >-
    O acordo trabalhista é modelado POR PEDIDO: para cada pedido, M5/M11 calculam (a) pior cenário
    (procedência total com reflexos, limitada à inicial), (b) valor provável (pior cenário ×
    probabilidade de êxito do reclamante, estimada pela taxa histórica da tese × vara × laudos do
    centro de custo) e (c) ideal de acordo (provável × fator de antecipação, descontados custo de
    perícia, honorários e tempo). Defender os pedidos com prova documental forte (ponto válido,
    EPI completo, TRCT no prazo) e acordar cedo (na audiência inicial, quando o cliente autorizar)
    os pedidos expostos. A plataforma apresenta a tabela; a decisão é do advogado/cliente.
    Fatores e faixas abaixo são ilustrativos [A CONFERIR pelo advogado-dono].
  quando_acordar:
    - condicoes:
        - { campo: indicio_passivo_real, operador: "==", valor: true }
      racional: "Passivo documentalmente provável; acordo antes da instrução evita juros, honorários e perícia."
    - condicoes:
        - { campo: controle_ponto_tipo, operador: in, valor: [inexistente, britanico] }
      racional: "Jornada da inicial presumida (Súmula 338); horas extras são o pedido de maior valor."
    - condicoes:
        - { campo: laudo_anterior_mesmo_setor, operador: "==", valor: desfavoravel }
      racional: "Perícia tende a repetir; acordo no pedido evita adicional + honorários periciais."
    - condicoes:
        - { campo: rescisao_paga_no_prazo, operador: "==", valor: false }
      racional: "Multa do art. 477 e diferenças incontroversas (art. 467) — pagar o incontroverso em audiência."
    - condicoes:
        - { campo: valor_ideal_acordo, operador: ">", valor: 0 }
        - { campo: rito, operador: "==", valor: sumarissimo }
      racional: "Rito sumaríssimo: instrução em audiência una; custo de defesa alto frente ao valor; acordar no ideal."
  quando_nao_acordar:
    - condicoes:
        - { campo: controle_ponto_tipo, operador: "==", valor: eletronico_rep }
        - { campo: ponto_com_variacao, operador: "==", valor: true }
        - { campo: horas_extras_pagas_holerite, operador: "==", valor: true }
      racional: "Jornada documentalmente provada e paga; acordo alimenta ações em série no mesmo centro de custo."
    - condicoes:
        - { campo: laudo_anterior_mesmo_setor, operador: "==", valor: favoravel }
        - { campo: ficha_epi_localizada, operador: "==", valor: true }
      racional: "Perícia tende a repetir resultado favorável; honorários periciais do reclamante (art. 790-B)."
    - condicoes:
        - { campo: acoes_mesmo_reclamante_grupo_n, operador: ">=", valor: 2 }
      racional: "Reclamante serial contra o grupo; política de não acordar salvo decisão do cliente."
    - condicoes:
        - { campo: testemunha_reciproca, operador: "==", valor: true }
      racional: "Troca de favores detectada: instruir e contraditar antes de negociar."
  faixas_valor:
    - grupo_comarcas: "Belém e Região Metropolitana (Varas do Trabalho de Belém, Ananindeua, Castanhal)"
      comarcas: ["Belém", "Ananindeua", "Castanhal"]
      valor_min: 3000.0
      valor_max: 25000.0
      moeda: BRL
      base: "ILUSTRATIVO [A CONFERIR pelo advogado-dono] — substituir por valor_ideal_acordo calculado por pedido; faixa serve só de sanity check (acordos típicos de reclamatória de terceirizada/call center/varejo)"
      calibrar: true
    - grupo_comarcas: "Sudeste do Pará — mineração e cadeia (Marabá, Parauapebas, Canaã dos Carajás, Tucuruí)"
      comarcas: ["Marabá", "Parauapebas", "Canaã dos Carajás", "Tucuruí"]
      valor_min: 8000.0
      valor_max: 60000.0
      moeda: BRL
      base: "ILUSTRATIVO [A CONFERIR pelo advogado-dono] — salários e adicionais maiores (mineração/serviços industriais); condenações mais altas em insalubridade/periculosidade"
      calibrar: true
    - grupo_comarcas: "Oeste do Pará e Amapá (Santarém, Altamira, Itaituba, Macapá, Santana)"
      comarcas: ["Santarém", "Altamira", "Itaituba", "Macapá", "Santana"]
      valor_min: 4000.0
      valor_max: 35000.0
      moeda: BRL
      base: "ILUSTRATIVO [A CONFERIR pelo advogado-dono]"
      calibrar: true
    - grupo_comarcas: "Demais Varas do TRT-8"
      comarcas: ["*"]
      valor_min: 3000.0
      valor_max: 30000.0
      moeda: BRL
      base: "ILUSTRATIVO [A CONFERIR pelo advogado-dono]"
      calibrar: true
  alcadas:
    - { ate_valor: 10000.0, aprovador: "advogado trabalhista responsável pela carteira [A CONFERIR]" }
    - { ate_valor: 50000.0, aprovador: "sócio FBS + RH/jurídico do cliente [A CONFERIR]" }
    - { ate_valor: 9999999.0, aprovador: "comitê do cliente [A CONFERIR]" }
  decisao_final: "A decisão de acordar, e o valor por pedido, é do advogado/cliente; a plataforma apresenta pior/provável/ideal e registra a decisão."

