# =============================================================================
# Águia Peregrina — M0 Playbook — Reclamatória trabalhista típica (defesa do empregador) — TRT-8 (PA/AP)
# =============================================================================
# PRIMEIRO RASCUNHO. Nenhuma citação legal, número, prazo ou valor aqui foi
# conferido por advogado. Todo item marcado "[A CONFERIR pelo advogado-dono]"
# e `conferido: false` precisa ser validado (texto vigente da CLT pós-Reforma,
# Súmulas/OJs do TST, IN 41/2018 do TST, ADI 5.766, ADC 58/59, Lei 14.905/2024,
# jurisprudência atual do TRT-8 e das CCTs/ACTs vigentes) antes de o status virar
# `aprovado`. O validador recusa `status: aprovado` enquanto houver pendência.
#
# Diferença estrutural desta tipologia: a defesa é POR PEDIDO (cada pedido da
# inicial tem sua tese), há AUDIÊNCIA (briefing e scoring) e o ACORDO é
# modelado financeiramente por pedido (pior cenário / provável / ideal).
#
# Fonte da verdade: este YAML. A versão em prosa
# (trabalhista-reclamatoria-trt8.playbook.md) é derivada.
# =============================================================================

schema_version: "1.0"

metadata:
  id: trabalhista-reclamatoria-trt8
  nome: "Reclamatória trabalhista típica — defesa do empregador (terceirizadas, mineração/serviços, call center, varejo) — TRT-8 (PA/AP)"
  tipologia: trabalhista_reclamatoria_tipica
  tribunal: TRT8
  reu_tipo: empresa_empregadora
  lado: defesa
  tipo_peca_padrao: contestacao
  versao: 1
  supera_versao: null
  autor_nome: "Gustavo Fonseca — OAB/PA 12.724 — revisão própria até nomear advogado-dono da tipologia (advogado trabalhista)"
  autor_oab: "PA 12724"
  criado_em: 2026-10-19T12:00:00-03:00
  status: rascunho
  aprovado_por_nome: null
  aprovado_por_oab: null
  aprovado_em: null
  descricao: >-
    Reclamatórias trabalhistas individuais típicas contra empregador (foco: empresas terceirizadas
    de serviços, mineração e prestadoras da cadeia mineral, call centers, varejo no PA/AP — TRT-8)
    com os pedidos recorrentes: horas extras e reflexos, intervalo intrajornada, adicional de
    insalubridade/periculosidade, verbas rescisórias, equiparação salarial, dano moral (assédio),
    reversão de justa causa, responsabilidade subsidiária do tomador, além de prescrição, limitação
    aos valores da inicial, justiça gratuita/honorários e juros/correção. Defesa do empregador
    (ou do tomador, quando o cliente for o tomador).
  observacoes: >-
    Rascunho gerado para validação por advogado trabalhista. Antes de aprovar: (1) conferir cada
    súmula/OJ do TST, artigos da CLT pós-Lei 13.467/2017, IN 41/2018, ADI 5.766, ADC 58/59 e Lei
    14.905/2024; (2) conferir orientação das Turmas do TRT-8 sobre limitação aos valores da inicial,
    intervalo intrajornada pós-reforma, equiparação e critérios de dano moral; (3) calibrar
    modelagem de acordo (pior/provável/ideal) com a carteira do cliente por pedido e por vara;
    (4) confirmar com o RH/DP do cliente quais subsídios (ponto, holerites, TRCT, PGR/LTCAT, fichas
    de EPI, CCT, organograma) ele entrega em até 5 dias úteis; (5) definir o valor X acima do qual
    o sócio revisa.

