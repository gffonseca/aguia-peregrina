  regra_citacao: "Toda afirmação de fato cita document_page_id (draft_citations). Sem página, sem afirmação. Jornada, pagamento e EPI só com cartão/holerite/ficha anexos e identificados por mês."
  secoes:
    - { ordem: 1, id: enderecamento, titulo: "Endereçamento, qualificação e tempestividade", obrigatoria: true, teses_vinculadas: [], instrucoes: "Vara do Trabalho, número CNJ, partes, preposto; protocolo até a audiência (CLT, art. 847) ou prazo do PJe.", exige_citacao_de_pagina: false }
    - { ordem: 2, id: sintese, titulo: "Síntese da reclamatória", obrigatoria: true, teses_vinculadas: [], instrucoes: "Resumir em até 10 linhas: contrato (admissão, função, salário, rescisão), pedidos e valores por pedido.", exige_citacao_de_pagina: true }
    - { ordem: 3, id: preliminares, titulo: "Preliminares e questões processuais", obrigatoria: false, teses_vinculadas: [T01, T02, T03], instrucoes: "Gratuidade/honorários; litispendência/coisa julgada/quitação; limitação aos valores da inicial. Omitir as não aplicáveis.", exige_citacao_de_pagina: true }
    - { ordem: 4, id: prejudicial, titulo: "Prejudicial de mérito — prescrição", obrigatoria: false, teses_vinculadas: [T04], instrucoes: "Bienal total se cabível; quinquenal com a data exata; FGTS.", exige_citacao_de_pagina: true }
    - { ordem: 5, id: fatos, titulo: "Do contrato de trabalho — fatos", obrigatoria: true, teses_vinculadas: [], instrucoes: "Linha do tempo: admissão, função/setor/centro de custo, jornada e escala, salário e adicionais pagos, EPIs, afastamentos, punições, rescisão (modalidade, TRCT, pagamento, FGTS). Cada evento com página.", exige_citacao_de_pagina: true }
    - { ordem: 6, id: merito_jornada, titulo: "Do mérito — jornada (horas extras, banco de horas, art. 62, intervalo)", obrigatoria: false, teses_vinculadas: [T05, T05.1, T05.2, T06], instrucoes: "Só se houver pedido de jornada. Descrever o controle de ponto com meses de exemplo (variação), confrontar com holerites (demonstrativo), impugnar especificamente a jornada da inicial. Subsidiárias de liquidação ao final.", exige_citacao_de_pagina: true }
    - { ordem: 7, id: merito_ambiente, titulo: "Do mérito — adicionais de insalubridade e periculosidade", obrigatoria: false, teses_vinculadas: [T07, T07.1], instrucoes: "Só se houver pedido. PGR/LTCAT com medições, EPIs (CA, fichas), ASOs, laudos anteriores do setor; protesto por perícia com quesitos e assistente técnico.", exige_citacao_de_pagina: true }
    - { ordem: 8, id: merito_rescisao, titulo: "Do mérito — rescisão (verbas, multas, justa causa)", obrigatoria: false, teses_vinculadas: [T08, T08.1], instrucoes: "TRCT, comprovante com data, FGTS; justa causa: fato, prova, gradação, imediatidade.", exige_citacao_de_pagina: true }
    - { ordem: 9, id: merito_equiparacao, titulo: "Do mérito — equiparação salarial", obrigatoria: false, teses_vinculadas: [T09], instrucoes: "Só se houver paradigma. Fatos impeditivos com fichas de registro de ambos.", exige_citacao_de_pagina: true }
    - { ordem: 10, id: merito_dano_moral, titulo: "Do mérito — dano moral", obrigatoria: false, teses_vinculadas: [T10], instrucoes: "Só se houver pedido. Impugnar fato a fato; canal de denúncia; poder diretivo; tom respeitoso; subsidiária pelo art. 223-G.", exige_citacao_de_pagina: true }
    - { ordem: 11, id: merito_terceirizacao, titulo: "Do mérito — responsabilidade do tomador", obrigatoria: false, teses_vinculadas: [T11], instrucoes: "Só se cliente_e_tomador. Licitude, fiscalização documentada, limites e benefício de ordem.", exige_citacao_de_pagina: true }
    - { ordem: 12, id: liquidacao, titulo: "Parâmetros de liquidação — dedução, juros, correção, descontos", obrigatoria: true, teses_vinculadas: [T12], instrucoes: "ADC 58/59 + Lei 14.905/2024 [A CONFERIR]; OJ 415; Súmula 368; art. 790-B.", exige_citacao_de_pagina: true }
    - { ordem: 13, id: providencias, titulo: "Providências processuais", obrigatoria: false, teses_vinculadas: [T13], instrucoes: "Só com flags confirmados por human_decide. Contradita fica para a audiência (não antecipar na peça); aqui só depoimento pessoal e exibição. Linguagem neutra.", exige_citacao_de_pagina: true }
    - { ordem: 14, id: provas, titulo: "Das provas", obrigatoria: true, teses_vinculadas: [], instrucoes: "Depoimento pessoal do reclamante, testemunhal (até 3 no ordinário / 2 no sumaríssimo), perícia técnica com quesitos e assistente, documental suplementar, ofícios (CNIS/CTPS digital).", exige_citacao_de_pagina: false }
    - { ordem: 15, id: pedidos, titulo: "Dos pedidos", obrigatoria: true, teses_vinculadas: [], instrucoes: "Consolidar por pedido da inicial na mesma ordem: preliminares → prescrição → improcedência pedido a pedido → subsidiárias de liquidação → honorários → provas.", exige_citacao_de_pagina: false }
    - { ordem: 16, id: anexos, titulo: "Rol de documentos", obrigatoria: true, teses_vinculadas: [], instrucoes: "Listar cada anexo com o tipo do playbook (ficha_registro, cartao_ponto, holerite, trct, pgr_ppra, ltcat, ficha_epi, norma_coletiva, organograma…).", exige_citacao_de_pagina: false }
    - { ordem: 17, id: briefing_audiencia, titulo: "ANEXO INTERNO — Briefing de audiência (não protocolar)", obrigatoria: true, teses_vinculadas: [T05, T06, T07, T08.1, T09, T10, T13], instrucoes: "Documento interno para preposto e advogado: (1) perguntas ao reclamante por pedido (jornada real, intervalo, EPI, fato do assédio com data/pessoa, paradigma); (2) perguntas às testemunhas do reclamante e pontos de contradita (só com flag confirmado); (3) testemunhas da empresa sugeridas a partir do organograma (gestor direto, colega do mesmo turno, técnico de segurança) com o que cada uma prova; (4) preposto: fatos que deve conhecer (CLT, art. 843, § 1º); (5) tabela de acordo por pedido: pior / provável / ideal e alçada; (6) campos de scoring pós-audiência: qualidade do depoimento do reclamante (1–5), das testemunhas (1–5), postura do juízo, probabilidade revisada por pedido, nova faixa de acordo.", exige_citacao_de_pagina: true }
    - { ordem: 18, id: modelagem_acordo, titulo: "ANEXO INTERNO — Modelagem financeira do acordo por pedido (não protocolar)", obrigatoria: true, teses_vinculadas: [T12], instrucoes: "Tabela: pedido × valor da inicial × pior cenário (com reflexos, INSS/IR, honorários 5–15 %, perícia) × probabilidade (taxa histórica tese × vara × laudo do setor) × provável × ideal (fator de antecipação [A CONFERIR], ex.: 0,6–0,8 do provável). Total e recomendação (defender × acordar) por pedido. Natureza das parcelas no acordo (indenizatória × salarial) para INSS/IR.", exige_citacao_de_pagina: true }
  estilo:
    - "Português formal; frases curtas; sem adjetivação do reclamante, das testemunhas ou do advogado adverso."
    - "Impugnação específica pedido a pedido (CLT, art. 841; CPC, art. 341): nunca negativa geral."
    - "Nenhuma afirmação de fato sem página dos autos ou documento anexo identificado por mês/competência."
    - "Referências legais, súmulas e OJs só as conferidas no playbook; indicar redação pós-Reforma quando houver diferença temporal."
    - "Anexos internos (briefing e modelagem) nunca são protocolados; M6 os gera em arquivo separado."

# -----------------------------------------------------------------------------
# CRITÉRIOS DE REVISÃO (M7)
# -----------------------------------------------------------------------------
criterios_revisao:
  tempo_minimo_segundos: 1500
  papel_minimo_revisor: lawyer
  exige_segunda_revisao_se:
    - { campo: valor_causa, operador: ">", valor: 100000.0, nota: "[A CONFERIR pelo advogado-dono] valor X do cliente" }
    - { campo: dano_moral_fundamento, operador: in, valor: [assedio_moral, assedio_sexual] }
    - { campo: indicio_passivo_real, operador: "==", valor: true }
    - { campo: modalidade_rescisao, operador: "==", valor: justa_causa }
    - { campo: tomador_ente_publico, operador: "==", valor: true }
  checklist:
    - { id: R01, item: "Cada fato da peça tem citação de página dos autos ou documento anexo identificado (mês/competência)", bloqueante: true }
    - { id: R02, item: "Todas as súmulas, OJs, artigos e temas citados estão conferidos no playbook; redação pós-Reforma indicada quando relevante (nenhum placeholder sobrou)", bloqueante: true }
    - { id: R03, item: "Impugnação específica de cada pedido da inicial; nenhum pedido ficou sem resposta (revelia parcial/confissão ficta)", bloqueante: true }
    - { id: R04, item: "T05 só foi usada com cartões de ponto do período completo, com variação, e holerites/demonstrativo anexos", bloqueante: true }
    - { id: R05, item: "T07/T07.1 só com PGR/LTCAT + fichas de EPI com CA anexos; laudos anteriores do setor verificados", bloqueante: true }
    - { id: R06, item: "T08 só com TRCT + comprovante de pagamento datado + extrato FGTS; T08.1 só com advertências/sindicância anexas", bloqueante: true }
    - { id: R07, item: "T11 só com contrato de prestação + documentos de fiscalização; limites da subsidiariedade pedidos", bloqueante: true }
    - { id: R08, item: "Nenhuma expressão imputa fraude/má-fé ao reclamante, testemunha ou advogado sem flag confirmado por human_decide; contradita não antecipada na peça", bloqueante: true }
    - { id: R09, item: "Parâmetros de liquidação presentes e atualizados (ADC 58/59, Lei 14.905/2024, OJ 415, Súmula 368, art. 790-B)", bloqueante: true }
    - { id: R10, item: "Briefing de audiência preenchido: preposto definido, testemunhas do organograma, perguntas por pedido, tabela de acordo com alçada", bloqueante: true }
    - { id: R11, item: "Modelagem de acordo (pior/provável/ideal por pedido) revisada e decisão defender × acordar registrada por pedido", bloqueante: true }
    - { id: R12, item: "Dano moral por assédio: sócio revisou tom, exposição reputacional e canal de denúncia", bloqueante: true }
    - { id: R13, item: "Anexos internos separados da peça a protocolar", bloqueante: true }
    - { id: R14, item: "Tom respeitoso; sem minimizar relato de assédio ou condições de trabalho em mineração/limpeza", bloqueante: false }
  motivos_recusa_padrao:
    - "Fato sem prova citável"
    - "Pedido da inicial sem impugnação específica"
    - "Tese aplicada sem prova necessária (jornada sem ponto; insalubridade sem EPI/laudo; justa causa sem gradação)"
    - "Referência legal/súmula/OJ não conferida, superada ou com redação pré-Reforma aplicada a período posterior"
    - "Parâmetros de liquidação ausentes ou desatualizados"
    - "Linguagem imputa fraude/má-fé sem decisão humana"
    - "Briefing de audiência ou modelagem de acordo ausentes/incompletos"
    - "Caso deveria ir para acordo/escalada em pedidos específicos, não para defesa integral"

# -----------------------------------------------------------------------------
# MÉTRICAS (M10/M11)
# -----------------------------------------------------------------------------
metricas:
  - { id: M01, nome: "Tempo médio de revisão por contestação", definicao: "média de reviews.review_seconds para drafts desta tipologia", meta: "< 45 min com qualidade [A CONFERIR]", fonte: reviews }
  - { id: M02, nome: "Aprovação sem alteração substancial", definicao: "% de reviews aprovadas com substantial_change = false", meta: "> 50 % após 200 casos [A CONFERIR]", fonte: reviews }
  - { id: M03, nome: "Subsídios faltantes detectados antes da defesa", definicao: "% de casos com exceção X01/X02 aberta antes de gerar minuta", meta: "> 90 %", fonte: "dossiers + excecoes" }
  - { id: M04, nome: "Taxa de êxito por pedido × tese × vara", definicao: "outcomes.result por pedido (improcedente/parcial/procedente) por thesis_version_id e vara vs. baseline; alimenta a probabilidade da modelagem", meta: "≥ baseline + 10 p.p. [A CONFERIR]", fonte: outcomes }
  - { id: M05, nome: "Condenação média por pedido e vara", definicao: "média de outcomes.award_value por pedido × vara; alimenta pior cenário e faixas", meta: "queda de 20 % vs. baseline [A CONFERIR]", fonte: outcomes }
  - { id: M06, nome: "Custo de tokens por processo", definicao: "soma de llm_calls.cost_usd por case_id (contestação + briefing + modelagem)", meta: "< US$ 4 por processo [A CONFERIR]", fonte: llm_calls }
  - { id: M07, nome: "Concordância modelo × revisor sênior", definicao: "gt_tasks.agreement_score médio (amostra semanal)", meta: "> 0,85", fonte: gt_tasks }
  - { id: M08, nome: "Flags antifraude confirmados por humano", definicao: "% de fraud_checks com result = flag e human_decision = confirmed, por código", meta: "monitorar precisão; recalibrar se < 50 %", fonte: fraud_checks }
  - { id: M09, nome: "Acordos: valor realizado × ideal modelado", definicao: "razão entre outcomes.award_value em acordos e valor_ideal_acordo; e % de acordos fechados na audiência inicial", meta: "razão entre 0,8 e 1,2; > 40 % na inicial [A CONFERIR]", fonte: outcomes }
  - { id: M10, nome: "Calibração da probabilidade por pedido", definicao: "Brier score entre probabilidade modelada por pedido e resultado real", meta: "< 0,20 após 300 pedidos [A CONFERIR]", fonte: outcomes }
  - { id: M11, nome: "Scoring pós-audiência × resultado", definicao: "correlação entre probabilidade revisada no scoring pós-audiência e outcomes.result", meta: "monitorar; ajustar perguntas do briefing", fonte: "reviews + outcomes" }
  - { id: M12, nome: "Perícias: resultado × laudo histórico do centro de custo", definicao: "% de perícias cujo resultado coincide com o histórico do setor (laudo_centro_custo_historico)", meta: "> 75 %; alimenta X05 e modelagem", fonte: outcomes }
