  # ---------------------------------------------------------------- SUBSIDIÁRIAS
  - id: T12
    nome: "Parâmetros de liquidação — dedução/compensação, juros e correção (ADC 58/59 e Lei 14.905/2024), descontos fiscais e previdenciários"
    categoria: subsidiaria
    ordem: 16
    pai: null
    resumo: >-
      Em caso de condenação: dedução de valores pagos sob os mesmos títulos; correção pelo IPCA-E na
      fase pré-judicial e, a partir da citação, taxa SELIC (ADC 58/59), com a alteração da Lei
      14.905/2024 a partir de sua vigência [A CONFERIR]; retenção de IR e INSS (Súmula 368;
      OJ 400); honorários periciais pelo sucumbente no objeto (art. 790-B).
    condicoes_aplicacao:
