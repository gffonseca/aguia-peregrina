      implementada_em_m4: false
      calibrar: false
    - codigo: laudo_generico_repetido
      descricao: "Laudo/orçamento de assistência técnica com texto quase idêntico (embedding) ao de outras ações, sem individualização do equipamento (série, modelo)"
      parametros: { similaridade_min: 0.95 }
      severidade: medium
      evidencia_esperada: "score de similaridade e CNJs semelhantes"
      implementada_em_m4: false
      calibrar: true
    - codigo: equipamento_incompativel_uc
      descricao: "Equipamentos alegados incompatíveis com a classe/carga da UC (ex.: vários ar-condicionados em UC baixa renda com consumo de 50 kWh)"
      parametros: {}
      severidade: low
      evidencia_esperada: "lista de equipamentos × histórico de consumo da UC"
      implementada_em_m4: false
      calibrar: true
    - codigo: concentracao_advogado_mes
      descricao: "Mesmo advogado com mais de N ações contra o cliente no mês, por comarca"
      parametros: { n_min: 30, janela_dias: 30, nota: "[A CONFERIR pelo advogado-dono] calibrar N por comarca (Santarém/Marabá/Castanhal)" }
      severidade: low
      evidencia_esperada: "lista de CNJs do mesmo advogado na janela, por comarca"
      implementada_em_m4: false
      calibrar: true
    - codigo: concentracao_autor
      descricao: "Mesmo autor com 3+ ações na carteira do cliente"
      parametros: { n_min: 3 }
      severidade: medium
      evidencia_esperada: "lista de CNJs do mesmo autor"
      implementada_em_m4: true
      calibrar: true
    - codigo: autor_falecido
      descricao: "Indício de óbito do autor anterior à procuração/ajuizamento"
      parametros: { fontes: ["subsidio_cliente", "publicacoes", "fonte_publica_a_definir"] }
      severidade: high
      evidencia_esperada: "fonte, data do óbito e data da procuração"
      implementada_em_m4: false
      calibrar: false
    - codigo: litispendencia
      descricao: "Processo duplicado (mesmas partes/evento/fatura) em curso"
