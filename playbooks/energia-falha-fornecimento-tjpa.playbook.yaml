    - codigo: gratuidade_x_renda
      descricao: "Pedido de gratuidade com renda declarada ou classe de UC incompatível"
      parametros: { limite_salarios_minimos: 5, nota: "[A CONFERIR pelo advogado-dono] parâmetro do TJPA" }
      severidade: medium
      evidencia_esperada: "renda extraída, classe da UC e fonte"
      implementada_em_m4: true
      calibrar: true
    - codigo: peticao_padronizada
      descricao: "Inicial com alta similaridade com outras do mesmo advogado, sem individualizar data do evento/UC/equipamento"
      parametros: { similaridade_min: 0.95 }
      severidade: low
      evidencia_esperada: "score de similaridade e CNJs semelhantes"
      implementada_em_m4: false
