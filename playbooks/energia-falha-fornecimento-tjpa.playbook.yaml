      implementada_em_m4: false
      calibrar: false
    - codigo: indicio_falha_real_distribuidora
      descricao: "Checagem a favor do autor: interrupção longa sem causa externa, OS fora do prazo, TOI sem perícia, negativação de débito pago — sinaliza que defender é temerário"
      parametros: {}
      severidade: high
      evidencia_esperada: "registros do próprio cliente (OS, histórico, faturas)"
      implementada_em_m4: false
      calibrar: false

# -----------------------------------------------------------------------------
# MODELO DE PEÇA (M6)
# -----------------------------------------------------------------------------
modelo_peca:
  tipo: contestacao
  formato_saida: markdown
  regra_citacao: "Toda afirmação de fato cita document_page_id (draft_citations). Sem página, sem afirmação. Dado meteorológico/ONS só entra com o documento-fonte anexo."
  secoes:
    - { ordem: 1, id: enderecamento, titulo: "Endereçamento, qualificação e tempestividade", obrigatoria: true, teses_vinculadas: [], instrucoes: "Juízo, vara/juizado, número CNJ, partes; data da citação e tempestividade.", exige_citacao_de_pagina: false }
    - { ordem: 2, id: sintese, titulo: "Síntese da demanda", obrigatoria: true, teses_vinculadas: [], instrucoes: "Resumir pedidos e causa de pedir em até 8 linhas; identificar o subtipo (interrupção / equipamento / TOI / corte / negativação).", exige_citacao_de_pagina: true }
    - { ordem: 3, id: preliminares, titulo: "Preliminares", obrigatoria: false, teses_vinculadas: [T01, T02, T03, T03.1, T04], instrucoes: "Uma subseção por tese aplicável, na ordem do playbook. Omitir se nenhuma se aplicar.", exige_citacao_de_pagina: true }
    - { ordem: 4, id: prejudicial, titulo: "Prejudicial de mérito — prescrição", obrigatoria: false, teses_vinculadas: [T05], instrucoes: "Só se o prazo definido pelo advogado-dono tiver transcorrido; parcial como subsidiária.", exige_citacao_de_pagina: true }
    - { ordem: 5, id: fatos, titulo: "Dos fatos — a unidade consumidora e o evento", obrigatoria: true, teses_vinculadas: [], instrucoes: "Linha do tempo do dossiê: UC/titular/classe, histórico de interrupções, evento (data/hora/causa), OS, compensações, reclamações/PID, vistoria, TOI, faturas, corte/negativação, ajuizamento. Cada evento com página.", exige_citacao_de_pagina: true }
    - { ordem: 6, id: merito_interrupcao, titulo: "Do mérito — regularidade do serviço e causa da interrupção", obrigatoria: false, teses_vinculadas: [T06, T09, T08], instrucoes: "Só para subtipos interrupcao/oscilacao/misto. Descrever a causa com o registro do sistema e o dado externo (INMET/METAR/ONS) anexos; demonstrar restabelecimento no prazo e compensação paga.", exige_citacao_de_pagina: true }
    - { ordem: 7, id: merito_equipamento, titulo: "Do mérito — inexistência de nexo com o dano ao equipamento", obrigatoria: false, teses_vinculadas: [T07], instrucoes: "Só se autor_alega_dano_equipamento. Histórico do alimentador na data, PID (ou ausência e prazo de 90 dias [A CONFERIR]), laudo de vistoria, instalação interna.", exige_citacao_de_pagina: true }
    - { ordem: 8, id: merito_toi, titulo: "Do mérito — regularidade do TOI e da recuperação de consumo", obrigatoria: false, teses_vinculadas: [T10, T10.1], instrucoes: "Só para subtipos TOI/misto. Descrever inspeção, TOI, perícia com notificação, critério de cálculo, histórico de consumo com degrau, contraditório. Enfrentar Tema 699 [A CONFERIR] quando houver corte.", exige_citacao_de_pagina: true }
    - { ordem: 9, id: dano_moral, titulo: "Da inexistência de dano moral", obrigatoria: true, teses_vinculadas: [T11, T11.1], instrucoes: "Duração/consequências concretas; compensação regulatória; negativação legítima/Súmula 385 quando aplicável; tom respeitoso; quantum subsidiário com faixa do TJPA.", exige_citacao_de_pagina: true }
    - { ordem: 10, id: subsidiarios, titulo: "Pedidos subsidiários — limites do ressarcimento, repetição simples, compensação", obrigatoria: true, teses_vinculadas: [T12], instrucoes: "Menor valor de reparo; repetição simples; compensação com débitos e DIC/FIC; termo inicial de juros/correção.", exige_citacao_de_pagina: true }
    - { ordem: 11, id: providencias, titulo: "Providências processuais", obrigatoria: false, teses_vinculadas: [T13], instrucoes: "Só com flags confirmados por human_decide. Linguagem neutra; sem imputar fraude a pessoa.", exige_citacao_de_pagina: true }
    - { ordem: 12, id: provas, titulo: "Das provas", obrigatoria: true, teses_vinculadas: [], instrucoes: "Protestar por depoimento pessoal, perícia técnica (medidor/instalação), inspeção judicial, ofício ao INMET/ONS/ANEEL se necessário; especificar.", exige_citacao_de_pagina: false }
    - { ordem: 13, id: pedidos, titulo: "Dos pedidos", obrigatoria: true, teses_vinculadas: [], instrucoes: "Consolidar na ordem: preliminares, prejudicial, improcedência por subtipo, subsidiários, sucumbência, intimações; revogação de liminar se o caso.", exige_citacao_de_pagina: false }
    - { ordem: 14, id: anexos, titulo: "Rol de documentos", obrigatoria: true, teses_vinculadas: [], instrucoes: "Listar cada anexo com o tipo do playbook (registro_interrupcao, boletim_meteorologico, toi, laudo_medidor, fatura_energia…).", exige_citacao_de_pagina: false }
  estilo:
    - "Português formal; frases curtas; sem adjetivação do autor ou do advogado adverso."
    - "Nenhuma afirmação de fato sem página dos autos ou documento anexo identificado; 'chuva forte' só com boletim INMET/METAR anexo."
    - "Referências legais e artigos da Res. ANEEL 1.000/2021 só os conferidos no playbook."
    - "Tom respeitoso com consumidor de tarifa social, comunidades ribeirinhas e pessoas com dependência de equipamento elétrico."

# -----------------------------------------------------------------------------
# CRITÉRIOS DE REVISÃO (M7)
# -----------------------------------------------------------------------------
criterios_revisao:
  tempo_minimo_segundos: 900
  papel_minimo_revisor: lawyer
  exige_segunda_revisao_se:
    - { campo: valor_causa, operador: ">", valor: 50000.0, nota: "[A CONFERIR pelo advogado-dono]" }
    - { campo: autor_falecido, operador: "==", valor: true }
    - { campo: indicio_falha_real_distribuidora, operador: "==", valor: true }
    - { campo: interrupcao_duracao_horas, operador: ">", valor: 24, nota: "[A CONFERIR pelo advogado-dono]" }
  checklist:
    - { id: R01, item: "Cada fato da peça tem citação de página dos autos ou documento anexo identificado", bloqueante: true }
    - { id: R02, item: "Todas as referências legais e artigos da Res. ANEEL 1.000/2021 citados estão conferidos no playbook (nenhum placeholder sobrou)", bloqueante: true }
    - { id: R03, item: "T06 (fortuito) só foi usada com registro do sistema + dado externo (INMET/METAR/ONS/Defesa Civil) anexos", bloqueante: true }
    - { id: R04, item: "T10 (TOI) só foi usada com TOI + laudo do medidor com notificação do consumidor + memória de cálculo + histórico de consumo anexos", bloqueante: true }
    - { id: R05, item: "T08 só foi usada com fatura que mostra a compensação DIC/FIC creditada", bloqueante: true }
    - { id: R06, item: "Nenhuma expressão imputa fraude/má-fé ao autor ou ao advogado sem flag confirmado por human_decide", bloqueante: true }
    - { id: R07, item: "Subtipo, UC, datas e valores batem com o dossiê; seções de mérito não aplicáveis foram omitidas", bloqueante: true }
    - { id: R08, item: "Pedidos subsidiários presentes (limite do ressarcimento, repetição simples, compensação, quantum)", bloqueante: true }
    - { id: R09, item: "Liminar deferida: cumprimento comprovado nos autos antes/junto da contestação", bloqueante: true }
    - { id: R10, item: "Tom respeitoso; sem 'mero aborrecimento' em interrupção prolongada ou em UC com paciente dependente", bloqueante: false }
    - { id: R11, item: "Sinal de acordo avaliado e registrado (defender × acordar) antes de protocolar", bloqueante: false }
  motivos_recusa_padrao:
    - "Fato sem prova citável"
    - "Tese aplicada sem prova necessária (fortuito sem dado externo; TOI sem laudo)"
    - "Referência legal ou artigo regulatório não conferido ou inexistente"
    - "Subtipo/UC/valores/datas divergentes do dossiê"
    - "Linguagem imputa fraude sem decisão humana"
    - "Caso deveria ir para acordo/escalada, não para contestação padrão"
    - "Liminar descumprida sem comprovação de cumprimento"

# -----------------------------------------------------------------------------
# MÉTRICAS (M10/M11)
# -----------------------------------------------------------------------------
metricas:
  - { id: M01, nome: "Tempo médio de revisão por contestação", definicao: "média de reviews.review_seconds para drafts desta tipologia", meta: "< 30 min com qualidade [A CONFERIR]", fonte: reviews }
  - { id: M02, nome: "Aprovação sem alteração substancial", definicao: "% de reviews aprovadas com substantial_change = false", meta: "> 60 % após 200 casos [A CONFERIR]", fonte: reviews }
  - { id: M03, nome: "Subsídios faltantes detectados antes da defesa", definicao: "% de casos com exceção X01 aberta antes de gerar minuta", meta: "> 90 %", fonte: "dossiers + excecoes" }
  - { id: M04, nome: "Taxa de êxito por tese × subtipo × comarca", definicao: "outcomes.result ∈ {improcedente, parcial} por thesis_version_id, subtipo e comarca vs. baseline", meta: "≥ baseline + 10 p.p. [A CONFERIR]", fonte: outcomes }
  - { id: M05, nome: "Condenação média (dano moral + material) por subtipo e comarca", definicao: "média de outcomes.award_value; alimenta faixas_valor", meta: "queda de 20 % vs. baseline [A CONFERIR]", fonte: outcomes }
  - { id: M06, nome: "Custo de tokens por processo", definicao: "soma de llm_calls.cost_usd por case_id", meta: "< US$ 2 por contestação [A CONFERIR]", fonte: llm_calls }
  - { id: M07, nome: "Concordância modelo × revisor sênior", definicao: "gt_tasks.agreement_score médio (amostra semanal)", meta: "> 0,85", fonte: gt_tasks }
  - { id: M08, nome: "Flags antifraude confirmados por humano", definicao: "% de fraud_checks com result = flag e human_decision = confirmed, por código", meta: "monitorar precisão; recalibrar se < 50 %", fonte: fraud_checks }
  - { id: M09, nome: "Acordos sinalizados × realizados", definicao: "casos com sinal de acordo vs. outcomes.result = acordo e valor médio", meta: "calibrar faixas_valor trimestralmente", fonte: outcomes }
  - { id: M10, nome: "Cobertura de dado externo em T06", definicao: "% de peças com T06 em que há boletim INMET/METAR/ONS anexo", meta: "100 %", fonte: "drafts + draft_citations" }
  - { id: M11, nome: "Ações em série por evento detectadas", definicao: "nº de clusters (data × alimentador × comarca) com ≥ 10 ações identificados pelo M4 antes da primeira contestação", meta: "monitorar; alimentar T04/T13", fonte: fraud_checks }
