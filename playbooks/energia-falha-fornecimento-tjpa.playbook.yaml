    - codigo: evento_sem_registro_externo
      descricao: "Checagem cruzada: data do evento alegado sem interrupção registrada na UC/alimentador e sem evento meteorológico (INMET/METAR) — sinal de evento inexistente OU de falha de registro do cliente"
      parametros: { fontes: ["registro_interrupcao", "inmet", "metar", "defesa_civil"] }
      severidade: medium
