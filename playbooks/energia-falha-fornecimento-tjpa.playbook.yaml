# -----------------------------------------------------------------------------
# CAMPOS OBRIGATÓRIOS DO DOSSIÊ (M5)
# -----------------------------------------------------------------------------
campos_dossie_obrigatorios:
  # --- identificação do caso (extração dos autos) ---
  - { campo: comarca, tipo: texto, origem: extracao, descricao: "Comarca do juízo", obrigatorio: true }
  - { campo: juizado_especial, tipo: booleano, origem: extracao, descricao: "Tramita em Juizado Especial (rito da Lei 9.099)", obrigatorio: true }
  - { campo: subtipo, tipo: texto, origem: extracao, descricao: "interrupcao | oscilacao_dano_equipamento | toi_recuperacao_consumo | religacao | suspensao_indevida | negativacao | misto", obrigatorio: true, bloqueia_minuta_se_ausente: true }
  - { campo: valor_causa, tipo: valor_monetario, origem: extracao, descricao: "Valor da causa", obrigatorio: true }
  - { campo: valor_dano_moral_pedido, tipo: valor_monetario, origem: extracao, descricao: "Valor pedido a título de dano moral", obrigatorio: false }
  - { campo: valor_dano_material_pedido, tipo: valor_monetario, origem: extracao, descricao: "Valor pedido a título de dano material (equipamentos)", obrigatorio: false }
  - { campo: valor_toi, tipo: valor_monetario, origem: subsidio, descricao: "Valor da fatura de recuperação de consumo impugnada", obrigatorio: false }
  - { campo: data_ajuizamento, tipo: data, origem: extracao, descricao: "Data de distribuição", obrigatorio: true }
  - { campo: data_evento, tipo: data, origem: extracao, descricao: "Data do evento alegado (interrupção/queima/corte/TOI)", obrigatorio: true, bloqueia_minuta_se_ausente: true }
  - { campo: autor_pede_gratuidade, tipo: booleano, origem: extracao, descricao: "Pedido de justiça gratuita", obrigatorio: true }
  - { campo: renda_declarada_autor, tipo: valor_monetario, origem: extracao, descricao: "Renda mensal que consta dos autos", obrigatorio: false }
  - { campo: autor_pede_tutela_urgencia, tipo: booleano, origem: extracao, descricao: "Há pedido liminar (religação / baixa de negativação / suspensão da cobrança)", obrigatorio: true }
  - { campo: tutela_deferida, tipo: booleano, origem: publicacao, descricao: "Liminar já deferida", obrigatorio: false }
  - { campo: autor_alega_dano_equipamento, tipo: booleano, origem: extracao, descricao: "Inicial pede ressarcimento de equipamento queimado", obrigatorio: true }
  - { campo: equipamento_nota_fiscal_juntada, tipo: booleano, origem: extracao, descricao: "Há nota fiscal/orçamento do equipamento nos autos", obrigatorio: false }
  - { campo: equipamento_nota_fiscal_hash, tipo: texto, origem: antifraude, descricao: "Identificador (número/CNPJ emitente/valor) da nota fiscal para cruzamento entre ações", obrigatorio: false }
  - { campo: laudo_autor_generico, tipo: booleano, origem: antifraude, descricao: "Laudo/orçamento do autor é texto padronizado já visto em outras ações", obrigatorio: false }
  - { campo: comprovante_endereco_titular, tipo: texto, origem: extracao, descricao: "autor | terceiro | ausente", obrigatorio: true }
  - { campo: data_procuracao, tipo: data, origem: extracao, descricao: "Data da procuração juntada", obrigatorio: true }
  # --- subsídios do cliente (M3) ---
  - { campo: uc_numero, tipo: texto, origem: subsidio, descricao: "Número da unidade consumidora", obrigatorio: true, bloqueia_minuta_se_ausente: true }
  - { campo: uc_titular_e_autor, tipo: booleano, origem: subsidio, descricao: "Autor é o titular cadastral da UC", obrigatorio: true }
  - { campo: uc_classe, tipo: texto, origem: subsidio, descricao: "residencial | residencial_baixa_renda | comercial | rural | industrial", obrigatorio: true }
  - { campo: historico_interrupcoes_uc, tipo: lista, origem: subsidio, descricao: "Interrupções registradas na UC/alimentador no período (data, duração, causa)", obrigatorio: true }
  - { campo: interrupcao_registrada_na_data, tipo: booleano, origem: subsidio, descricao: "Há interrupção/oscilação registrada no sistema na data do evento", obrigatorio: true }
  - { campo: interrupcao_duracao_horas, tipo: numero, origem: subsidio, descricao: "Duração da interrupção na data do evento (horas)", obrigatorio: false }
  - { campo: causa_interrupcao, tipo: texto, origem: subsidio, descricao: "climatica | terceiro | vegetacao | falha_rede | manutencao_programada | rede_basica_ons | desconhecida", obrigatorio: true }
  - { campo: evento_climatico_registrado, tipo: booleano, origem: subsidio, descricao: "Há registro meteorológico (INMET/METAR) ou Defesa Civil de chuva/vento/descarga na data e região", obrigatorio: false }
  - { campo: evento_rede_basica, tipo: booleano, origem: subsidio, descricao: "Perturbação na Rede Básica/transmissão registrada pelo ONS/ANEEL na data", obrigatorio: false }
  - { campo: manutencao_programada_avisada, tipo: booleano, origem: subsidio, descricao: "Interrupção programada com aviso prévio nos termos regulatórios", obrigatorio: false }
  - { campo: compensacoes_dic_fic_pagas, tipo: booleano, origem: subsidio, descricao: "Houve crédito automático de compensação DIC/FIC/DMIC/DICRI na fatura da UC pelo período", obrigatorio: true }
  - { campo: compensacoes_valor_total, tipo: valor_monetario, origem: subsidio, descricao: "Valor total de compensações creditadas na UC nos 12 meses", obrigatorio: false }
  - { campo: ordens_servico, tipo: lista, origem: subsidio, descricao: "OS abertas/encerradas para a UC (nº, data, tipo, prazo)", obrigatorio: true }
  - { campo: protocolo_reclamacao_autor, tipo: booleano, origem: subsidio, descricao: "Autor registrou reclamação (call center/agência/ouvidoria/ANEEL) sobre o evento", obrigatorio: true }
  - { campo: pedido_ressarcimento_prazo_dias, tipo: numero, origem: subsidio, descricao: "Dias entre o evento e o pedido administrativo de ressarcimento (PID); null se não houve pedido", obrigatorio: false }
  - { campo: pedido_ressarcimento_formulado, tipo: booleano, origem: subsidio, descricao: "Autor formulou pedido administrativo de ressarcimento de danos (PID)", obrigatorio: true }
  - { campo: vistoria_realizada, tipo: booleano, origem: subsidio, descricao: "Distribuidora realizou vistoria/inspeção do equipamento", obrigatorio: false }
  - { campo: laudo_vistoria_conclusao, tipo: texto, origem: subsidio, descricao: "nexo_afastado | nexo_confirmado | inconclusivo | nao_realizada", obrigatorio: false }
  - { campo: ressarcimento_administrativo_pago, tipo: booleano, origem: subsidio, descricao: "Já houve ressarcimento administrativo (pagamento/conserto/substituição)", obrigatorio: false }
  - { campo: toi_lavrado, tipo: booleano, origem: subsidio, descricao: "Há TOI lavrado para a UC", obrigatorio: false }
  - { campo: toi_assinado_ou_recusa, tipo: booleano, origem: subsidio, descricao: "TOI assinado pelo consumidor/responsável, ou recusa registrada com testemunhas", obrigatorio: false }
  - { campo: toi_pericia_medidor, tipo: texto, origem: subsidio, descricao: "nao_realizada | laboratorio_distribuidora | orgao_metrologico_terceiro", obrigatorio: false }
  - { campo: toi_consumidor_notificado_pericia, tipo: booleano, origem: subsidio, descricao: "Consumidor notificado para acompanhar a perícia do medidor", obrigatorio: false }
  - { campo: toi_criterio_calculo, tipo: texto, origem: subsidio, descricao: "Critério do art. da Res. 1.000 usado (fator de carga, média 12 meses, carga instalada) [A CONFERIR]", obrigatorio: false }
  - { campo: toi_contraditorio_administrativo, tipo: booleano, origem: subsidio, descricao: "Consumidor teve prazo e recurso administrativo contra a fatura de recuperação", obrigatorio: false }
  - { campo: historico_consumo_queda, tipo: booleano, origem: subsidio, descricao: "Histórico de consumo mostra queda abrupta compatível com irregularidade e retomada após regularização", obrigatorio: false }
  - { campo: suspensao_por_inadimplencia, tipo: booleano, origem: subsidio, descricao: "Corte decorreu de inadimplência de fatura regular (não de TOI)", obrigatorio: false }
  - { campo: aviso_previo_suspensao, tipo: booleano, origem: subsidio, descricao: "Houve notificação prévia de suspensão nos termos regulatórios", obrigatorio: false }
  - { campo: religacao_prazo_horas, tipo: numero, origem: subsidio, descricao: "Horas entre pagamento/solicitação e religação", obrigatorio: false }
  - { campo: negativacao_realizada, tipo: booleano, origem: subsidio, descricao: "Houve inscrição em cadastro de inadimplentes", obrigatorio: false }
  - { campo: negativacao_preexistente, tipo: booleano, origem: subsidio, descricao: "Autor tinha outra negativação legítima anterior", obrigatorio: false }
  - { campo: debito_negativado_origem, tipo: texto, origem: subsidio, descricao: "fatura_regular | toi | parcelamento | desconhecida", obrigatorio: false }
  - { campo: faturas_em_aberto_n, tipo: numero, origem: subsidio, descricao: "Nº de faturas em aberto da UC na data do evento", obrigatorio: false }
  # --- cruzamentos (antifraude / publicações) ---
  - { campo: litispendencia_cnj, tipo: lista, origem: antifraude, descricao: "Processos em curso com mesmas partes/causa/pedido", obrigatorio: true }
  - { campo: coisa_julgada_cnj, tipo: lista, origem: antifraude, descricao: "Processos transitados com mesmas partes/causa/pedido", obrigatorio: true }
  - { campo: acoes_mesma_uc_n, tipo: numero, origem: antifraude, descricao: "Nº de ações sobre a mesma UC (qualquer autor)", obrigatorio: true }
  - { campo: acoes_mesmo_autor_mesmo_reu_n, tipo: numero, origem: antifraude, descricao: "Nº de ações do autor contra o cliente (carteira + publicações)", obrigatorio: true }
  - { campo: acoes_mesmo_advogado_mes_n, tipo: numero, origem: antifraude, descricao: "Nº de ações do mesmo advogado contra o cliente no mês", obrigatorio: true }
  - { campo: acoes_mesmo_evento_mesma_comarca_n, tipo: numero, origem: antifraude, descricao: "Nº de ações pelo mesmo evento (data/alimentador) na comarca", obrigatorio: false }
  - { campo: nota_fiscal_repetida_n, tipo: numero, origem: antifraude, descricao: "Nº de outras ações em que a mesma nota fiscal de equipamento aparece", obrigatorio: false }
