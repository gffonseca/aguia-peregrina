# =============================================================================
# Águia Peregrina — M0 Playbook — Energia: falha de fornecimento / TOI / danos (defesa) — TJPA
# =============================================================================
# PRIMEIRO RASCUNHO. Nenhuma citação legal, número, prazo ou valor aqui foi
# conferido por advogado. Todo item marcado "[A CONFERIR pelo advogado-dono]"
# e `conferido: false` precisa ser validado (texto vigente da Res. ANEEL
# 1.000/2021 e alterações, números de temas/súmulas, jurisprudência atual do
# TJPA e das Turmas Recursais) antes de o status virar `aprovado`.
# O validador recusa `status: aprovado` enquanto houver pendência.
#
# Fonte da verdade: este YAML. A versão em prosa
# (energia-falha-fornecimento-tjpa.playbook.md) é derivada.
# =============================================================================

schema_version: "1.0"

metadata:
  id: energia-falha-fornecimento-tjpa
  nome: "Energia elétrica — interrupção/oscilação, danos em equipamentos, TOI e negativação — defesa de distribuidora — TJPA"
  tipologia: energia_falha_fornecimento
  tribunal: TJPA
  reu_tipo: concessionaria_distribuicao_energia
  lado: defesa
  tipo_peca_padrao: contestacao
  versao: 1
  supera_versao: null
  autor_nome: "Gustavo Fonseca — OAB/PA 12.724 — revisão própria até nomear advogado-dono da tipologia"
  autor_oab: "PA 12724"
  criado_em: 2026-10-19T12:00:00-03:00
  status: rascunho
  aprovado_por_nome: null
  aprovado_por_oab: null
  aprovado_em: null
  descricao: >-
    Ações de consumidor contra distribuidora de energia elétrica (foco: Equatorial Pará; em menor
    escala, Norte Energia e cooperativas/permissionárias) por interrupção ou oscilação de
    fornecimento, queima de equipamentos, cobrança por recuperação de consumo (TOI/fatura de
    diferença), demora na religação, suspensão indevida e negativação. Pedidos típicos: declaração
    de inexigibilidade do débito, ressarcimento de equipamentos, repetição em dobro, dano moral,
    tutela de urgência para religação/baixa da negativação.
  observacoes: >-
    Rascunho gerado para validação. Antes de aprovar: (1) conferir a numeração dos artigos da
    Res. Normativa ANEEL 1.000/2021 (consolidada, com alterações posteriores) para ressarcimento
    de danos, TOI, DIC/FIC/DMIC e suspensão; (2) conferir Temas/Súmulas do STJ e orientação das
    Câmaras Cíveis e Turmas Recursais do TJPA sobre dano moral por interrupção e por TOI;
    (3) calibrar faixas de acordo com a carteira do cliente por comarca, separando capital
    e polos do interior (Santarém, Marabá, Castanhal) onde há concentração de litigância;
    (4) confirmar com o cliente quais subsídios (histórico de interrupções da UC, OS, laudo de
    vistoria, compensações pagas, protocolos, registros ONS/ANEEL) ele entrega em até 5 dias úteis.

