metadata:
  id: consignado-rmc-tjpa
  nome: "Consignado / RMC não reconhecido — defesa de instituição financeira regional — TJPA"
  tipologia: consignado_rmc_nao_reconhecido
  tribunal: TJPA
  reu_tipo: instituicao_financeira_regional
  lado: defesa
  tipo_peca_padrao: contestacao
  versao: 1
  supera_versao: null
  autor_nome: "[A PREENCHER — advogado-dono da tipologia]"
  autor_oab: "PA 00000"
  criado_em: 2026-10-19T12:00:00-03:00
  status: em_revisao
  aprovado_por_nome: null
  aprovado_por_oab: null
  aprovado_em: null
  descricao: >-
    Ações de consumidor (geralmente aposentado/pensionista do INSS ou servidor) que negam
    a contratação de empréstimo consignado, cartão consignado com reserva de margem (RMC)
    ou cartão benefício (RCC), pedindo declaração de inexistência do débito, devolução
    (em dobro) dos descontos e dano moral. Réu: instituição financeira regional cliente da FBS.
  observacoes: >-
    Em revisão. Números de temas repetitivos, súmulas, artigos e faixas de valor continuam
