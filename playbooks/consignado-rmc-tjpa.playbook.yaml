# -----------------------------------------------------------------------------
# CAMPOS OBRIGATÓRIOS DO DOSSIÊ (M5)
# -----------------------------------------------------------------------------
campos_dossie_obrigatorios:
  # --- identificação do caso (extração dos autos) ---
  - { campo: comarca, tipo: texto, origem: extracao, descricao: "Comarca do juízo", obrigatorio: true }
  - { campo: tipo_produto, tipo: texto, origem: subsidio, descricao: "consignado | rmc | rcc | cartao_beneficio | refinanciamento", obrigatorio: true, bloqueia_minuta_se_ausente: true }
  - { campo: valor_causa, tipo: valor_monetario, origem: extracao, descricao: "Valor da causa", obrigatorio: true }
  - { campo: valor_dano_moral_pedido, tipo: valor_monetario, origem: extracao, descricao: "Valor pedido a título de dano moral", obrigatorio: false }
  - { campo: valor_contrato, tipo: valor_monetario, origem: subsidio, descricao: "Valor liberado/limite do contrato", obrigatorio: true }
  - { campo: data_contrato, tipo: data, origem: subsidio, descricao: "Data da contratação", obrigatorio: true }
  - { campo: data_primeiro_desconto, tipo: data, origem: subsidio, descricao: "Primeira parcela descontada", obrigatorio: true }
  - { campo: data_ajuizamento, tipo: data, origem: extracao, descricao: "Data de distribuição", obrigatorio: true }
  - { campo: data_ciencia_inequivoca, tipo: data, origem: calculado, descricao: "Data presumida de ciência do desconto (= data_primeiro_desconto salvo prova diversa)", obrigatorio: true }
  - { campo: autor_idade, tipo: numero, origem: extracao, descricao: "Idade do autor na data do ajuizamento", obrigatorio: false }
  - { campo: autor_beneficiario_inss, tipo: booleano, origem: extracao, descricao: "Autor é aposentado/pensionista do INSS", obrigatorio: true }
  - { campo: autor_nega_contratacao, tipo: booleano, origem: extracao, descricao: "Inicial nega totalmente a contratação (vs. alega vício de consentimento)", obrigatorio: true, bloqueia_minuta_se_ausente: true }
  - { campo: autor_alega_vicio_rmc, tipo: booleano, origem: extracao, descricao: "Autor diz que pensou contratar consignado e recebeu cartão RMC/RCC", obrigatorio: false }
  - { campo: autor_pede_gratuidade, tipo: booleano, origem: extracao, descricao: "Pedido de justiça gratuita", obrigatorio: true }
  - { campo: renda_declarada_autor, tipo: valor_monetario, origem: extracao, descricao: "Renda mensal que consta dos autos (benefício/holerite)", obrigatorio: false }
  - { campo: inicial_atende_requisitos_tema_1198, tipo: booleano, origem: extracao, descricao: "Inicial traz os documentos exigidos pelo precedente do STJ sobre emenda em ações de consignado [A CONFERIR pelo advogado-dono]", obrigatorio: true }
  - { campo: reclamacao_administrativa_previa, tipo: booleano, origem: subsidio, descricao: "Houve SAC/ouvidoria/consumidor.gov antes da ação", obrigatorio: false }
  # --- subsídios do cliente (M3) ---
  - { campo: contrato_localizado, tipo: booleano, origem: subsidio, descricao: "Cliente localizou o instrumento contratual", obrigatorio: true, bloqueia_minuta_se_ausente: true }
  - { campo: contrato_assinatura_tipo, tipo: texto, origem: subsidio, descricao: "biometria_facial | assinatura_digital_icp | assinatura_eletronica_simples | fisica | digital_telefone | nenhuma", obrigatorio: true }
  - { campo: biometria_score, tipo: numero, origem: subsidio, descricao: "Score da biometria facial (0–1), se houver", obrigatorio: false, disponibilidade: "a confirmar com cliente" }
  - { campo: documento_selfie_coincide, tipo: booleano, origem: subsidio, descricao: "Selfie × documento com match registrado pelo fornecedor de biometria", obrigatorio: false, disponibilidade: "a confirmar com cliente" }
  - { campo: geolocalizacao_compativel, tipo: booleano, origem: subsidio, descricao: "Lat/long da contratação compatível com endereço do autor", obrigatorio: false }
  - { campo: ip_log_disponivel, tipo: booleano, origem: subsidio, descricao: "Há log de IP/dispositivo/horário da contratação", obrigatorio: true, disponibilidade: "a confirmar com cliente" }
  - { campo: valor_creditado_conta_autor, tipo: booleano, origem: subsidio, descricao: "TED/PIX/crédito em conta de titularidade do próprio autor", obrigatorio: true, bloqueia_minuta_se_ausente: true, disponibilidade: "a confirmar com cliente" }
  - { campo: conta_credito_titularidade, tipo: texto, origem: subsidio, descricao: "autor | terceiro | desconhecida", obrigatorio: true }
  - { campo: ted_comprovante_localizado, tipo: booleano, origem: subsidio, descricao: "Comprovante de TED/PIX/ordem de pagamento juntável", obrigatorio: true, disponibilidade: "a confirmar com cliente" }
  - { campo: extratos_mostram_uso, tipo: booleano, origem: subsidio, descricao: "Extratos mostram saque/uso do valor creditado", obrigatorio: false }
  - { campo: rmc_houve_saque_ou_compra, tipo: booleano, origem: subsidio, descricao: "No RMC/RCC, houve saque autorizado ou compras no cartão", obrigatorio: false }
  - { campo: descontos_parcelas_n, tipo: numero, origem: subsidio, descricao: "Nº de parcelas já descontadas", obrigatorio: true }
  - { campo: audio_sac_disponivel, tipo: booleano, origem: subsidio, descricao: "Há gravação de SAC/telemarketing com o autor", obrigatorio: false }
  - { campo: contratos_ativos_autor_n, tipo: numero, origem: subsidio, descricao: "Nº de contratos do autor com o cliente", obrigatorio: true }
  - { campo: contratos_anteriores_adimplidos, tipo: booleano, origem: subsidio, descricao: "Autor tem histórico de contratos anteriores pagos sem questionamento", obrigatorio: false }
  # --- cruzamentos (antifraude / publicações) ---
  - { campo: litispendencia_cnj, tipo: lista, origem: antifraude, descricao: "Processos em curso com mesmas partes/causa/pedido", obrigatorio: true }
  - { campo: coisa_julgada_cnj, tipo: lista, origem: antifraude, descricao: "Processos transitados com mesmas partes/causa/pedido", obrigatorio: true }
  - { campo: acoes_mesmo_autor_mesmo_reu_n, tipo: numero, origem: antifraude, descricao: "Nº de ações do autor contra o cliente (carteira + publicações)", obrigatorio: true }
  - { campo: acoes_mesmo_advogado_mes_n, tipo: numero, origem: antifraude, descricao: "Nº de ações do mesmo advogado contra o cliente no mês", obrigatorio: true }
  - { campo: autor_falecido, tipo: booleano, origem: antifraude, descricao: "Indício de óbito do autor antes do ajuizamento/procuração", obrigatorio: true }
  - { campo: data_procuracao, tipo: data, origem: extracao, descricao: "Data da procuração juntada", obrigatorio: true }
  - { campo: comprovante_endereco_titular, tipo: texto, origem: extracao, descricao: "autor | terceiro | ausente", obrigatorio: true }
  - { campo: indicio_fraude_contra_autor, tipo: booleano, origem: calculado, descricao: "Sinais de que a fraude pode ter sido real (IP/geo incompatível, conta de terceiro, sem biometria)", obrigatorio: true }

# -----------------------------------------------------------------------------
# ÁRVORE DE TESES
# -----------------------------------------------------------------------------
teses:
  # ---------------------------------------------------------------- PRELIMINARES
  - id: T01
    nome: "Impugnação à gratuidade de justiça"
    categoria: preliminar
    ordem: 1
    pai: null
    resumo: >-
      O autor pede gratuidade mas há elementos nos autos (renda, contratos, padrão de consumo)
      que afastam a presunção de hipossuficiência; requer-se intimação para comprovar.
    condicoes_aplicacao:
      - { campo: autor_pede_gratuidade, operador: "==", valor: true }
      - { campo: renda_declarada_autor, operador: ">", valor: 4554.0, nota: "~3 salários mínimos [A CONFERIR pelo advogado-dono — valor e critério local]" }
    provas_necessarias:
      - { tipo_documento: extrato_beneficio, descricao: "Histórico de créditos/HISCRE ou holerite", origem: extracao, obrigatoria: true, peso: 0.9 }
      - { tipo_documento: extrato_bancario, descricao: "Extratos com movimentação incompatível com hipossuficiência", origem: subsidio, obrigatoria: false, peso: 0.6 }
    provas_que_afastam:
      - { tipo_documento: declaracao_hipossuficiencia, descricao: "Renda ≤ limite usado pelo TJPA e ausência de outros sinais", origem: extracao, obrigatoria: false, peso: 0.8 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, art. 98 a 100", tipo: dispositivo, para_que_serve: "presunção relativa e impugnação à gratuidade", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CPC, art. 99, § 2º", tipo: dispositivo, para_que_serve: "juiz pode indeferir se houver elementos que evidenciem falta de pressupostos", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ — critério de renda para gratuidade [tema/REsp A CONFERIR]", tipo: precedente, para_que_serve: "parâmetro objetivo de renda", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "TJPA — jurisprudência das Câmaras Cíveis sobre impugnação [A CONFERIR]", tipo: precedente, para_que_serve: "critério local", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "A presunção do art. 99, § 3º, é relativa e cede diante de prova em contrário."
        - "Renda e padrão de contratação do autor evidenciam capacidade de arcar com custas."
        - "Pedido: intimação para comprovar hipossuficiência, sob pena de revogação."
    pedidos:
      - "Revogação/indeferimento da gratuidade ou intimação do autor para comprová-la."
    pedidos_subsidiarios:
      - "Parcelamento das custas (CPC, art. 98, § 6º) [A CONFERIR pelo advogado-dono]."
    risco_se_mal_aplicada: "Impugnar gratuidade de aposentado com um salário mínimo irrita o juízo e enfraquece a credibilidade da defesa."
    ativa: true

  - id: T02
    nome: "Emenda da inicial — requisitos do precedente do STJ para ações de consignado (Tema 1.198)"
    categoria: preliminar
    ordem: 2
    pai: null
    resumo: >-
      A inicial não traz os documentos/requisitos mínimos fixados pelo STJ para ações que discutem
      empréstimo consignado (procuração e comprovante de endereço atualizados, extratos do período,
      indicação precisa do contrato etc.) — pede-se emenda, sob pena de indeferimento.
    condicoes_aplicacao:
      - { campo: inicial_atende_requisitos_tema_1198, operador: "==", valor: false }
    provas_necessarias:
      - { tipo_documento: peticao_inicial, descricao: "Inicial e anexos (para apontar o que falta)", origem: extracao, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: despacho, descricao: "Juízo já determinou emenda ou declarou a inicial apta", origem: publicacao, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, arts. 319, 320, 321 e 330", tipo: dispositivo, para_que_serve: "requisitos da inicial e emenda", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ, Tema repetitivo 1.198 (número e tese exata A CONFERIR)", tipo: tema, para_que_serve: "requisitos documentais mínimos nas ações sobre consignado; enfrentamento de litigância em massa", conferido: false, nota: "[A CONFERIR pelo advogado-dono — conferir número, tese firmada, modulação e se se aplica ao caso]" }
        - { ref: "CNJ, Recomendação sobre litigância predatória (nº A CONFERIR)", tipo: norma_regulatoria, para_que_serve: "respaldo para exigências documentais", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "A inicial é genérica e não individualiza o contrato impugnado nem junta os documentos exigidos pelo precedente vinculante."
        - "A ausência inviabiliza o contraditório e a localização dos subsídios pelo réu."
    pedidos:
      - "Intimação do autor para emendar a inicial, sob pena de indeferimento (CPC, art. 321)."
    pedidos_subsidiarios:
      - "Suspensão do prazo de defesa até a emenda, se ainda cabível."
    risco_se_mal_aplicada: "Se a inicial já atende aos requisitos, a preliminar soa protelatória."
    ativa: true

  - id: T03
    nome: "Litispendência ou coisa julgada"
    categoria: preliminar
    ordem: 3
    pai: null
    resumo: "Há outra ação em curso (ou já julgada) com as mesmas partes, causa de pedir e pedido sobre o mesmo contrato."
    condicoes_aplicacao:
      - { campo: litispendencia_cnj, operador: existe }
    provas_necessarias:
      - { tipo_documento: certidao_processo, descricao: "Cópia da inicial e andamento do processo anterior", origem: antifraude, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: peticao_inicial, descricao: "Contratos distintos (número/data/valor) comprovadamente diferentes", origem: extracao, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, art. 337, VI e VII, §§ 1º a 4º", tipo: dispositivo, para_que_serve: "litispendência e coisa julgada", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CPC, art. 485, V", tipo: dispositivo, para_que_serve: "extinção sem mérito", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes: []
      argumentos_chave:
        - "Tríplice identidade demonstrada documentalmente."
        - "Requer extinção sem resolução de mérito e comunicação ao juízo prevento."
    pedidos:
      - "Extinção do feito sem resolução do mérito (CPC, art. 485, V)."
    pedidos_subsidiarios:
      - "Reunião dos feitos por conexão (CPC, art. 55) se a identidade for parcial."
    risco_se_mal_aplicada: "Confundir contratos diferentes do mesmo autor como se fossem o mesmo."
    ativa: true

  - id: T03.1
    nome: "Coisa julgada"
    categoria: preliminar
    ordem: 4
    pai: T03
    resumo: "Variante de T03 quando o processo anterior já transitou em julgado."
    condicoes_aplicacao:
      - { campo: coisa_julgada_cnj, operador: existe }
    provas_necessarias:
      - { tipo_documento: certidao_transito, descricao: "Certidão de trânsito em julgado e sentença anterior", origem: antifraude, obrigatoria: true, peso: 1.0 }
    provas_que_afastam: []
    fundamentacao:
      dispositivos:
        - { ref: "CPC, art. 337, VII e § 4º; art. 502 e 508", tipo: dispositivo, para_que_serve: "coisa julgada material e eficácia preclusiva", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes: []
      argumentos_chave:
        - "Questão já decidida com trânsito em julgado; vedada a rediscussão."
    pedidos:
      - "Extinção sem resolução do mérito por coisa julgada."
    pedidos_subsidiarios: []
    risco_se_mal_aplicada: null
    ativa: true

  - id: T04
    nome: "Fracionamento indevido de demandas (mesmo autor, vários contratos, várias ações)"
    categoria: processual
    ordem: 5
    pai: null
    resumo: >-
      O autor ajuizou ações separadas para cada contrato/desconto com a mesma causa de pedir remota,
      multiplicando honorários e dano moral. Pede-se reunião por conexão, reconhecimento de abuso
      e consideração do conjunto para fins de dano moral e sucumbência.
    condicoes_aplicacao:
      - { campo: acoes_mesmo_autor_mesmo_reu_n, operador: ">=", valor: 2 }
    provas_necessarias:
      - { tipo_documento: relatorio_antifraude, descricao: "Lista das ações do autor contra o réu com datas e objetos", origem: antifraude, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: peticao_inicial, descricao: "Contratos com causas de pedir realmente distintas (datas/fatos diversos)", origem: extracao, obrigatoria: false, peso: 0.7 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, arts. 55, 58 e 59", tipo: dispositivo, para_que_serve: "conexão e prevenção", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CPC, arts. 5º, 6º, 77 e 80", tipo: dispositivo, para_que_serve: "boa-fé processual e litigância de má-fé", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ / TJPA — precedentes sobre fracionamento de demandas e abuso do direito de ação [A CONFERIR]", tipo: precedente, para_que_serve: "caracterização do fracionamento abusivo", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CNJ — Recomendação sobre litigância predatória; nota técnica do Centro de Inteligência do TJPA [A CONFERIR]", tipo: norma_regulatoria, para_que_serve: "instrumentos de gestão do abuso", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Um só fato gerador alegado (fraude no benefício) foi pulverizado em N ações."
        - "O fracionamento multiplica custos, honorários e indenizações pelo mesmo suposto dano."
    pedidos:
      - "Reunião dos feitos no juízo prevento; reconhecimento do fracionamento abusivo para fins de dano moral único e sucumbência."
    pedidos_subsidiarios:
      - "Fixação de dano moral, se houver, considerando o conjunto das ações."
    risco_se_mal_aplicada: "Acusar fracionamento onde há contratos e fatos realmente distintos."
    pendencia: null
    providencias_escalonadas:
      - { nivel: a, descricao: "Padrão: pedido de reunião por conexão + depoimento pessoal + exibição de documentos (na própria peça).", autorizacao_dupla: false }
      - { nivel: b, descricao: "Comunicação institucional do padrão de fracionamento ao Cijepa/NUMOPEDE do TJPA, sem imputar conduta a pessoa.", autorizacao_dupla: true }
      - { nivel: c, descricao: "Representação à OAB-PA, só em casos extremos.", autorizacao_dupla: true }
    ativa: true

  # ---------------------------------------------------------------- PREJUDICIAL
  - id: T05
    nome: "Prescrição da pretensão (e decadência, se o caso)"
    categoria: prejudicial
    ordem: 6
    pai: null
    resumo: >-
      Entre a ciência inequívoca do desconto (primeira parcela) e o ajuizamento transcorreu prazo
      superior ao prescricional aplicável. O prazo e o termo inicial (incluindo discussão sobre
      trato sucessivo) devem ser definidos pelo advogado-dono.
    condicoes_aplicacao:
      - { campo: data_ciencia_inequivoca, operador: existe }
      - { campo: data_ajuizamento, operador: existe }
    provas_necessarias:
      - { tipo_documento: extrato_beneficio, descricao: "HISCRE/extrato de consignações com a data do primeiro desconto", origem: subsidio, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: reclamacao_administrativa, descricao: "Reclamação/SAC que interrompa ou demonstre ciência posterior", origem: subsidio, obrigatoria: false, peso: 0.6 }
    fundamentacao:
      dispositivos:
        - { ref: "CDC, art. 27 (5 anos, fato do serviço) × CC, art. 206, § 3º, IV/V (3 anos) × CC, art. 205 (10 anos)", tipo: dispositivo, para_que_serve: "definir o prazo aplicável — divergência que o advogado-dono deve resolver para a tipologia", conferido: false, nota: "[A CONFERIR pelo advogado-dono — qual prazo o TJPA aplica a declaratória c/c repetição e dano moral em consignado]" }
        - { ref: "CDC, art. 26", tipo: dispositivo, para_que_serve: "decadência para vício (se a inicial alegar vício do serviço)", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ — termo inicial em descontos sucessivos (trato sucessivo × ato único) [A CONFERIR]", tipo: precedente, para_que_serve: "termo inicial", conferido: false, nota: "[A CONFERIR pelo advogado-dono — risco: tese de trato sucessivo costuma afastar a prescrição total]" }
      argumentos_chave:
        - "Termo inicial (tese principal): a ciência inequívoca ocorre com o primeiro desconto, visível no extrato do benefício — pretensão única, não renovada a cada parcela."
        - "Termo inicial (tese subsidiária): se o juízo adotar trato sucessivo, prescrição das parcelas anteriores ao prazo contado retroativamente do ajuizamento."
        - "O prazo (5, 3 ou 10 anos) será fixado após o levantamento da jurisprudência do TJPA; até lá a peça não afirma prazo."
    pedidos:
      - "Reconhecimento da prescrição e extinção com resolução de mérito (CPC, art. 487, II)."
    pedidos_subsidiarios:
      - "Prescrição parcial das parcelas anteriores ao prazo legal."
    risco_se_mal_aplicada: "Em descontos de trato sucessivo o juízo pode considerar a pretensão renovada a cada parcela; a tese total raramente prospera sozinha."
    pendencia: "prazo (CDC 27 × CC 206 §3º × CC 205) aguarda levantamento TJPA 12 meses"
    ativa: true

  # ---------------------------------------------------------------- MÉRITO
  - id: T06
    nome: "Contratação válida e regular (biometria / assinatura digital / geolocalização / logs)"
    categoria: merito
    ordem: 7
    pai: null
    resumo: >-
      O contrato existe, foi celebrado pelo próprio autor por canal digital ou físico, com
      autenticação robusta (biometria facial, assinatura eletrônica, token, geolocalização,
      IP/dispositivo) e trilha de auditoria. O réu desincumbe-se do ônus de provar a autenticidade.
    condicoes_aplicacao:
      - { campo: contrato_localizado, operador: "==", valor: true }
      - { campo: contrato_assinatura_tipo, operador: in, valor: [biometria_facial, assinatura_digital_icp, assinatura_eletronica_simples, digital_telefone, fisica] }
    provas_necessarias:
      - { tipo_documento: contrato, descricao: "Instrumento contratual/termo de adesão com dados do autor", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: log_autenticacao, descricao: "Trilha de auditoria: IP, dispositivo, data/hora, hash da assinatura", origem: subsidio, obrigatoria: true, peso: 0.9 }
      - { tipo_documento: biometria, descricao: "Selfie/biometria facial com documento e score", origem: subsidio, obrigatoria: false, peso: 0.9 }
      - { tipo_documento: geolocalizacao, descricao: "Lat/long no momento da contratação", origem: subsidio, obrigatoria: false, peso: 0.6 }
      - { tipo_documento: documento_identidade, descricao: "Cópia de RG/CNH apresentada na contratação", origem: subsidio, obrigatoria: false, peso: 0.6 }
      - { tipo_documento: audio_sac, descricao: "Gravação de confirmação/telemarketing com o autor", origem: subsidio, obrigatoria: false, peso: 0.7 }
      - { tipo_documento: autorizacao_inss, descricao: "Averbação/autorização de consignação no benefício (quando aplicável)", origem: subsidio, obrigatoria: false, peso: 0.5 }
    provas_que_afastam:
      - { tipo_documento: log_autenticacao, descricao: "IP/geolocalização em outra UF ou incompatível com o autor", origem: subsidio, obrigatoria: false, peso: 1.0 }
      - { tipo_documento: boletim_ocorrencia, descricao: "BO de roubo/perda de documentos anterior à contratação", origem: extracao, obrigatoria: false, peso: 0.8 }
      - { tipo_documento: laudo_pericial, descricao: "Assinatura física impugnada sem possibilidade de perícia favorável", origem: extracao, obrigatoria: false, peso: 1.0 }
      - { tipo_documento: contrato, descricao: "Contrato com dados divergentes (nome, CPF, endereço) ou ilegível", origem: subsidio, obrigatoria: false, peso: 0.9 }
    fundamentacao:
      dispositivos:
        - { ref: "CC, arts. 104, 107 e 421-422", tipo: dispositivo, para_que_serve: "validade do negócio e liberdade de forma", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "MP 2.200-2/2001, art. 10, § 2º; Lei 14.063/2020", tipo: dispositivo, para_que_serve: "validade da assinatura eletrônica não ICP quando admitida pelas partes", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "Lei 10.820/2003 e regulamentação do INSS (IN sobre consignação) [A CONFERIR]", tipo: dispositivo, para_que_serve: "regime do consignado e exigências de contratação", conferido: false, nota: "[A CONFERIR pelo advogado-dono — conferir IN vigente e exigências de biometria/canal]" }
        - { ref: "CPC, arts. 373, II, 411 e 429, II", tipo: dispositivo, para_que_serve: "ônus da prova e autenticidade de documento", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ, Súmula 297", tipo: sumula, para_que_serve: "CDC aplicável — reconhecer e enfrentar", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "STJ, Súmula 479", tipo: sumula, para_que_serve: "risco — fortuito interno em fraude de terceiro; usar para delimitar: só incide se houver fraude", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "STJ, Tema 1.061 (ônus da prova da autenticidade de assinatura impugnada)", tipo: tema, para_que_serve: "risco — cabe ao banco provar; por isso logs/biometria são essenciais", conferido: false, nota: "[A CONFERIR pelo advogado-dono — número e tese exata]" }
        - { ref: "TJPA — acórdãos que admitem contratação por biometria/assinatura eletrônica [A CONFERIR]", tipo: precedente, para_que_serve: "jurisprudência local favorável", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "A trilha de auditoria (IP, dispositivo, data/hora, biometria, geolocalização) prova a autoria do autor."
        - "O contrato observa as exigências regulatórias do consignado e foi averbado no benefício com anuência."
        - "Inexiste defeito do serviço; a Súmula 479 pressupõe fraude, que não houve."
    pedidos:
      - "Improcedência dos pedidos declaratório, condenatório e indenizatório."
    pedidos_subsidiarios:
      - "Em caso de dúvida sobre a autenticidade, produção de prova pericial (grafotécnica ou técnica sobre os logs)."
    risco_se_mal_aplicada: "Afirmar contratação válida sem log/biometria anexos viola a regra de citação e expõe o cliente à Súmula 479."
    ativa: true

  - id: T06.1
    nome: "RMC/RCC — regularidade do cartão consignado e distinção do empréstimo"
    categoria: merito
    ordem: 8
    pai: T06
    resumo: >-
      Quando o produto é cartão consignado com reserva de margem (RMC) ou cartão benefício (RCC),
      a contratação específica desse produto foi informada e aceita; houve saque/compra; a
      reserva de margem é legal. Enfrenta a tese de "achei que era empréstimo".
    condicoes_aplicacao:
      - { campo: tipo_produto, operador: in, valor: [rmc, rcc, cartao_beneficio] }
      - { campo: contrato_localizado, operador: "==", valor: true }
    provas_necessarias:
      - { tipo_documento: contrato, descricao: "Termo de adesão ao cartão com destaque para RMC/RCC e CET", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: fatura_cartao, descricao: "Faturas e comprovante de saque autorizado/compras", origem: subsidio, obrigatoria: true, peso: 0.9 }
      - { tipo_documento: autorizacao_inss, descricao: "Autorização de reserva de margem no benefício", origem: subsidio, obrigatoria: false, peso: 0.6 }
    provas_que_afastam:
      - { tipo_documento: fatura_cartao, descricao: "Nenhum uso do cartão além do saque inicial; descontos perpétuos sem amortização", origem: subsidio, obrigatoria: false, peso: 0.9 }
      - { tipo_documento: contrato, descricao: "Termo sem destaque informativo do produto RMC (dever de informação)", origem: subsidio, obrigatoria: false, peso: 0.9 }
    fundamentacao:
      dispositivos:
        - { ref: "Lei 10.820/2003, art. 6º, § 5º (RMC) e legislação do cartão benefício [A CONFERIR]", tipo: dispositivo, para_que_serve: "legalidade da reserva de margem", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CDC, arts. 6º, III, 31 e 46", tipo: dispositivo, para_que_serve: "dever de informação — enfrentar", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "TJPA — orientação sobre RMC (validade × conversão em consignado comum) [A CONFERIR]", tipo: precedente, para_que_serve: "saber se o tribunal converte RMC em empréstimo e com que taxa", conferido: false, nota: "[A CONFERIR pelo advogado-dono — risco alto: muitos tribunais convertem]" }
      argumentos_chave:
        - "O autor aderiu expressamente ao cartão, sacou e/ou usou o limite; a informação foi clara."
        - "A reserva de margem é prevista em lei e autorizada no benefício."
    pedidos:
      - "Improcedência; manutenção do contrato de cartão consignado."
    pedidos_subsidiarios:
      - "Se convertido em empréstimo consignado comum, aplicação da taxa média de mercado da época e compensação dos valores pagos, sem repetição em dobro."
    risco_se_mal_aplicada: "Em casos sem uso do cartão o TJPA tende a reconhecer vício de informação; avaliar acordo."
    pendencia: "postura em RMC/RCC (conversão em consignado comum, taxa aplicável, repetição em dobro) aguarda levantamento TJPA 12 meses; estrutura mantida"
    ativa: true

  - id: T07
    nome: "Recebimento e utilização dos valores pelo autor (TED/PIX em conta própria e extratos)"
    categoria: merito
    ordem: 9
    pai: null
    resumo: >-
      O valor do contrato foi creditado em conta de titularidade do autor e utilizado, o que é
      incompatível com a alegação de desconhecimento; vedação ao enriquecimento sem causa e ao
      comportamento contraditório.
    condicoes_aplicacao:
      - { campo: valor_creditado_conta_autor, operador: "==", valor: true }
      - { campo: conta_credito_titularidade, operador: "==", valor: autor }
    provas_necessarias:
      - { tipo_documento: comprovante_ted, descricao: "Comprovante de TED/PIX/ordem de pagamento com agência/conta do autor", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: extrato_bancario, descricao: "Extrato da conta do autor mostrando crédito e saques/uso", origem: subsidio, obrigatoria: false, peso: 0.9 }
      - { tipo_documento: extrato_beneficio, descricao: "Histórico de descontos sem contestação por N meses", origem: subsidio, obrigatoria: false, peso: 0.5 }
    provas_que_afastam:
      - { tipo_documento: comprovante_ted, descricao: "Crédito em conta de terceiro ou conta aberta na mesma data da contratação", origem: subsidio, obrigatoria: false, peso: 1.0 }
      - { tipo_documento: extrato_bancario, descricao: "Saque integral imediato em praça distante do domicílio", origem: subsidio, obrigatoria: false, peso: 0.8 }
    fundamentacao:
      dispositivos:
        - { ref: "CC, arts. 884 a 886", tipo: dispositivo, para_que_serve: "enriquecimento sem causa", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CC, art. 187 e art. 422 (venire contra factum proprium)", tipo: dispositivo, para_que_serve: "comportamento contraditório", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ / TJPA — improcedência quando comprovado crédito em conta do autor [A CONFERIR]", tipo: precedente, para_que_serve: "efeito probatório da TED", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "O crédito na conta do autor, seguido de uso, demonstra ciência e proveito do contrato."
        - "Os descontos ocorreram por N meses sem qualquer reclamação administrativa."
    pedidos:
      - "Improcedência; subsidiariamente, compensação integral do valor creditado."
    pedidos_subsidiarios:
      - "Devolução ao réu do valor líquido creditado, corrigido, em caso de declaração de inexistência (T09)."
    risco_se_mal_aplicada: "Afirmar crédito em conta do autor quando a conta é de terceiro é o erro mais grave desta tipologia; pode configurar litigância de má-fé do réu."
    ativa: true

  - id: T08
    nome: "Ausência de dano moral — mero aborrecimento / ausência de prova do abalo"
    categoria: merito
    ordem: 10
    pai: null
    resumo: >-
      Ainda que se reconheça algum desconto indevido, não há dano moral in re ipsa em desconto de
      pequena monta prontamente reparável; ausência de prova de abalo extraordinário.
    condicoes_aplicacao:
      - { campo: valor_dano_moral_pedido, operador: ">", valor: 0 }
    provas_necessarias:
      - { tipo_documento: extrato_beneficio, descricao: "Proporção do desconto frente ao benefício", origem: subsidio, obrigatoria: true, peso: 0.7 }
    provas_que_afastam:
      - { tipo_documento: reclamacao_administrativa, descricao: "Reclamação prévia ignorada pelo réu por longo período", origem: subsidio, obrigatoria: false, peso: 0.8 }
      - { tipo_documento: extrato_beneficio, descricao: "Desconto que comprometeu parcela relevante de benefício de um salário mínimo (mínimo existencial)", origem: subsidio, obrigatoria: false, peso: 0.9 }
    fundamentacao:
      dispositivos:
        - { ref: "CC, arts. 186, 927 e 944", tipo: dispositivo, para_que_serve: "pressupostos da responsabilidade e proporcionalidade", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ — dano moral não presumido em desconto indevido de baixo valor × TJPA — orientação local (in re ipsa em consignado de aposentado?) [A CONFERIR]", tipo: precedente, para_que_serve: "saber se o TJPA presume o dano nesta tipologia", conferido: false, nota: "[A CONFERIR pelo advogado-dono — risco: há tribunais que presumem]" }
        - { ref: "TJPA — faixa usual de dano moral em consignado não reconhecido por comarca [A CONFERIR]", tipo: precedente, para_que_serve: "quantum subsidiário", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Ausência de prova de repercussão concreta; mero dissabor."
        - "Subsidiariamente, quantum moderado, proporcional ao valor descontado e à duração."
    pedidos:
      - "Improcedência do pedido de dano moral."
    pedidos_subsidiarios:
      - "Fixação em patamar moderado (faixa do TJPA [A CONFERIR]); juros e correção pelo índice legal vigente a partir do arbitramento (Súmula 362 STJ [A CONFERIR])."
    risco_se_mal_aplicada: "Chamar de 'mero aborrecimento' desconto que consome parte relevante de benefício mínimo de idoso soa insensível e piora o quantum."
    pendencia: null  # estratégia confirmada em 2026-10-19: negação do dano + subsidiário quantum moderado
    ativa: true

  # ---------------------------------------------------------------- SUBSIDIÁRIAS
  - id: T09
    nome: "Compensação / devolução dos valores creditados e repetição simples (não em dobro)"
    categoria: subsidiaria
    ordem: 11
    pai: null
    resumo: >-
      Se declarado inexistente o contrato, o valor disponibilizado ao autor deve ser compensado/
      restituído ao réu; a repetição das parcelas, se devida, é simples, por ausência de má-fé
      (observada a modulação do STJ sobre o art. 42 do CDC).
    condicoes_aplicacao:
      - { campo: valor_creditado_conta_autor, operador: "==", valor: true }
    provas_necessarias:
      - { tipo_documento: comprovante_ted, descricao: "Prova do crédito e do valor líquido", origem: subsidio, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: extrato_beneficio, descricao: "Total já descontado", origem: subsidio, obrigatoria: true, peso: 0.8 }
    provas_que_afastam:
      - { tipo_documento: comprovante_ted, descricao: "Crédito em conta de terceiro (não há o que compensar do autor)", origem: subsidio, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CC, arts. 368 a 380 e 884", tipo: dispositivo, para_que_serve: "compensação e enriquecimento sem causa", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
        - { ref: "CDC, art. 42, parágrafo único", tipo: dispositivo, para_que_serve: "repetição em dobro só sem engano justificável", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "STJ, EAREsp 676.608 (modulação: dobro independe de má-fé para cobranças após 30/03/2021) [A CONFERIR]", tipo: precedente, para_que_serve: "delimitar quando cabe o dobro — risco para contratos posteriores à modulação", conferido: false, nota: "[A CONFERIR pelo advogado-dono — número, data da modulação e aplicação a consignado]" }
      argumentos_chave:
        - "Vedado o enriquecimento sem causa: o autor não pode ficar com o valor creditado e receber as parcelas."
        - "Ausência de má-fé/engano justificável afasta a dobra; subsidiariamente, dobra limitada ao período pós-modulação."
    pedidos:
      - "Compensação do valor creditado com eventual condenação; repetição simples."
    pedidos_subsidiarios:
      - "Se dobra for reconhecida, limitação ao período admitido pela modulação do STJ."
    risco_se_mal_aplicada: "Pedir compensação sem prova de crédito ao autor."
    ativa: true

  # ---------------------------------------------------------------- SINAL (não é argumento autônomo)
  - id: T10
    nome: "Sinais de litigância predatória — providências processuais"
    categoria: sinal
    ordem: 12
    pai: null
    resumo: >-
      Não é uma tese de mérito; é uma escalada de providências em três níveis — (a) padrão:
      depoimento pessoal + exibição de documentos, na peça; (b) comunicação institucional do
      padrão ao Cijepa/NUMOPEDE do TJPA; (c) representação à OAB-PA em casos extremos. O nível (a)
      só entra na peça se o advogado-revisor confirmar os flags do M4; (b) e (c) exigem dupla
      autorização por escrito (sócio FBS + jurídico do cliente) registrada na plataforma. Jamais
      rotular o autor ou o advogado como fraudador.
    condicoes_aplicacao:
      - { campo: acoes_mesmo_advogado_mes_n, operador: ">=", valor: 10, nota: "nível 'atencao' da checagem concentracao_advogado_mes (≥ 10/mês); 'forte' é ≥ 30/mês — ver antifraude" }
    provas_necessarias:
      - { tipo_documento: relatorio_antifraude, descricao: "Flags do M4 com evidência e decisão humana registrada (human_decide)", origem: antifraude, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: relatorio_antifraude, descricao: "Flags não confirmados por advogado com OAB", origem: antifraude, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, arts. 77, 80, 139, III e 385", tipo: dispositivo, para_que_serve: "poderes do juiz, boa-fé, depoimento pessoal", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      precedentes:
        - { ref: "CNJ — Recomendação sobre litigância predatória; TJPA — Centro de Inteligência/NUMOPEDE [A CONFERIR]", tipo: norma_regulatoria, para_que_serve: "canal institucional para comunicar padrões", conferido: false, nota: "[A CONFERIR pelo advogado-dono]" }
      argumentos_chave:
        - "Nível (a): requerer depoimento pessoal do autor para confirmar ciência da ação e da procuração."
        - "Nível (a): requerer exibição de comprovante de residência atual, documento com foto e extratos."
        - "Nível (b), fora da peça: comunicar o padrão ao Cijepa/NUMOPEDE do TJPA sem imputar conduta a pessoa determinada — só com dupla autorização."
    pedidos:
      - "Depoimento pessoal do autor sob pena de confissão; exibição de documentos; demais providências que o juízo entender cabíveis."
    pedidos_subsidiarios: []
    risco_se_mal_aplicada: "Acusação de má-fé sem lastro gera condenação do réu e dano reputacional; só entra na peça após decisão humana registrada."
    pendencia: null
    providencias_escalonadas:
      - { nivel: a, descricao: "Padrão (na peça): depoimento pessoal do autor + exibição de documentos. Requer flags do M4 confirmados por human_decide.", autorizacao_dupla: false }
      - { nivel: b, descricao: "Comunicação institucional do padrão ao Cijepa/NUMOPEDE do TJPA (fora da peça; linguagem neutra; sem imputar conduta a pessoa). Requer nível 'forte' (≥ 30 ações/mês) ou padrão equivalente.", autorizacao_dupla: true }
      - { nivel: c, descricao: "Representação à OAB-PA — só em casos extremos, com dossiê de evidências.", autorizacao_dupla: true }
    ativa: true

