# =============================================================================
# Águia Peregrina — M0 Playbook — Consignado / RMC não reconhecido (defesa) — TJPA
# =============================================================================
# EM REVISÃO (sessão 1 em 2026-10-19: decisões 1–16; sessão 2 em 2026-10-20: referências
# conferidas contra o levantamento de 19/10/2026 e teses T01/T05/T06.1/T08/T09 ajustadas —
# ver metadata.revisoes e a seção "Decisões da revisão" do .md). Toda referência legal com
# `conferido: true` traz na `nota` a fonte e a data da conferência (sessão 2). O status só
