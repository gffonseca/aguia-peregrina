    Ações de consumidor (geralmente aposentado/pensionista do INSS ou servidor) que negam
    a contratação de empréstimo consignado, cartão consignado com reserva de margem (RMC)
    ou cartão benefício (RCC), pedindo declaração de inexistência do débito, devolução
    (em dobro) dos descontos e dano moral. Réu: instituição financeira regional cliente da FBS.
