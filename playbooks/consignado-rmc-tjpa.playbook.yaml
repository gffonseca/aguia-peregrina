metricas:
  - { id: M01, nome: "Tempo médio de revisão por contestação", definicao: "média de reviews.review_seconds para drafts desta tipologia", meta: "< 30 min com qualidade [meta a confirmar no piloto]", fonte: reviews }
  - { id: M02, nome: "Aprovação sem alteração substancial", definicao: "% de reviews aprovadas com substantial_change = false", meta: "> 60 % após 200 casos [meta a confirmar no piloto]", fonte: reviews }
  - { id: M03, nome: "Subsídios faltantes detectados antes da defesa", definicao: "% de casos com exceção X01/X07/X09 aberta antes de gerar minuta", meta: "> 90 %", fonte: "dossiers + excecoes" }
  - { id: M04, nome: "Taxa de êxito por tese × comarca", definicao: "outcomes.result ∈ {improcedente, parcial} por thesis_version_id e comarca vs. baseline FBS", meta: "≥ baseline + 10 p.p. [meta a confirmar no piloto]", fonte: outcomes }
  - { id: M05, nome: "Condenação média (dano moral + repetição) por comarca", definicao: "média de outcomes.award_value por comarca; alimenta faixas_valor", meta: "queda de 20 % vs. baseline [meta a confirmar no piloto]; referência externa TJPA 12 meses: dano moral R$ 3.000–5.000", fonte: outcomes }
  - { id: M06, nome: "Custo de tokens por processo", definicao: "soma de llm_calls.cost_usd por case_id", meta: "< US$ 2 por contestação [meta a confirmar no piloto]", fonte: llm_calls }
  - { id: M07, nome: "Concordância modelo × revisor sênior", definicao: "gt_tasks.agreement_score médio (amostra semanal)", meta: "> 0,85", fonte: gt_tasks }
  - { id: M08, nome: "Flags antifraude confirmados por humano", definicao: "% de fraud_checks com result = flag e human_decision = confirmed", meta: "monitorar precisão; recalibrar parâmetros se < 50 %", fonte: fraud_checks }
  - { id: M09, nome: "Acordos sinalizados × realizados", definicao: "casos com sinal de acordo vs. outcomes.result = acordo e valor médio", meta: "calibrar faixas_valor trimestralmente", fonte: outcomes }
