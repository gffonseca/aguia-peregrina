    - "superendividamento"
    - "portabilidade"
    - "busca e apreensão"
  confianca_minima: 0.85

# -----------------------------------------------------------------------------
# CAMPOS OBRIGATÓRIOS DO DOSSIÊ (M5)
# -----------------------------------------------------------------------------
campos_dossie_obrigatorios:
  # --- identificação do caso (extração dos autos) ---
  - { campo: comarca, tipo: texto, origem: extracao, descricao: "Comarca do juízo", obrigatorio: true }
  - { campo: tipo_produto, tipo: texto, origem: subsidio, descricao: "consignado | rmc | rcc | cartao_beneficio | refinanciamento", obrigatorio: true, bloqueia_minuta_se_ausente: true }
  - { campo: valor_causa, tipo: valor_monetario, origem: extracao, descricao: "Valor da causa", obrigatorio: true }
  - { campo: valor_dano_moral_pedido, tipo: valor_monetario, origem: extracao, descricao: "Valor pedido a título de dano moral", obrigatorio: false }
  - { campo: valor_contrato, tipo: valor_monetario, origem: subsidio, descricao: "Valor liberado/limite do contrato", obrigatorio: true }
  - { campo: data_contrato, tipo: data, origem: subsidio, descricao: "Data da contratação", obrigatorio: true }
  - { campo: data_primeiro_desconto, tipo: data, origem: subsidio, descricao: "Primeira parcela descontada", obrigatorio: true }
  - { campo: data_ultimo_desconto, tipo: data, origem: subsidio, descricao: "Último desconto efetivado (ou data-base, se os descontos continuam) — termo inicial do prazo do CDC 27 na linha dominante STJ/TJPA (trato sucessivo)", obrigatorio: false }
  - { campo: data_ajuizamento, tipo: data, origem: extracao, descricao: "Data de distribuição", obrigatorio: true }
  - { campo: data_ciencia_inequivoca, tipo: data, origem: calculado, descricao: "Data presumida de ciência do desconto (= data_primeiro_desconto salvo prova diversa) — usada só como argumento acessório em T05 (linha minoritária do STJ), não como termo da tese principal", obrigatorio: true }
  - { campo: autor_idade, tipo: numero, origem: extracao, descricao: "Idade do autor na data do ajuizamento", obrigatorio: false }
  - { campo: autor_beneficiario_inss, tipo: booleano, origem: extracao, descricao: "Autor é aposentado/pensionista do INSS", obrigatorio: true }
  - { campo: autor_nega_contratacao, tipo: booleano, origem: extracao, descricao: "Inicial nega totalmente a contratação (vs. alega vício de consentimento)", obrigatorio: true, bloqueia_minuta_se_ausente: true }
  - { campo: autor_alega_vicio_rmc, tipo: booleano, origem: extracao, descricao: "Autor diz que pensou contratar consignado e recebeu cartão RMC/RCC", obrigatorio: false }
  - { campo: autor_pede_gratuidade, tipo: booleano, origem: extracao, descricao: "Pedido de justiça gratuita", obrigatorio: true }
  - { campo: renda_declarada_autor, tipo: valor_monetario, origem: extracao, descricao: "Renda mensal que consta dos autos (benefício/holerite) — gatilho interno de T01; não é argumento da peça", obrigatorio: false }
  - { campo: inicial_atende_requisitos_tema_1198, tipo: booleano, origem: extracao, descricao: "Inicial traz procuração atualizada/com poderes específicos, comprovante de residência atual, extratos do período e individualização do contrato — elementos que o Tema 1.198/STJ autoriza o juiz a exigir em emenda quando há indícios de litigância abusiva", obrigatorio: true }
  - { campo: reclamacao_administrativa_previa, tipo: booleano, origem: subsidio, descricao: "Houve SAC/ouvidoria/consumidor.gov antes da ação", obrigatorio: false }
  # --- subsídios do cliente (M3) ---
  - { campo: contrato_localizado, tipo: booleano, origem: subsidio, descricao: "Cliente localizou o instrumento contratual", obrigatorio: true, bloqueia_minuta_se_ausente: true }
  - { campo: contrato_assinatura_tipo, tipo: texto, origem: subsidio, descricao: "biometria_facial | assinatura_digital_icp | assinatura_eletronica_simples | fisica | digital_telefone | nenhuma", obrigatorio: true }
  - { campo: biometria_score, tipo: numero, origem: subsidio, descricao: "Score da biometria facial (0–1), se houver", obrigatorio: false, disponibilidade: "a confirmar com cliente" }
  - { campo: documento_selfie_coincide, tipo: booleano, origem: subsidio, descricao: "Selfie × documento com match registrado pelo fornecedor de biometria", obrigatorio: false, disponibilidade: "a confirmar com cliente" }
  - { campo: geolocalizacao_compativel, tipo: booleano, origem: subsidio, descricao: "Lat/long da contratação compatível com endereço do autor", obrigatorio: false }
  - { campo: ip_log_disponivel, tipo: booleano, origem: subsidio, descricao: "Há log de IP/dispositivo/horário da contratação", obrigatorio: true, disponibilidade: "a confirmar com cliente" }
  - { campo: valor_creditado_conta_autor, tipo: booleano, origem: subsidio, descricao: "TED/PIX/crédito em conta de titularidade do próprio autor", obrigatorio: true, bloqueia_minuta_se_ausente: true, disponibilidade: "a confirmar com cliente" }
  - { campo: conta_credito_titularidade, tipo: texto, origem: subsidio, descricao: "autor | terceiro | desconhecida", obrigatorio: true }
  - { campo: ted_comprovante_localizado, tipo: booleano, origem: subsidio, descricao: "Comprovante de TED/PIX/ordem de pagamento juntável", obrigatorio: true, disponibilidade: "a confirmar com cliente" }
  - { campo: extratos_mostram_uso, tipo: booleano, origem: subsidio, descricao: "Extratos mostram saque/uso do valor creditado", obrigatorio: false }
  - { campo: rmc_houve_saque_ou_compra, tipo: booleano, origem: subsidio, descricao: "No RMC/RCC, houve saque autorizado ou compras no cartão", obrigatorio: false }
  - { campo: rmc_tce_localizado, tipo: booleano, origem: subsidio, descricao: "No RMC/RCC: Termo de Consentimento Esclarecido (TCE) / termo de adesão com destaque do produto cartão, da reserva de margem e do CET, assinado pelo autor — pilar da validade do RMC no TJPA", obrigatorio: false }
  - { campo: descontos_parcelas_n, tipo: numero, origem: subsidio, descricao: "Nº de parcelas já descontadas", obrigatorio: true }
  - { campo: audio_sac_disponivel, tipo: booleano, origem: subsidio, descricao: "Há gravação de SAC/telemarketing com o autor", obrigatorio: false }
  - { campo: contratos_ativos_autor_n, tipo: numero, origem: subsidio, descricao: "Nº de contratos do autor com o cliente", obrigatorio: true }
  - { campo: contratos_anteriores_adimplidos, tipo: booleano, origem: subsidio, descricao: "Autor tem histórico de contratos anteriores pagos sem questionamento", obrigatorio: false }
  # --- cruzamentos (antifraude / publicações) ---
  - { campo: litispendencia_cnj, tipo: lista, origem: antifraude, descricao: "Processos em curso com mesmas partes/causa/pedido", obrigatorio: true }
  - { campo: coisa_julgada_cnj, tipo: lista, origem: antifraude, descricao: "Processos transitados com mesmas partes/causa/pedido", obrigatorio: true }
  - { campo: acoes_mesmo_autor_mesmo_reu_n, tipo: numero, origem: antifraude, descricao: "Nº de ações do autor contra o cliente (carteira + publicações)", obrigatorio: true }
  - { campo: acoes_mesmo_advogado_mes_n, tipo: numero, origem: antifraude, descricao: "Nº de ações do mesmo advogado contra o cliente no mês", obrigatorio: true }
  - { campo: autor_falecido, tipo: booleano, origem: antifraude, descricao: "Indício de óbito do autor antes do ajuizamento/procuração", obrigatorio: true }
  - { campo: data_procuracao, tipo: data, origem: extracao, descricao: "Data da procuração juntada", obrigatorio: true }
  - { campo: comprovante_endereco_titular, tipo: texto, origem: extracao, descricao: "autor | terceiro | ausente", obrigatorio: true }
  - { campo: indicio_fraude_contra_autor, tipo: booleano, origem: calculado, descricao: "Sinais de que a fraude pode ter sido real (IP/geo incompatível, conta de terceiro, sem biometria)", obrigatorio: true }
  - { campo: hipotese_afastamento_dano_moral, tipo: texto, origem: calculado, descricao: "contratacao_provada | inercia_prolongada | rmc_credito_recebido | nenhuma — única situação em que T08 (negação do dano) entra na peça; derivado de T06 aplicável com dossiê completo, de reclamacao_administrativa_previa/descontos_parcelas_n (inércia) ou de tipo_produto RMC + valor_creditado_conta_autor", obrigatorio: true }

# -----------------------------------------------------------------------------
# ÁRVORE DE TESES
# -----------------------------------------------------------------------------
teses:
  # ---------------------------------------------------------------- PRELIMINARES
  - id: T01
    nome: "Impugnação à gratuidade de justiça"
    categoria: preliminar
    ordem: 1
    pai: null
    resumo: >-
      O autor pede gratuidade, mas há elementos concretos nos autos (renda e patrimônio
      documentados, extratos, padrão de contratação, veículos/imóveis) que afastam a presunção
      relativa de hipossuficiência. A peça argumenta só com esses elementos e requer o
      procedimento do art. 99, § 2º (intimação para comprovar), além de pesquisa patrimonial
      (Infojud/Renajud). Decisão de 20/10/2026: nenhum critério objetivo de renda (3 SM ou
      faixa de IR) é afirmado na peça — o TJPA veda critério fixo. O gatilho por renda abaixo
      é interno, só para decidir se vale levantar a preliminar.
    condicoes_aplicacao:
      - { campo: autor_pede_gratuidade, operador: "==", valor: true }
      - { campo: renda_declarada_autor, operador: ">", valor: 4554.0, nota: "gatilho INTERNO (≈ 3 salários mínimos de 2025); decide apenas se a preliminar é levantada; a peça nunca cita esse limiar como critério — TJPA veda critério objetivo fixo (AI 0820042-02.2025.8.14.0000)" }
    provas_necessarias:
      - { tipo_documento: extrato_beneficio, descricao: "Histórico de créditos/HISCRE ou holerite", origem: extracao, obrigatoria: true, peso: 0.9 }
      - { tipo_documento: extrato_bancario, descricao: "Extratos com movimentação incompatível com hipossuficiência", origem: subsidio, obrigatoria: false, peso: 0.6 }
      - { tipo_documento: contrato, descricao: "Outros contratos ativos do autor com o cliente (volume de crédito tomado)", origem: subsidio, obrigatoria: false, peso: 0.5 }
      - { tipo_documento: pesquisa_patrimonial, descricao: "Infojud/Renajud/veículos/imóveis — requerida ao juízo (Rec. CNJ 159/2024, Anexo B, item 4) ou já constante dos autos", origem: publicacao, obrigatoria: false, peso: 0.8 }
    provas_que_afastam:
      - { tipo_documento: declaracao_hipossuficiencia, descricao: "Só há a declaração e a renda do benefício, sem nenhum outro elemento concreto nos autos (presunção do art. 99, § 3º prevalece)", origem: extracao, obrigatoria: false, peso: 0.8 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, arts. 98 a 100", tipo: dispositivo, para_que_serve: "presunção relativa (art. 99, § 3º) e impugnação à gratuidade (art. 100)", conferido: true, nota: "Conferido 20/10/2026 — texto legal vigente (Lei 13.105/2015, Planalto)" }
        - { ref: "CPC, art. 99, § 2º", tipo: dispositivo, para_que_serve: "indeferimento só após intimação para comprovar, quando houver nos autos elementos que evidenciem falta de pressupostos", conferido: true, nota: "Conferido 20/10/2026 — texto legal vigente; é o procedimento que o TJPA exige antes de indeferir (AI 0820042-02.2025.8.14.0000)" }
        - { ref: "CPC, art. 98, § 6º", tipo: dispositivo, para_que_serve: "parcelamento das custas (pedido subsidiário)", conferido: true, nota: "Conferido 20/10/2026 — texto legal vigente" }
      precedentes:
        - { ref: "TJPA, AgInt no AI 0820042-02.2025.8.14.0000, 2ª Turma de Direito Público, Rel. Des. Mairton Marques Carneiro, j. 04/05/2026, publ. 12/05/2026", tipo: precedente, para_que_serve: "veda critérios objetivos fixos de renda para a gratuidade; exige análise individualizada e prévia observância do art. 99, § 2º — por isso a impugnação aponta elementos concretos e pede intimação, nunca um limiar de renda", conferido: true, nota: "Conferido 20/10/2026 — portal de jurisprudência do TJPA (buscar pelo nº CNJ)" }
        - { ref: "TJPA, AI 0802127-03.2026.8.14.0000, 2ª Turma de Direito Público, Rel. Des. Mairton Marques Carneiro, j. 18/05/2026", tipo: precedente, para_que_serve: "risco — DIRPF com renda anual tributável de R$ 17.414,67 sem imposto a pagar, veículos em nome da parte e advogado particular não afastam a presunção; calibra o que conta como elemento concreto", conferido: true, nota: "Conferido 20/10/2026 — portal de jurisprudência do TJPA" }
        - { ref: "CNJ, Recomendação nº 159, de 23/10/2024, Anexo B, item 4", tipo: norma_regulatoria, para_que_serve: "respalda o pedido de comprovação da situação socioeconômica por Infojud/Renajud", conferido: true, nota: "Conferido 20/10/2026 — https://atos.cnj.jus.br/atos/detalhar/5822 (texto integral: espelho TJAC, SEI 14934/2024)" }
      argumentos_chave:
        - "A presunção do art. 99, § 3º, é relativa e cede diante de elementos concretos dos autos: renda documentada, extratos, volume de crédito contratado, patrimônio (veículos/imóveis)."
        - "Não se invoca limiar de renda: pede-se a análise individualizada que o próprio TJPA exige, com intimação do autor para comprovar (art. 99, § 2º)."
        - "Requer-se pesquisa patrimonial (Infojud/Renajud) nos termos da Rec. CNJ 159/2024, Anexo B, item 4."
    pedidos:
      - "Intimação do autor para comprovar a hipossuficiência (CPC, art. 99, § 2º), com pesquisa Infojud/Renajud; revogação/indeferimento da gratuidade se não comprovada."
    pedidos_subsidiarios:
      - "Parcelamento das custas (CPC, art. 98, § 6º)."
    risco_se_mal_aplicada: "Impugnar gratuidade de aposentado com um salário mínimo, ou com base em limiar fixo de renda, contraria a orientação do TJPA (AI 0820042-02.2025.8.14.0000), irrita o juízo e enfraquece a credibilidade da defesa."
    ativa: true

  - id: T02
    nome: "Emenda da inicial — Tema 1.198/STJ (litigância abusiva) e requisitos do CPC"
    categoria: preliminar
    ordem: 2
    pai: null
    resumo: >-
      Há indícios de litigância abusiva (petição padronizada, procuração antiga ou genérica,
      comprovante de residência ausente/de terceiro, múltiplas ações) e a inicial não traz os
      elementos mínimos que o Tema 1.198/STJ autoriza o juiz a exigir, de modo fundamentado e
      proporcional: procuração atualizada/com poderes específicos, comprovante de residência
      atual, extratos do período e individualização do contrato. Pede-se emenda fundamentada
      e proporcional — NUNCA cópia do contrato (o autor nega tê-lo firmado) e NÃO extinção
      direta (o TJPA está dividido e anula extinções sem prévia oportunidade de emenda).
    condicoes_aplicacao:
      - { campo: inicial_atende_requisitos_tema_1198, operador: "==", valor: false }
    provas_necessarias:
      - { tipo_documento: peticao_inicial, descricao: "Inicial e anexos (para apontar o que falta)", origem: extracao, obrigatoria: true, peso: 1.0 }
      - { tipo_documento: relatorio_antifraude, descricao: "Indícios de abuso (peticao_padronizada, procuracao_antiga, comprovante_endereco_terceiro, concentracao_advogado_mes) — o Tema 1.198 exige indícios para fundamentar a emenda", origem: antifraude, obrigatoria: true, peso: 0.9 }
    provas_que_afastam:
      - { tipo_documento: despacho, descricao: "Juízo já determinou emenda ou declarou a inicial apta", origem: publicacao, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, arts. 319, 320, 321 e 330", tipo: dispositivo, para_que_serve: "requisitos da inicial e emenda (art. 321: prazo de 15 dias com indicação precisa do que corrigir)", conferido: true, nota: "Conferido 20/10/2026 — texto legal vigente" }
      precedentes:
        - { ref: "STJ, Tema repetitivo 1.198 — REsp 2.021.665/MS, Corte Especial, Rel. Min. Moura Ribeiro, j. 13/03/2025, publ. DJEN 11/06/2026", tipo: tema, para_que_serve: "tese: constatados indícios de litigância abusiva, o juiz pode exigir, de modo fundamentado e com razoabilidade, a emenda da inicial para demonstrar interesse de agir e autenticidade da postulação, respeitadas as regras do ônus da prova. Voto: exigir cópia do contrato é inadequado em declaratória de inexistência; extratos, comprovante de residência e procuração atualizada são exigíveis conforme o caso; não cabe exigir juntada das iniciais de outras ações", conferido: true, nota: "Conferido 20/10/2026 — acórdão: https://portal.trt3.jus.br/internet/jurisprudencia/stj-repetitivos/downloads/acordao-tema1198.pdf; origem IRDR 16/TJMS (ações de consignado em massa)" }
        - { ref: "CNJ, Recomendação nº 159, de 23/10/2024 (Anexo A: condutas potencialmente abusivas — itens 5, 6, 11, 13; Anexo B: medidas — itens 2, 4, 8, 9, 14, 15)", tipo: norma_regulatoria, para_que_serve: "respaldo para exigências documentais proporcionais e para a oitiva do autor; é orientativa (TJPA 3ª T., Ap. 0808446-17.2024.8.14.0045)", conferido: true, nota: "Conferido 20/10/2026 — https://atos.cnj.jus.br/atos/detalhar/5822; 'comprovante de residência' não é citado nominalmente (ver itens A5, B9 e B14)" }
        - { ref: "TJPA, Ap. 0800038-32.2026.8.14.0121, 1ª Turma de Direito Privado, Rel. Des. Alex Pinheiro Centeno, j. 15/06/2026 (e Ap. 0800044-39.2026.8.14.0121, j. 27/07/2026)", tipo: precedente, para_que_serve: "linha que admite a emenda fundada no Tema 1.198 e na Rec. CNJ 159 diante de múltiplas demandas, e mantém o indeferimento se descumprida", conferido: true, nota: "Conferido 20/10/2026 — portal de jurisprudência do TJPA" }
        - { ref: "TJPA, Ap. 0802538-44.2025.8.14.0012, 3ª Turma de Direito Privado, Rel. Desa. Anete Marques Penna de Carvalho, j. 16/06/2026; Ap. 0800798-60.2025.8.14.0009, 2ª Turma de Direito Privado, Rel. Desa. Gleide Pereira de Moura, j. 05/05/2026", tipo: precedente, para_que_serve: "risco — indícios não autorizam indeferimento imediato sem emenda; exigências fora dos arts. 319/320 (procuração 'com validade', extratos) são vistas como formalismo; por isso o pedido é de emenda proporcional, não de extinção", conferido: true, nota: "Conferido 20/10/2026 — portal de jurisprudência do TJPA" }
      argumentos_chave:
        - "Há indícios concretos de abuso (apontar os flags confirmados) e a inicial é genérica: não individualiza o contrato impugnado nem traz procuração atualizada e comprovante de residência atual."
        - "O Tema 1.198/STJ autoriza o juízo a exigir, fundamentadamente e com proporcionalidade, a emenda para demonstrar interesse de agir e autenticidade da postulação."
        - "Pedido proporcional: procuração atualizada com poderes específicos, comprovante de residência atual em nome do autor e ratificação pessoal da ação; não se pede cópia do contrato nem a juntada de outras iniciais."
    pedidos:
      - "Intimação do autor para emendar a inicial (CPC, art. 321), de forma fundamentada e proporcional, juntando procuração atualizada com poderes específicos, comprovante de residência atual e ratificação pessoal da propositura."
    pedidos_subsidiarios:
      - "Suspensão do prazo de defesa até a emenda, se ainda cabível."
    risco_se_mal_aplicada: "Pedir extinção direta, cópia do contrato ou documentos sem relação com os indícios: a 2ª T. (Gleide Moura) e parte da 3ª T. (Filomena Buarque; Anete Penna) anulam por formalismo excessivo; se a inicial já atende aos requisitos, a preliminar soa protelatória."
    ativa: true

  - id: T03
    nome: "Litispendência ou coisa julgada"
    categoria: preliminar
    ordem: 3
