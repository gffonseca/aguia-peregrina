# -----------------------------------------------------------------------------
# GATILHOS DE CLASSIFICAÇÃO (M1/M9)
# -----------------------------------------------------------------------------
# Códigos TPU conferidos em 20/10/2026 pelos metadados dos acórdãos do portal do TJPA
# (facetas de assunto, out/2025–out/2026). Não existe assunto TPU específico para "RMC":
# o TJPA autua cartão consignado como 9585/7772, 11806 ou 11811 — por isso a palavra-chave.
gatilhos_classificacao:
  assuntos_cnj:
    - { codigo: "11806", nome: "Empréstimo consignado", conferido: true }
    - { codigo: "9607", nome: "Contratos bancários", conferido: true }
    - { codigo: "9585", nome: "Cartão de crédito (ramo Contratos bancários) — usado para RMC/RCC", conferido: true }
    - { codigo: "7772", nome: "Cartão de crédito (ramo Contratos de consumo) — usado para RMC/RCC", conferido: true }
    - { codigo: "10433", nome: "Indenização por dano moral", conferido: true }
    - { codigo: "11811", nome: "Práticas abusivas", conferido: true }
  classes_cnj:
    - { codigo: "7", nome: "Procedimento Comum Cível [não coberto pelo levantamento de 19/10/2026 — conferir no SGT/CNJ]", conferido: false }
    - { codigo: "436", nome: "Procedimento do Juizado Especial Cível [não coberto pelo levantamento de 19/10/2026 — conferir no SGT/CNJ]", conferido: false }
  palavras_chave:
    - "empréstimo consignado"
    - "consignado não contratado"
    - "não reconhece"
    - "desconto indevido"
    - "reserva de margem consignável"
    - "RMC"
    - "RCC"
    - "cartão consignado"
    - "cartão benefício"
    - "inexistência de débito"
    - "repetição do indébito"
    - "benefício previdenciário"
  palavras_que_excluem:
