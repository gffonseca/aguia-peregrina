    são provisórias; disponibilidade de log/biometria/TED a confirmar com o cliente.
  revisoes:
    - data: 2026-10-19
      por: "Gustavo Fonseca OAB/PA 12.724"
      resumo: "Sessão 1 de revisão: decisões 1–16"
  piloto:
