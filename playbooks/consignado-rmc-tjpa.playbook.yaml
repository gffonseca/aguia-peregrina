    condicoes_aplicacao:
      - { campo: litispendencia_cnj, operador: existe }
    provas_necessarias:
      - { tipo_documento: certidao_processo, descricao: "Cópia da inicial e andamento do processo anterior", origem: antifraude, obrigatoria: true, peso: 1.0 }
    provas_que_afastam:
      - { tipo_documento: peticao_inicial, descricao: "Contratos distintos (número/data/valor) comprovadamente diferentes", origem: extracao, obrigatoria: false, peso: 1.0 }
    fundamentacao:
      dispositivos:
        - { ref: "CPC, art. 337, VI e VII, §§ 1º a 4º", tipo: dispositivo, para_que_serve: "litispendência e coisa julgada", conferido: true, nota: "Conferido 20/10/2026 — texto legal vigente" }
        - { ref: "CPC, art. 485, V", tipo: dispositivo, para_que_serve: "extinção sem mérito", conferido: true, nota: "Conferido 20/10/2026 — texto legal vigente" }
        - { ref: "CPC, art. 55", tipo: dispositivo, para_que_serve: "conexão (pedido subsidiário)", conferido: true, nota: "Conferido 20/10/2026 — texto legal vigente" }
      precedentes: []
